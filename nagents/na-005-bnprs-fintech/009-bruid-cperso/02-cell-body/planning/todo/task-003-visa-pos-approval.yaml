# task-003 — Visa POS approval
# ROOT CAUSE FOUND 2026-08-16: 9F07 Application Usage Control = C080 (orchestrator.cpp:308).
# The 2026-07-24 CVM diagnosis was WRONG (wrong TVR byte). Full analysis in
# 08-memory/long-term/visa-pos-groundtruth.md. Do NOT re-derive — start from below.

task:
  id: "task-003"
  subject: "Get our Visa card to an APPROVED POS sale (AUC 9F07=C080 is the decline cause; fix + retest)"
  description: >
    Our perso'd Visa reads fine at the Sunmi/aeonpay POS but the terminal declines OFFLINE
    (Terminal Action Analysis -> AAC, GENERATE AC P1=00, CID=00). Kernel diag DF816F gives
    TVR=2890808000 vs TAC/IAC-Denial=0010000000. The SOLE denial bit is TVR byte 2 bit 0x10 =
    "Requested service not allowed for card product" = Processing Restrictions / Application
    Usage Control. Our 9F07 = C080 (cash only; b2 valid-at-ATM = 0 AND b1 valid-at-other-terminals
    = 0), so the bit is set on EVERY terminal for EVERY transaction type. Reference Visa card on
    the same terminal has 9F07 = FF80 and passes. Full TLV diff of the two cards shows 9F07 as the
    only decline-causing difference.
  status: in_progress
  priority: high
  created_at: "2026-07-24"
  updated_at: "2026-08-16"
  assigned_to: null
  blocked_by: []
  blocks: []
  estimated_steps: 3
  tags: [visa, pos, emv, terminal-action-analysis, auc, 9f07, processing-restrictions, kiosk-dxb-014]

