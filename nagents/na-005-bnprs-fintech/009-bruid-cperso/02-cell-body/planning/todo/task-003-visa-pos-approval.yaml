  - id: "task-003.10"
    what: >
      Spanned-DGI support in the Visa STORE DATA path — DONE + DEPLOYED 2026-08-16.
      encode_dgi now switches to the 3-byte FF len16 form at the APDU boundary (data > 252) rather
      than at 0xFF, because VSDC 2.9.2 4.4 requires the long form whenever a DGI is spanned (its own
      example uses FF00FE for 254, where one byte would fit). The Visa loop spans a DGI across two
      STORE DATA commands with P2 advancing PER COMMAND, end-of-perso P1.b8 on the final command
      overall, and a guard that refuses >2 commands — replacing Lc = (uint8_t)dgi.size(), which
      silently truncated an oversized DGI into a malformed command.
    proof: >
      100/100 tests on macOS arm64 and linux/arm64 (2 new KATs pin the 252/253 boundary and
      reproduce the manual's worked issuer-certificate example byte-for-byte).
      Bureau binary sha256 e80ef88ff7b363f8f6945ea1d72d82b8b92605663da76344f226598c8ff7e86c,
      identical local and on the instance; previous (8e907be9…) kept as
      ~/bureau/bpr-iperso-bureau.bak-pre-spandgi. Service active, pid 156416, clean start on 9099
      TLS. Temp SG ingress added for the deploy and REVOKED after (SG confirmed back to its original
      2 x port-22 and 4 x port-9099 CIDRs).
    note: >
      BEHAVIOURALLY A NO-OP TODAY and deliberately so: at the 1792-bit test CA the ODA record encodes
      to 254 bytes (one command) so the spanning path never triggers, and fullOdaCertChain is false
      so no certificate DGI is emitted at all. Its value is latent — it is what lets a real 1984-bit
      issuer certificate load, and it removes the silent-truncation trap.
    completed_at: "2026-08-16"

