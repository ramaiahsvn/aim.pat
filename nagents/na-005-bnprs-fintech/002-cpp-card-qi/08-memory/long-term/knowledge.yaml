  - id: mem-009
    type: technical_knowledge
    content: >-
      2026-08-11 WHAT THE GnD CENTRAL-PERSO SCRIPT ACTUALLY IS, and why the test card rejected it.
      Established from the full 123-APDU dump (native macOS harness over the C-ABI, no card needed).
      IT IS A NATIVE FILE-SYSTEM BUILD, NOT APPLET INSTALL/INSTANTIATION. Breakdown of all 123:
        00D6 UPDATE BINARY x49, 80E0 CREATE FILE x35, 00E2 APPEND RECORD x23,
        00A4 SELECT FILE x7, 007C x5 (proprietary), 908C x2, 903C x1, 903a x1.
      ZERO occurrences of 80E6 INSTALL, 80E8 LOAD, 8050 INITIALIZE UPDATE, 8482 EXTERNAL AUTHENTICATE.
      DECISIVE PROOF it never touches an applet: ALL SEVEN SELECTs are `00A4 00 00 02` — P1=00, select
      by 2-byte FILE ID. Not one is P1=04 (by AID). Applets are addressed by AID; this script never
      selects one, so it cannot be installing or instantiating anything.
      The four CLA 90 commands are the vendor's INITIALISATION: 903C + 908C unlock the card into the
      state where files may be created; 903a (line 1422) stamps identity as
      "903a00000800080103" + CARD_ID. So "initiation" is the right instinct, "applet" is not.
      WHY THE TEST CARD FAILED (verified live, not inferred): APDU 0 (903C) -> 6900 COMMAND NOT
      ALLOWED; APDU 1 (908C) -> 9000; APDU 2 (80E0) -> 9000; APDU 3 (80E0) -> 6A89 FILE ALREADY
      EXISTS. The card is ALREADY PERSONALISED — it has a populated file system, so it is past the
      pre-perso lifecycle stage that 903C unlocks. A successful run needs a VIRGIN card. My earlier
      hypothesis that it was a JavaCard/GlobalPlatform card was WRONG and is disproven: it accepted a
      native 80E0 CREATE FILE with 9000.
      NOTE the skip-test wrote to the card: skipping APDUs 0-1 let APDU 2 create a file (9000) on an
      already-personalised card, so that card is no longer a clean reference sample.
      SECURITY — TWO HARDCODED CREDENTIALS. apdu_qi_write_central_perso_gnd.cpp:794 and :802 hold the
      903C and 908C APDUs as string literals, each carrying a FIXED 16-BYTE payload, identical for
      every card, no comment. A 16-byte constant presented to a proprietary authenticate command is a
      KEY. Same class as [[mem-004]], and note commit 8ad7ad3 was titled "replace hardcoded 3DES key
      with cloud mTLS API" — that removed one from BprCardQi while these two remained. VALUES ARE
      DELIBERATELY NOT RECORDED HERE; refer to the file:line. Route via na-005/004 cpp-card-pure and
      na-003/007 bnprs-grc-kms.
      THE RASPBERRY ACCEPT-LIST WOULD HAVE CALLED THIS REJECTION A SUCCESS — concrete evidence for
      the [[mem-005]] warning. Raspberry v2.22.31 and Windows 2.22.28 have BYTE-IDENTICAL inputs
      (qiscript.ini, qiscript.c.perso-bio.dat, qiScript.java, ErrorCodes, header), so both generate
      the same 123 APDUs. The card's 6900 is host-independent. But QiScripts.cpp:168-181 accepts
      pbRecvBuffer[0]==0x69, and 6900's first byte IS 0x69 — so the Pi would have printed "-> OK" for
      the exact rejection diagnosed here, continued, and skipped the last four commands.
      "It was working on Raspberry" is therefore NOT evidence a card was personalised.
      AND THE SKIPPED COMMANDS ARE THE BIOMETRIC PAYLOAD: the last five are the 007C writes at
      indices 118-122, 226-238 bytes each, from qiscript.c.perso-**bio**.dat. The Pi's
      `cnt >= numberOfCommands - 4` guard means the largest and most important writes were never
      checked by anything. This makes the read-back recommendation in [[mem-005]] materially more
      urgent than "a few commands go unchecked".
    created_at: "2026-08-11"
