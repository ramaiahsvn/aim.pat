      CN=bpr-cardqi-fleet, valid to 2036-05-15", "Generated: 2026-05-18", and "PFX bundle (empty
      password) — used by Windows WinHTTP via PFXImportCertStore". Added in the single commit
      8ad7ad3 (2026-05-18), "BprCardQi: replace hardcoded 3DES key with cloud mTLS API
      (k3-verifychallenge)" — the change that removed a hardcoded 3DES key introduced this.
      WHY IT IS WORSE THAN A TYPICAL LEAK, three reasons compounding:
      1. FLEET-WIDE. One credential shared by every deployed terminal for mTLS to the
         k3-verifychallenge endpoint. Compromise is not per-device; it is the whole estate.
      2. TEN-YEAR LIFETIME. Valid to 2036-05-15, so it does not expire out of the problem.
      3. EMPTY PFX PASSWORD. Nothing else has to be obtained — the header alone is the key.
      IT IS ALSO IN GIT HISTORY from 8ad7ad3 onward, so deleting the file does not undo the
      exposure. ROTATION IS THE ONLY REAL REMEDY, and rotating a fleet cert invalidates every
      deployed terminal at once — that is a release decision, not a code fix, which is why it was
      recorded rather than acted on. Route through na-002-bnprs-core, with na-003/008 bnprs-grc
      for the PCI angle and na-006 for the rollout.
