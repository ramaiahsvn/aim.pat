  - id: mem-003
    type: project_context
    content: >-
      THE C ABI IS A CROSS-AGENT CONTRACT. bnprs/include is bound by hand in the frontend's
      crates/kms-hsm/src/real.rs (owned by na-005/011 bruid-kms), and that file is cfg-gated off
      macOS. So an ABI change here does NOT fail on a dev Mac - it fails only on a Linux
      --features real-hsm build. Always notify bruid-kms when a signature moves.
      Worked example: commit c4b162d changed BprHsm_Cavv_Generate's output from char*[] to int*,
      and the frontend's generate_cavv was still returning function_not_supported with the comment
      "until the backend ABI gains one" - which it had.
    created_at: "2026-08-12"
