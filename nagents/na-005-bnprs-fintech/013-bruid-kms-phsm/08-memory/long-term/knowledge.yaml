  - id: mem-005
    type: technical_knowledge
    content: >-
      2026-08-12 THE FM RUNS WITHOUT AN HSM, AND IT RUNS ON THIS MAC. This is the single most
      useful fact this agent owns: FM work is no longer gated on hardware. The FM SDK Programming
      Guide says so under "FMs in Emulation Mode" - emulation uses the HSM Software Emulation
      library, and the signing and installation steps do not apply. No mkfm, no signing key, no
      device. Proven end to end: BprHsmFm built with EMUL=1, the host shim linked against it, and
      cavv_generate returned CAVV 098 from the FM's own fm_cavv.c. Full recipe, kept current:
      docs/rust-migration/FM_EMULATOR.md in the FE repo (scripts/fm-emulator/ holds the Dockerfile
      and setup.sh).
      WHY A CONTAINER: emulation dlopens the FM as a shared library INTO THE CALLING PROCESS, so
      host and FM must be the same OS/arch. Thales ships linux-x86_64 and Windows only. Hence
      --platform linux/amd64 on Apple Silicon - slow to build, fine to run, nothing here is
      compute-heavy.
      FOUR TRAPS, each of which cost real time:
      (1) safenet/protecttoolkit7/cpsdk/lib/linux-x86_64/libcryptoki.so IS A BROKEN SYMLINK - it
      points at /workspaces/trp1003.phsm.kms/... , an absolute path inside somebody's dev container,
      so it resolves nowhere else and every vendor utility dies with "Failed to open cryptoki
      emulation". In this layout CRYPTOKI IS THE SOFTWARE HSM: re-point it at libctsw.so,
      relatively. Worth fixing in THIS repo rather than in every consumer - it is our bug to fix.
      (2) CPROVLIBDIR misses the arch subdir: cfgbuild.mak has CPROVLIBDIR?=$(CPROVDIR)/lib but the
      libraries live in lib/linux-x86_64, so the link fails on -lctutil. It is a ?= , so exporting
      the corrected value is enough - no repo change needed.
      (3) The admin utilities and the emulated host need DIFFERENT library paths. ctconf/ctkmu
      administer the software HSM and must load the plain cryptoki; if the FM emulation wrapper is
      on their path they load that instead, it initialises cryptoki underneath them, and their own
      C_Initialize returns 0x191 "already initialized". Keep ADMIN_LD and EMUL_DIR separate.
      (4) `ctconf -n0` prompts SEVEN times (Admin SO pin x2, Administrator pin x2, token label, then
      slot-0 SO pin x2). Feed fewer lines and an empty string lands in a PIN field, giving
      "0xa2, PIN length range" - which reads like a policy problem rather than a scripting one.
      TWO MORE THAT ARE RUNTIME, NOT BUILD TIME: CPROVDIR is read AT RUNTIME (the emulation cryptoki
      dlopens $CPROVDIR/lib/libctsw.so; unset, it looks in /lib and the caller sees HSM error 0x000B
      from init(), which looks like a device fault rather than a missing variable). And TWO
      C_Initialize CALLS IN ONE PROCESS SEGFAULT - not an error return, SIGSEGV - so anything that
      initialises the backend needs --test-threads=1.
      WHAT EMULATION DOES NOT GIVE YOU: any security (the software HSM keeps keys in ordinary
      process memory - an LMK here is protected by nothing, so this is development and conformance
      only), any new host API surface (the sixteen unsupported backend methods are missing
      FUNCTIONS in bnprs.h, not missing hardware), and any substitute for hardware validation - a
      bad FM can brick a real HSM, and emulation cannot catch the platform differences the guide
      warns about (big-endian PowerPC, scarce SMFS handles, C_Initialize patching).
    created_at: "2026-08-12"
    last_accessed: "2026-08-13"
    access_count: 1
    confidence: 1.0
    source: "session 2026-08-12 - built and run on pat-m4p"
