  - id: mem-006
    type: incident_learning
    content: >-
      2026-08-13 bnprs/host/HsmHost.c HAS NEVER BEEN COMPILED FOR WINDOWS, AND IT DOES NOT COMPILE.
      Found by cross-compiling the host shim for x86_64-pc-windows-msvc with clang-cl from a Mac;
      138 other objects compiled cleanly, so this one file is the whole problem. Raised as task-008.
      THE ONE THAT MATTERS is a silent data bug, not a build break: HsmHost.c:44 and :118 pass
      `size_t *` where PKCS#11 wants CK_ULONG_PTR. cryptoki.h has `typedef unsigned long int
      CK_ULONG`. On Linux and macOS (LP64) unsigned long is 64 bits, identical to size_t, so it has
      always compiled and always worked. On WINDOWS (LLP64) unsigned long is 32 BITS while size_t is
      64 - the HSM writes four bytes into an eight-byte variable and the caller reads a length with
      stale garbage in the top half. Wrong data lengths, silently, on Windows only.
      DO NOT FIX IT BY CASTING. `(CK_ULONG_PTR)&len` compiles and reintroduces exactly the same
      truncation, because the callee still writes 32 bits into a 64-bit slot. Use a CK_ULONG local,
      convert at the boundary, and reject up front if the incoming length exceeds ULONG_MAX on the
      target so an oversized buffer is an error rather than a truncation.
      Third defect: HsmHost.c:212/:215/:218 call BprHsm_Kms_User_Login with no declaration in scope
      - it is defined in the C++ TU BprHsmHost_Exports.cpp and declared in no header HsmHost.c
      includes. Implicit declaration is an error in C99+, and calling a C++ definition from C with
      no visible extern "C" is a name-mangling hazard. Declare it in bnprs/include/bnprs.h inside
      the existing extern "C" guard, and check whether other exports are reached from C the same way
      - the compiler only flagged this one because it is the only one HsmHost.c calls.
      THE GENERAL LESSON, which is why this is filed as an incident: "it builds on Linux" was never
      evidence about Windows, and nothing in CI was ever going to say so - real.rs is cfg-gated to
      Linux/Windows and the Windows CI job builds with default (mock) features, so no pipeline has
      ever compiled bnprs/host for an LLP64 target. A cfg-gate plus a mock default equals a whole
      platform nobody is compiling. Also: -Wno-incompatible-pointer-types was tried as a probe to
      reach the linker and deliberately abandoned - silencing a 32-bit write into a 64-bit variable
      produces a green build that means nothing.
    created_at: "2026-08-13"
    last_accessed: "2026-08-13"
    access_count: 1
    confidence: 1.0
    source: "session 2026-08-13 - cargo xwin cross-compile from pat-m4p"
    tags: [hsmhost-c, windows, llp64, ck-ulong, silent-truncation, implicit-declaration,
           extern-c, task-008, cfg-gate-blind-spot]

