  - id: mem-004
    type: project_context
    content: >-
      FM BUILD/DEPLOY REALITIES. FMs cross-compile on LINUX ONLY; the Makefile includes
      $(FMDIR)/cfgbuild.mak and needs FMDIR/CPROVDIR/FMSDK. The PTK FM SDK is vendored in this repo
      under safenet/protecttoolkit7/, so the SDK is not the obstacle - the OS is. Targets: `make` ->
      obj-ppcfm for the HSM, `make EMUL=1` -> obj-linux-x86_64e for the emulator, plus DEBUG=1.
      NEITHER target builds natively on pat-m4p (macOS): Thales ships linux-x86_64 and Windows only,
      there is no Darwin build of ProtectToolkit anywhere in the tree, and obj-ppcfm additionally
      needs the PowerPC cross-compiler. BUT the EMUL=1 target DOES build and run on pat-m4p inside a
      linux/amd64 container - proven 2026-08-12, see mem-005. Do not read this entry as "the FM
      cannot be worked on without hardware"; that was corrected.
      Signing material already exists: fm/fm1/fm2 RSA key pairs with X.509 certs on token
      <Slot0>:FM_Slot alongside iCodeLMK; MKFM builds the signed image (CTFM/CTCERT/CTCONF support
      it); root-key export uses multi-custodian mode, observed 3-of-4 via `ctkmu x ... -M`.
      SAFETY: the SDK states bad FM code can make the HSM unusable, and this HSM holds the LMK -
      always exercise under EMUL=1 first. Never force PID/OID to -1 (collapses caller identity).
      HSM is big-endian, host is not: use endyn.h macros. SMFS handles are scarce (~16) and the
      first C_Initialize after reboot closes them all, so keep keys in FM memory and use SMFS only
      as backup.
