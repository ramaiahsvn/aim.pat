task:
  id: "task-002"
  subject: "Validate the new FM command under EMUL=1 against the Rust conformance vectors"
  description: >-
    Build with `make EMUL=1` and check the derivation against known-good vectors BEFORE any
    hardware is touched. bruid-kms is exporting those vectors (its task-003): SCP02 derivation
    verified byte-exact against a captured real card session, and SCP03 CMAC pinned to the
    published NIST SP 800-38B vectors for all three AES key lengths.

    This is the mitigation that makes Option A safe. The Rust implementation is the conformance
    oracle; the FM must agree with it digit for digit before it goes near the device.
  status: pending
  priority: high
  created_at: "2026-08-12"
  assigned_to: null
  blocked_by: ["task-001"]
  blocks: ["task-003"]
  estimated_steps: 4
  tags: ["fm", "emulator", "verification"]
  notes: >-
    A wrong session key does not produce a wrong number - it produces a failed EXTERNAL
    AUTHENTICATE, and cards lock permanently after a few of those. Emulator first, always.

    VECTORS ARE READY 2026-08-12 (bruid-kms task-003, commit fb72645 in trp1003.phsm.kms.fe):
    crates/jc-toolbox/vectors/scp-conformance-vectors.json - 12 AES-CMAC cases from NIST SP 800-38B
    and 8 derivation cases covering SCP02, SCP01 and SCP03 over AES-128/192/256 by DoD and EMV-CPS,
    each with an implementer note naming the traps. Every KMC in that file is synthetic, so it is
    committed and can be copied freely into this repo's test tree.

    The captured real-card session is NOT in git. Produce it with
    `cargo run -p jc-toolbox --bin scp-vectors -- --real --out <path outside the repo>` on a host that
    has crates/jc-toolbox/tests/fixtures/scp02_vector.txt, and move it the way config.txt is moved.
    The exporter refuses to write it inside the repository.

    Check the FM against the synthetic suite FIRST. If the algorithm is right, the real session adds
    nothing but confirmation; if it is wrong, finding out with a synthetic key costs nothing, whereas
    a wrong derivation against a real card is a locked card after a few tries.
