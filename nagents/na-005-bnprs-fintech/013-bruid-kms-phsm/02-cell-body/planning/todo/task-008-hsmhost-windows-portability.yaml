  tags: ["host-api", "windows", "portability", "llp64", "bug"]
  notes: >-
    WHY THIS WENT UNNOTICED: the Windows build has never been run. The FE's real.rs is cfg-gated to
    Linux/Windows and CI builds the Windows .exe with default (mock) features, so nothing has ever
    compiled bnprs/host for an LLP64 target. "It builds on Linux" was never evidence about Windows,
    and this is the specific reason why.

    HOW TO REPRODUCE WITHOUT WINDOWS — this is the useful part, and it takes minutes:

      rustup target add x86_64-pc-windows-msvc
      cargo install cargo-xwin           # fetches Microsoft's redistributable CRT + SDK
      export BNPRS_PHSM_DIR=<this repo>
      export BNPRS_PTK_LIB_DIR=<dir with cryptoki.lib ctutil.lib ethsm.lib>
      export BNPRS_OPENSSL_LIB_DIR=<dir with libcrypto.lib>
      cd trp1003.phsm.kms.fe
      cargo xwin build -p kms-hsm --no-default-features --features real-hsm \
        --target x86_64-pc-windows-msvc --tests

    The import libraries are NOT in this repo — it ships DLLs with no .lib files. Extract them from
    the PTK client installer (SDKs/Win64/x64/PTKinstaller.exe, an Inno Setup package; `innoextract`
    reads it without installing anything) at "app/C SDK/lib". libcrypto.lib is not in the Thales
    bundle at all: build it from 3rdparty/openssl-3.3.2 with `perl Configure VC-WIN64A no-asm
    no-shared` under a VS x64 developer prompt. Both were done on 2026-08-13 and the files are staged
    on MCES2 at C:\BPR\pHSM.

    DO NOT "fix" this with -Wno-incompatible-pointer-types. That was tried as a probe to reach the
    linker and abandoned deliberately: silencing a 32-bit write into a 64-bit variable produces a
    green build that means nothing.

    Related: na-005/011 bruid-kms fixed the FE side of the Windows link path in commit e969811 —
    both vendor directories searched, libcrypto named correctly for MSVC, BNPRS_PTK_LIB_DIR /
    BNPRS_OPENSSL_LIB_DIR honoured, and a preflight that names missing libraries instead of leaving
    the linker to. Ten tests cover that logic on every host. The FE side is done; this file is what
    stops the Windows build now.
