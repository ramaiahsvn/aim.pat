  - id: "task-004.7"
    subject: "BprIPersoAgent — perso as a LIBRARY call from the kiosk app (no process, no port, no batch file)"
    detail: >
      2026-07-29 (bpr.cpp ef764f4), user request. The kiosk app had to launch perso-kiosk-agent.exe from a
      batch file and trigger it over 127.0.0.1:9098 — a process to supervise, a port to keep free, and a
      window an operator can close. The session now lives in a library (src/iperso_agent.cpp) and the host
      calls ONE function; perso-kiosk-agent.exe remains as a thin wrapper for diagnostics and for hosts that
      still prefer process isolation.
      ONE DLL serves BOTH hosts: C ABI (bpriperso_version/run/free, cdecl, undecorated -> C# P/Invoke and
      C/C++) and JNI (Java_com_bnprs_jni_iPersoAgent_{version,runPerso} -> Java System.loadLibrary, matching
      the Bpr.QiScript delivery style). Request is ONE JSON object carrying the bureau connection AND the card
      request — a superset of the old trigger message, so the kiosk team's existing request body still works.
      DESIGN FIX FOUND BY TESTING (worth remembering): the first C ABI used a caller buffer with the usual
      size-then-fill idiom — and the SIZING CALL RAN THE SESSION. One logical request produced two bureau
      sessions and would have consumed TWO CARDS. Replaced with allocate-and-free (run returns a string, free
      releases it): one call, one card, impossible to misuse.
      Verified against a live bureau on macOS builds of the same source: a C host ran a full session with
      progress callbacks; the Java class ran one through JNI. Windows x86+x64 DLLs cross-built static
      (imports KERNEL32/WS2_32/WinSCard/CRYPT32/ADVAPI32/USER32 only). x86 needs -Wl,--add-stdcall-alias or
      the JVM misses the JNI symbols (JNICALL is __stdcall); the C ABI is cdecl and unaffected. Also note each
      arch needs its OWN static mingw OpenSSL — the x64 one will not link into an x86 build.
      REMAINING: run on Windows (start with commit=false preflight), hand the kiosk team the DLL + the C#/Java
      wrapper, and retire start-agent.cmd / trigger.ps1 from the integration once they are on the library.
      VERSIONED 2026-07-29 (bpr.cpp 78f5102): BprIPersoAgent joined the BPR series at 2.59.0 — after
      BprCardQi 2.56.x / BprCardEmv 2.57.x / BprICBA 2.58.x. Registered in the three files that must agree
      (Makefile, bpr_versions.cmake, bpr_versions.h); the library builds its version string from
      BPR_IPERSOAGENT_VERSION so the binary cannot drift from the build system, and the Windows script writes
      to the standard build/bnprs-libs/BprIPersoAgent/v<ver>/windows-{32,64}/ layout. Both hosts can ask a
      deployed kiosk what it is running: bpriperso_version() / agent.version() -> "BprIPersoAgent/2.59.0".
      Package: ~/Downloads/BprIPersoAgent-v2.59.0 (both DLLs + import libs + header + C# + Java + README).
      SCOPE CHANGE 2026-07-29 (user, bpr.cpp a2755a7): the HOST owns card movement. The library no longer
      touches TP9000.dll at all — the kiosk app inserts the card and positions it at the encoder, calls
      run(), and acts on the result. Shipped DLLs are verified TP9000-free (imports WinSCard + WS2_32 +
      CRYPT32 + ADVAPI32 + USER32 + KERNEL32 only); --tp9000 remains an opt-in build flag for diagnostics
      and the Nuvia evidence. Three additions this required:
      (1) result carries "disposition" ("eject"|"reject") on EVERY path INCLUDING failures — a card sits at
      the encoder either way and the host must know which way to move it; unknown/interrupted always reports
      "reject" (a card the bureau did not confirm complete must never reach the customer);
      (2) "waitForCardMs" (default 5000) retries the connect until the chip is contactable, because the card
      is not necessarily seated the instant the host says it is — SCardConnect is the power-on step;
      (3) default transport is now pcsc (was tp9000, which would have failed as "not available in this
      build"), and the capabilities announced to the bureau derive from the COMPILED transports rather than
      a hardcoded list that claimed a feeder the build does not have.
    status: delivered_windows_run_pending
    priority: high

  - id: "task-004.3"
    subject: "Identify what 'SYNIC Smart Card Reader 0' actually is"
    detail: >
      Either a separate encoder unit in the card path, or the TP9000's own GemCore exposed over USB-CCID.
      Both work, but the answer matters for the Nuvia ticket: if it IS the GemCore, then their own module
      completes the ~4 s APDUs correctly whenever Windows drives it, which localizes the defect entirely in
      IC_Input's block-wait. Check Device Manager (USB CCID vs a distinct vendor device), the machine's
      hardware inventory, and whether the reader disappears when the printer is powered down.
    status: pending
    priority: medium

  - id: "task-004.4"
    subject: "Rewrite + send the Nuvia reply with the new evidence"
    detail: >
      The drafted reply (07-axon-terminals/deliverables/2026-07-27-nuvia-reply-draft.html, UNSENT) answers
      their two questions — post-final-APDU timing, and a Visa log through the desktop reader — and corrects
      their assumption that the failing log was Visa while the passing one was MasterCard (both were MC;
      A004/A002 are M/Chip DGIs). It now needs re-aiming: the four-run matrix matters less than the fact that
      the SAME cards in the SAME machine complete the SAME APDUs at 9000 when the OS CCID stack drives the
      chip. That rules out the card, the module and the clock, and leaves IC_Input's fixed block-wait. Keep
      the asks (honor T=1 WTX, expose a BWT/timeout, or negotiate PPS). Depends on task-004.3 for the
      strongest phrasing. Any APDU log sent to them must come from a TEST/DUMMY DPI — never real cardholder
      data.
    status: pending
    priority: medium

  - id: "task-004.5"
    subject: "POS-tap a feeder-produced card + get a pool of test PANs"
    detail: >
      The iCVV fix is proven at the POS on an OMNIKEY-produced card; tap the S5 (feeder-produced) card to
      close the loop. BLOCKED until the issuer clears the stored ATC baseline for that PAN — a re-personalized
      card restarts its counter at 0, the host still holds the previous card's high-water mark, and a lower
      ATC reads as a clone (response 04 / pick-up). ALSO ASK for a small pool of test PANs (a few DPIs): every
      re-perso of one PAN needs a manual host reset, and failed-auth flags accumulate on the account. A pool
      removes a host round-trip from every iteration. See bruid-cperso mem-036.
    status: ready   # 2026-07-29 — ATC BASELINE RESET DONE (issuer). No longer blocked: tap the S5 card
                    # (feeder-produced MC, 42/42 SECURED, 2026-07-28) at the POS and expect neither 05
                    # (iCVV — fixed) nor 04 (pick-up, which was the stale ATC). The card's counter has
                    # already advanced to ~3, which is fine: the host requires the ATC to be GREATER than
                    # the stored high-water mark, and the reset cleared that. STILL OPEN and separate from
                    # the reset: the pool of test PANs — ALREADY REQUESTED from the issuer 2026-07-29, now
                    # awaiting their response; do not re-raise. Until it lands, every re-perso of the same PAN
                    # needs another manual host reset and failed-auth flags keep accumulating on one account.
    priority: high

