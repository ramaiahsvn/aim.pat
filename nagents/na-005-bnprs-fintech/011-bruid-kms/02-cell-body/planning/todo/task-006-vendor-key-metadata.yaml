task:
  id: "task-006"
  subject: "Richer key metadata: index, length, description, last-operation, security level"
  description: >-
    Vendor A's key detail pane carries markedly more than ours. Add: key index (their slot number,
    distinct from version - without it their labels like ISC.TEST.CTX.ZMKE.01 cannot be
    reproduced), a free-text description, the last-operation date (when the key was last USED, not
    created), and an advisory security level.

    Key LENGTH should be derived from the algorithm rather than stored - a stored length can
    disagree with the algorithm, and that disagreement would be silent.
  status: completed
  priority: high
  created_at: "2026-08-12"
  assigned_to: null
  blocked_by: []
  blocks: []
  estimated_steps: 5
  tags: ["vendor-parity", "keys"]
  notes: >-
    Mostly done 2026-08-12 (commit f3b1f06): domain, command, ipc, UI and three tests. Key length
    is derived from the algorithm in the UI rather than stored, so the two cannot silently
    disagree. Security level is advisory and documented as such - nothing refuses an operation
    because of it.

    CLOSED 2026-08-12 (0e2e374). The earlier note was wrong on one point: last_operation_date was
    not "stored and displayed" - it was stored and typed but never rendered anywhere, so it read as
    permanently empty. Now both stamped and shown.

    The boundary is written on the field itself and is deliberate: an operation is anything that
    uses the key or changes what it will do (wrapped for export, promoted to or demoted from
    default, suspended, resumed, revoked, value-deleted, dates changed). Annotations are not
    operations - description, key index, assurance level, BIN, key set, usage flag, owner all leave
    it alone, because stamping those turns "when was this key last acted on" into "when did someone
    last edit its label text". Only keys the HSM actually wrapped are stamped; a refused key was
    not used. Promoting a version also stamps the one that loses the default, and re-running a
    promotion that changes nothing stamps nothing. Three tests.

    Rendered as a read-only sub-line under the label rather than a 17th column.
