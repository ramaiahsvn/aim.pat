task:
  id: "task-007"
  subject: "Issuer fields: description, is-manufacturer, identifiers"
  description: >-
    Vendor A models Is Manufacturer as a first-class YES/NO because it changes what an issuer is
    expected to hold - a manufacturer legitimately owns transport and KEK material an issuer never
    should. Identifiers (BIN/IIN list) is the join to Vendor B's BIN-centric model and the hook
    task-010 hangs from.
  status: in_progress
  priority: high
  created_at: "2026-08-12"
  assigned_to: null
  blocked_by: []
  blocks: ["task-010"]
  estimated_steps: 4
  tags: ["vendor-parity", "issuers"]
  notes: >-
    Domain done and compiling: Issuer gained description, is_manufacturer and identifiers, plus a
    set_issuer_details mutator kept separate from update_issuer so annotating cannot accidentally
    rename an issuer or change its status. Identifiers are validated as 6-11 digit BIN/IINs so the
    field stays usable as a join key rather than becoming free text. STILL TO DO: command, ipc,
    UI, tests.
