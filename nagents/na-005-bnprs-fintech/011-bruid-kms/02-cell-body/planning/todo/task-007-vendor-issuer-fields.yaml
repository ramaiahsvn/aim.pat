task:
  id: "task-007"
  subject: "Issuer fields: description, is-manufacturer, identifiers"
  description: >-
    Vendor A models Is Manufacturer as a first-class YES/NO because it changes what an issuer is
    expected to hold - a manufacturer legitimately owns transport and KEK material an issuer never
    should. Identifiers (BIN/IIN list) is the join to Vendor B's BIN-centric model and the hook
    task-010 hangs from.
  status: completed
  priority: high
  created_at: "2026-08-12"
  assigned_to: null
  blocked_by: []
  blocks: ["task-010"]
  estimated_steps: 4
  tags: ["vendor-parity", "issuers"]
  notes: >-
    Done 2026-08-12 (commit f3b1f06). Domain, command, ipc and UI complete, with three tests -
    including one pinning that set_issuer_details cannot rename an issuer or change its status,
    since it is deliberately separate from update_issuer. Identifiers validate as 6-11 digit
    BIN/IINs, deduplicate, and drop blanks, so the field stays usable as the join key task-010
    needs.
