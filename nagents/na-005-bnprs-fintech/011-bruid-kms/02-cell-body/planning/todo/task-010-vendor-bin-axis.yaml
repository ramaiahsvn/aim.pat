task:
  id: "task-010"
  subject: "BIN as a first-class entity, with key sets and per-key container import"
  description: >-
    The largest gap, and the one genuinely new axis. Vendor B organises keys as
    Job -> ZMK -> Key Set -> BIN -> key type -> version, where ours is Issuer -> Key Context -> Key.
    Their import screen presents the container as a tree with a checkbox per key, so an operator
    takes exactly the keys they want (KMC, KMCenc, KMCkek, KMCmac, CMK) rather than all or nothing.
    Keys also carry an Owner.

    Do NOT replace the issuer model with the BIN model. Add BIN as a dimension that hangs off an
    issuer's identifiers (task-007), so both views are available over the same keys.
  status: in_progress
  priority: medium
  created_at: "2026-08-12"
  assigned_to: null
  blocked_by: []
  blocks: []
  estimated_steps: 12
  tags: ["vendor-parity", "bin", "domain", "import"]
  notes: >-
    STEP 1 DONE 2026-08-12: BIN as a dimension over the existing hierarchy, not a replacement.
    KeyEntry.bin is validated against the owning issuer's declared identifiers via the key's
    context, so the BIN view and the context tree always describe the same keys. keys_by_bin
    returns declared BINs in issuer order plus an unassigned bucket, and an empty declared BIN
    still appears so it can be told apart from a missing one. UI has a BIN column, filter, editor
    and an opt-in BIN view panel. Six tests.

    STEP 3 DONE 2026-08-12 (92f1fe6): per-key container import tree. preview_container returns
    ContainerPreviewEntry - label, nature, algorithm, KCV tail, and whether the target context
    already holds the label - guarded on ViewKeys, since inspecting a container is not the same act
    as importing from it. The type deliberately has NO field for key material, so no downstream DTO
    can add one; the vendor screen prints the cleartext key value beside its KCV and we took only
    the selection model. import_container now takes an optional selection and returns per-key
    outcomes: a label absent from the container is an error (stale preview), an empty selection is
    refused rather than read as "import everything", and one key failing to unwrap no longer aborts
    the batch. UI: Inspect button, checkbox tree, All/None, "Import N of M", red report on partial
    failure, unselected reported separately from failed. Three tests, one asserting the serialised
    preview contains no wrapped blob.

    Rendering it in the preview harness caught two layout bugs that reading the code would not:
    app.css `input, select { width: 100% }` made the row checkbox a full-width flex item, and
    `.xrow strong { width: 60px }` wrapped the report heading. Also added
    scripts/check-no-key-material.py - the commit gate, previously re-derived by hand, now skipping
    binaries because a DLL contains 0123456789ABCDEF by chance and a gate that cries wolf gets
    bypassed.

    REMAINING: key-set grouping under a BIN (Vendor B's Key Set level between ZMK and BIN); Owner
    (task-015 overlaps).
