task:
  id: "task-010"
  subject: "BIN as a first-class entity, with key sets and per-key container import"
  description: >-
    The largest gap, and the one genuinely new axis. Vendor B organises keys as
    Job -> ZMK -> Key Set -> BIN -> key type -> version, where ours is Issuer -> Key Context -> Key.
    Their import screen presents the container as a tree with a checkbox per key, so an operator
    takes exactly the keys they want (KMC, KMCenc, KMCkek, KMCmac, CMK) rather than all or nothing.
    Keys also carry an Owner.

    Do NOT replace the issuer model with the BIN model. Add BIN as a dimension that hangs off an
    issuer's identifiers (task-007), so both views are available over the same keys.
  status: in_progress
  priority: medium
  created_at: "2026-08-12"
  assigned_to: null
  blocked_by: []
  blocks: []
  estimated_steps: 12
  tags: ["vendor-parity", "bin", "domain", "import"]
  notes: >-
    STEP 1 DONE 2026-08-12: BIN as a dimension over the existing hierarchy, not a replacement.
    KeyEntry.bin is validated against the owning issuer's declared identifiers via the key's
    context, so the BIN view and the context tree always describe the same keys. keys_by_bin
    returns declared BINs in issuer order plus an unassigned bucket, and an empty declared BIN
    still appears so it can be told apart from a missing one. UI has a BIN column, filter, editor
    and an opt-in BIN view panel. Six tests.

    REMAINING: key-set grouping under a BIN; the per-key import tree; Owner (task-015 overlaps).
    Note the vendor UI displays cleartext key values in that import tree - copy the selection
    model, never that.
