task:
  id: "task-005"
  subject: "Test/Production flag on keys"
  description: >-
    Vendor A carries a per-key Test Flag and a per-master-key Usage Flag; Vendor B encodes the same
    distinction in job names. It is the field most likely to prevent a real accident in either
    direction - a test key used against production cards, or a production key exposed in a test run.
  status: completed
  priority: high
  created_at: "2026-08-12"
  assigned_to: null
  blocked_by: []
  blocks: []
  estimated_steps: 4
  tags: ["vendor-parity", "keys"]
  notes: >-
    Done 2026-08-12 (commit 3ee5ee9). UsageFlag { Unknown, Test, Production } on KeyEntry, an
    audited set_key_usage_flag command, and a cycling badge in Key Administration. Unknown is the
    default on purpose: entries written before the field existed made no such claim, and defaulting
    them to Test could get a live key treated as disposable. Three tests, including one that loads
    a pre-field JSON entry.
