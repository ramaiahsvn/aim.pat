task:
  id: "task-008"
  subject: "Bulk key export screen with filters and a per-key result report"
  description: >-
    Vendor A's Export Multiple Keys Using Transport Key: a multi-select table with a filter box per
    column (customer name, label, KCV), a transport-key picker showing label AND KCV, an encryption
    algorithm / secret format choice, a running Selected Keys count, and a result dialog reporting
    each key individually - "KEY.LABEL - SUCCESS", "1 keys OK - 0 keys on Error".

    The per-key report is the part that matters. A bulk operation that reports only overall
    success hides partial failure, which for key export is the dangerous case.
  status: completed
  priority: medium
  created_at: "2026-08-12"
  assigned_to: null
  blocked_by: []
  blocks: []
  estimated_steps: 5
  tags: ["vendor-parity", "export", "ui"]
  notes: >-
    Done 2026-08-12. Turned out to be more than UI: export_keys silently skipped asymmetric and
    value-deleted keys and reported the SELECTION count as the export count, and a single HSM
    failure aborted the whole batch. Both fixed. It now returns a per-key report and survives one
    key failing. UI adds per-column filters, a select-all scoped to filtered rows only, a live
    count, and a report panel that goes red on any failure. Transport picker shows the KCV.

    NOT DONE from the vendor screen: the encryption algorithm / secret format choice (DES-ECB,
    PKCS-5). Our container format is fixed, so exposing a choice would imply options that do not
    exist. Worth revisiting only if more than one container format is ever supported.
