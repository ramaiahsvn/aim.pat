task:
  id: "task-011"
  subject: "Trusted Path for password and PIN entry - CLOSED, not applicable (no PIN pad)"
  description: >-
    Vendor A's Change Password dialog offers a Use Trusted Path checkbox: the PIN is entered on the
    HSM's own pinpad rather than the host keyboard, so a compromised host never sees it.

    DO NOT add this control until the capability exists. A checkbox that looks live and does
    nothing implies an assurance that does not hold, which is worse for a security feature than an
    absent one. First establish whether our pHSM exposes trusted-path entry at all - ask
    na-005/013 bruid-kms-phsm.
  status: closed_not_applicable
  priority: low
  created_at: "2026-08-12"
  assigned_to: null
  blocked_by: []
  blocks: []
  estimated_steps: 3
  tags: ["vendor-parity", "security", "blocked"]
  notes: >-
    CLOSED 2026-08-12 — NOT APPLICABLE. Owner's answer: no PIN pad, so no feature.

    The platform can do it and the research is recorded below, so this is a decision rather than a
    dead end: ProtectToolkit supports key-component entry on a directly-attached Verifone PIN pad
    (CKM_PP_LOAD_SECRET_2), but the pad is a separate orderable part, PN 934-000087-001, and only
    Thales-distributed pads work. There is no pad on the pHSM, so the assurance a "Use Trusted Path"
    control would imply cannot hold, and the control must not exist.

    REOPEN THIS, do not rewrite it, if a pad is ever bought. Everything needed is already here: the
    mechanism, its parameters, the physical constraint (USB directly to the HSM card), the entry
    format (per byte, 3-digit decimal, ~20s timeout), and the fact that the host API needs a new call
    because bnprs.h has none. The KMS side is then small.

    ORIGINAL RESEARCH FOLLOWS.
    QUESTION ANSWERED 2026-08-12, from the ProtectToolkit documentation in resources/. The earlier
    "HSM support unknown" is resolved: **the platform supports it.**

      * PTK-C Programming Guide, ch.4: mechanism CKM_PP_LOAD_SECRET_2 (CKM_PP_LOAD_SECRET is
        deprecated) - "load a clear key component from a directly attached PIN pad device", with
        CK_PP_LOAD_SECRET_PARAMS carrying bMaskInput, a conversion type and a timeout. It is a
        key-generate mechanism, available in FIPS mode.
      * PTK-C Administration Guide, "Key Entry via PIN Pad" (p.115): requires a compatible Verifone
        PIN pad connected by USB DIRECTLY TO THE HSM CARD - not to another USB port on the host -
        plus physical access to the HSM. Components are entered in 3-DIGIT DECIMAL, not hex, one
        byte at a time, with a ~20 second timeout per byte.
      * PCIe HSM Installation Guide: the PIN pad is a separate orderable part,
        PN 934-000087-001, and only Thales-distributed pads work with ProtectServer.

    So this is no longer a research question. It is now (a) a hardware decision and (b) FM work:

      DECISION FOR THE USER: is there a Verifone PIN pad (PN 934-000087-001) on the pHSM, or will
      one be bought? Without the pad the feature cannot exist at all, and the correct action is to
      close this task as not-applicable rather than leave it open. With the pad, note the
      operational constraint: entry is per-byte 3-digit decimal at the HSM itself, so an operator
      needs a hex-to-decimal table and physical access - it is a ceremony, not a convenience.

      IF YES: the host API needs a call exposing CKM_PP_LOAD_SECRET_2 (bnprs.h has nothing), which
      makes it na-005/013 bruid-kms-phsm work, and it belongs with task-006's component work since
      both are about components. The KMS side is then a ceremony-style flow and a capability entry,
      both small.

    STILL DO NOT SCAFFOLD THE UI. Everything above is about whether the assurance can hold; a
    "Use Trusted Path" checkbox that does not reach a pad implies an assurance that does not exist,
    which is the whole reason this task was written rather than built.
