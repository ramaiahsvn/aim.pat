task:
  id: "task-009"
  subject: "Master-key registers (New/Current/Old) and security-module inventory"
  description: >-
    Vendor A shows three master-key registers side by side - New, Current, Old - each with its own
    state, LMK type, usage flag, MKVV, label and origin (Generation vs Import). Alongside it, a
    security-module inventory: serial number, license name and hash, firmware version, activation
    count, last activation date, device state.

    The three-register model is the substantive idea: it makes a key rotation visible as a state
    transition rather than an event that already happened. Our ceremony flow is arguably better for
    performing a rotation; this is better for seeing where one stands.
  status: pending
  priority: medium
  created_at: "2026-08-12"
  assigned_to: null
  blocked_by: []
  blocks: []
  estimated_steps: 8
  tags: ["vendor-parity", "master-key", "domain"]
  notes: >-
    Needs domain work, not just plumbing. MKVV is a master-key verification value we do not compute
    today. Check what the pHSM can report before designing the inventory panel - some of those
    fields may simply not be available through our host API.
