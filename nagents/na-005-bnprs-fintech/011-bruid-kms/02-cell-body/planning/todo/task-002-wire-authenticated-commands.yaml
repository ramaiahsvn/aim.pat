task:
  id: "task-002"
  subject: "Wire GET STATUS and GET MEMORY to the authenticated channel"
  description: >-
    Today both reach the card unauthenticated and can only ever collect 6982/6985. task-001 has
    landed, so route them through an opened SecureChannel and they return real data. CHANGEKEYSET stays
    plan-only and is NOT part of this task.

    Keep the property that currently holds: no command transmits a destructive APDU. Being able to
    open a channel must not silently become permission to execute a plan - that stays a separate,
    deliberate act with its own confirmation (question 4 of the boundary doc, still open).
  status: pending
  priority: high
  created_at: "2026-08-12"
  assigned_to: null
  blocked_by: []   # task-001 completed 2026-08-12 (c2ee318) — this is ready to start
  blocks: []
  estimated_steps: 5
  tags: ["scp", "kms-app", "ui"]
  notes: >-
    READY TO START. task-001 completed 2026-08-12: jc_toolbox::session::open drives INITIALIZE UPDATE,
    derivation, card verification and EXTERNAL AUTHENTICATE, and returns one Channel for all three
    protocols. Use it with an HSM-backed SessionKeyProvider that calls
    HsmBackend::derive_scp_session; that works against the mock today. On the device it needs the FM
    command (na-005/013 bruid-kms-phsm task-001), and until then the ScpSession capability reports
    unsupported — so gate the UI on it, as the key-transfer and ceremony panels already do, rather
    than letting an operator click into a refusal.
    The UI already labels these "needs channel" and explains the 6982/6985 they currently return;
    those labels and the explanation will need updating when this lands. Audit entries already
    record both commands, including refusals.
