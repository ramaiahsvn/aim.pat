task:
  id: "task-004"
  subject: "Verify generate_cavv on a Linux real-hsm build"
  description: >-
    generate_cavv is implemented against the backend ABI that landed in eaba3f34, but the FFI call
    itself is unverified: real.rs is cfg-gated to Linux/Windows, so on the macOS dev host it is
    not compiled at all. Build with --features real-hsm on Linux and confirm three things - that
    bindgen emits cavv_generate now that build.rs allowlists it, that the call type-checks and
    links, and that a known input produces the expected CAVV.

    The format logic either side of the call (32-digit validation, BCD packing, 3-digit parse) is
    already tested on every host in crates/kms-hsm/src/cavv.rs.
  status: pending
  priority: medium
  created_at: "2026-08-12"
  assigned_to: null
  blocked_by: []
  blocks: []
  estimated_steps: 3
  tags: ["ffi", "cavv", "verification"]
  notes: >-
    Watch for the trap this exposed: BprHsm_Cavv_Generate is declared only in
    BprHsmHost_Exports.cpp with no public header, so bindgen never sees it. The binding is to the
    header-declared cavv_generate instead. A backend function can be invisible to Rust in three
    separate ways - .cpp-only, missing from the allowlist, or never compiled on this host.
