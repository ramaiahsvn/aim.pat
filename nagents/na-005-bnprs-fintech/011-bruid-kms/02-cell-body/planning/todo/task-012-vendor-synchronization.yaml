task:
  id: "task-012"
  subject: "KMS-to-KMS synchronization - divergence detection, then a metadata bundle"
  description: >-
    Vendor A has a whole Synchronization menu for replicating between KMS instances. We have no
    equivalent and no design for one. Replicating key catalogues between systems raises questions
    this document cannot answer: what is authoritative on conflict, whether key VALUES ever move or
    only catalogue metadata, and how an operator sees divergence.

    DESIGN IS DONE - trp1003.phsm.kms.fe/docs/rust-migration/KMS_SYNCHRONIZATION.md. It answered the
    question this task was written around, and not in the direction expected: the platform ALREADY
    replicates keys between HSMs (Token Replication with Trust Management), so this is not a key
    transport problem after all. What it leaves undone is the automation, and that is what to build.
    Read section 4a of that document before starting.
  status: in_progress
  priority: medium
  created_at: "2026-08-12"
  assigned_to: null
  blocked_by: []
  blocks: []
  estimated_steps: 10
  tags: ["vendor-parity", "sync", "design-needed"]
  notes: >-
    DESIGN DONE 2026-08-12 (4194336): trp1003.phsm.kms.fe/docs/rust-migration/KMS_SYNCHRONIZATION.md.
    Implementation is BLOCKED on two questions only an operator can answer, both in section 7 of that
    document: (1) do key values need to move at all, or is knowing-what-should-exist the real
    requirement; (2) is there a deployment with two HSMs in one LMK domain, or planned.

    The task's own hunch was right and is now the spine of the design: if values replicate it is a
    key-transport problem wearing a sync costume - specifically it is export_keys + import_container
    on a schedule, which we have already built, so it must not become a second implementation of that
    path. And that route is doubly blocked: the pHSM cannot wrap under a transport key at all
    (capability TransportKeyTransfer), so sync built on it would work only against the mock.

    Three options, recommendation A now / C later / B only on demand:
      A metadata only - fully buildable today, no cryptographic risk, delivers "do these two systems
        agree", which is what an operator usually actually wants
      B values under a shared inter-site transport key - blocked as above
      C shared LMK domain - wrap_key_with_lmk and unwrap_key_with_lmk ARE implemented on the pHSM, so
        this is the only value-moving design that works on current hardware. task-009's master-key
        registers already express the precondition: a shared MKVV is visible evidence two sites are in
        one domain.

    Q2 ANSWERED 2026-08-12 by the user: a Network HSM is planned, with ONE LMK DOMAIN shared across
    HSMs. Acting on that rather than just filing it changed the design (commit 46dbea9), because it
    sent me to the ProtectToolkit documentation:

      THE PLATFORM ALREADY REPLICATES KEYS BETWEEN HSMs. PTK-C Administration Guide ch.3 - Token
      Replication with Trust Management. HSMs exchange Identity Public-Keys and must trust each other
      MUTUALLY; `ctkmu rt` replicates a whole User token (every object in it, and its label) to any
      other User slot on any HSM in the system; WLD/HA puts several HSMs behind one virtual slot.
      Options B and C of the design were both reinventing this.

      AND THE GAP IT LEAVES: "Once a token has been replicated, any objects created or modified on
      that token will not be automatically transferred... whenever a token is modified, manual
      replication to all participating WLD tokens is mandatory." The platform gives you the transfer
      and none of the automation. Nothing watches for divergence.

    STEP 1 DONE 2026-08-12 (6e4e46f): divergence detection. ReplicationMark stores when replication
    was recorded, by whom, and every label#vN resident at that moment — labels, not a count or digest,
    so the report can name what changed. ReplicationStatus reports `added` (here but not on the peers)
    and `removed` (dropped here, still on the peers). Never-recorded is a THIRD state rather than
    "diverged": without a baseline we cannot know the HSMs were ever in step, and a false alarm on a
    single-HSM install is how a warning gets trained out of an operator. A revoked key still has its
    HSM object so it is not drift; a value-deleted one is. Annotations (BIN, key set, owner,
    description, index, level) never are — tested, because the tempting implementation is a change
    counter that fires on any catalogue write. A new key VERSION does diverge, since the version is
    part of the label the HSM sees.

    New permission RecordReplication, Admin only. The KMS cannot verify ctkmu rt ran, so recording it
    is an assertion; an Operator able to make it could silence the warning more cheaply than act on
    it. Seeing drift needs only ViewKeys. UI panel in System & Ops, which also explains why the KMS
    does not run ctkmu itself. Six tests.

    REMAINING — step 2, the signed metadata bundle. Still waiting on: how many KMS INSTANCES will
    there be? Several front ends sharing one network HSM through a WLD virtual slot have nothing to
    synchronize at all, and the bundle would be work for nobody. Ask before building it.

    SO THE WORK IS, in order:
      1. DIVERGENCE DETECTION. Record when replication last happened; count catalogue changes since;
         surface "N keys created since the last replication - the HSMs have diverged" with the
         ctkmu rt command to run. Buildable today, no HSM capability needed, and it fills the exact
         hole the vendor documentation admits to. This is the valuable half.
      2. Metadata bundle export/import, signed, one authoritative writer - catalogue only.
      3. Nothing else until an operator asks.

    DO NOT build a key-material path of our own, even after FM task-007 lands: it would be a second
    key transfer running alongside the platform's, outside the HSM trust model, for no gain. And do
    NOT have the KMS invoke ctkmu - it runs with SO credentials against slot POSITIONAL numbers that
    the guide warns are reassigned if a device goes offline mid-command, and a replication to the
    wrong slot is not something a background process should be able to cause. Tell the operator;
    let them run it.

    Q1 (do values replicate) is now non-blocking - the answer above holds either way.

    NEW QUESTION for the user, non-blocking: how many KMS INSTANCES will there be? Several front ends
    sharing one network HSM through a WLD virtual slot have nothing to synchronize at all - one HSM,
    one catalogue, several UIs. Synchronization only becomes real with genuinely separate
    installations each holding their own catalogue file.

    NOTE for whoever picks this up: no screenshot captured the vendor's Synchronization dialog - only
    the menu entry between Master Key and Security. Still: do not scaffold the UI.
