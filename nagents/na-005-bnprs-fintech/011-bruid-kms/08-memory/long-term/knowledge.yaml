  - id: mem-006
    type: incident_learning
    content: >-
      2026-08-11 SECURITY — THE LEGACY JAVACARD TOOLBOX WRITES KEY MATERIAL IN CLEARTEXT, in TWO
      places. Found while porting it to Rust. Both files are now gitignored in
      trp1003.phsm.kms.fe and were never tracked, so nothing is in git history.
      (1) resources/JavaCardToolbox_TCL/config.txt is the toolbox's ENTIRE key model in cleartext:
      60 values of >=32 hex chars, 150 of >=16. 19 keysets, 18 distinct key values, each flagged
      Key_Diversification YES|NO — so it holds BOTH KMC master keys AND already-diversified live
      card keys. Full inventory with NO values in docs/rust-migration/KEYSET_INVENTORY.md.
      FOUR NEED HSM CUSTODY: 3DES_KEYSET_ELITT (Div:YES + full entropy = a real KMC MASTER key in
      a text file, deriving keys for its whole card population), and 3DES_VISA_CERTIF /
      3DES_IFX_SLC32 / 3DES_VISA_VSDC51 (live diversified card keys). THREE ARE EFFECTIVELY PUBLIC
      because the value IS an ASCII string: 3DES_THALESBPSTEST, 3DES_SSD, and
      3DES_BAI_PSE_THALESDISBPSTEST — that last one is the key already recorded as leaked in
      [[feedback_commit_key_safety]]. The remaining twelve are vendor samples/published defaults
      and are ENOUGH to golden-vector the whole SCP implementation, so the port is not blocked.
      (2) WORSE, AND ONGOING: JavaCardToolbox_log.txt records, on EVERY authenticated run, the KMC
      master key plus all three derived card keys and their diversifiers in cleartext. The copy on
      MCES2 is dated 2026-08-11 11:43:54 — the same day — against ATR
      3BFE130000108080318066B0840C016E0183009000, a GP 2.3 card reporting SCP02 option i=55. Its
      KMC decodes to printable ASCII and matches the THALESDISBPSTEST label, i.e. the known-leaked
      key is in ACTIVE USE. config.txt was one file to find and destroy; this log REGENERATES on
      every run, on every workstation that runs the toolbox.
      WHY IT MATTERS BEYOND HYGIENE: third instance of the same anti-pattern in one day — see also
      the hardcoded 16-byte card credentials at bpr.cpp
      apdu_qi_write_central_perso_gnd.cpp:794/:802 (na-005/002 mem-009). It is a pattern in the
      perso tooling, not an isolated slip.
      ACTION NEEDED FROM PEOPLE, NOT CODE: inventory every copy of config.txt and every
      JavaCardToolbox_log.txt across perso workstations; decide rotation vs import for the four
      Tier-1 keysets; treat cards protected by THALESDISBPSTEST as unprotected. Route via
      na-003/007 bnprs-grc-kms (ceremony) and na-003/008 bnprs-grc (PCI position).
      THE RUST PORT IS PART OF THE FIX: jc-toolbox never holds a key value, logs
      header+length+SW only and never the data field, and the Debug impls on Response/Tlv print
      lengths not values with tests asserting it.
