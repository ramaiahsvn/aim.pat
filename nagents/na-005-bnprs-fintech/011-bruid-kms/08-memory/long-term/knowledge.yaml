  - id: mem-008
    type: technical_knowledge
    content: >-
      2026-08-12 CARD-PROTOCOL FACTS ESTABLISHED WHILE PORTING, each derived from real data rather
      than a spec, and each expensive to rediscover. Code: jc-toolbox on ai_dev.
      SCP02 (option i=55, GP 2.3 card). Card-key diversification is Visa-2 shaped, RECONSTRUCTED
      by correlating the logged diversifiers against the card's diversification data:
        left  = 00 00 00 00 || dd[6] dd[7] || F0 || role
        right = 00 00 00 00 || dd[6] dd[7] || 0F || role      role: ENC=1 MAC=2 DEK=3
        card key = 3DES_ECB(KMC, left) || 3DES_ECB(KMC, right)
      Session keys = 3DES_CBC(static key, constant || seq || 12 zero bytes, IV=0) with GP constants
      0182 S-ENC, 0101 C-MAC, 0181 S-DEK, 0102 R-MAC. INITIALIZE UPDATE response is 28 bytes:
      [0:10] div data, [10] KVN, [11] SCP id, [12:14] sequence counter, [14:20] card challenge,
      [20:28] card cryptogram. Card cryptogram = MAC(S-ENC, host_challenge||seq||card_challenge);
      host cryptogram is the mirror, seq||card_challenge||host_challenge.
      C-MAC: the MAC covers the command AS IT APPEARS ON THE WIRE — CLA with the secure-messaging
      bit set and Lc ALREADY increased by 8. MACing the command as handed in yields a
      plausible-looking MAC the card rejects with no clue why. Option i=55 also single-DES
      encrypts the chaining value with the C-MAC key before each use.
      C-MAC uses the RETAIL MAC (ISO 9797-1 alg 3), not the full-3DES MAC used for cryptograms.
      Confusing the two authenticates nothing.
      3DES-EDE2 WITH IDENTICAL KEY HALVES degrades to single DES: E(D(E(x))) = E(x). Both MAC
      constructions then coincide. Not academic — config.txt holds entropy-1 keysets (every byte
      the same), which therefore give 56-bit strength despite being 16 bytes.
      CAP: version 2.2 records TWELVE component sizes in the Directory (adding Debug); 2.1 records
      eleven. Assuming eleven shifts every later field and shows up as an absurd applet count, not
      a parse error. Decide the count from the Directory's OWN declared length (31 -> 11,
      33 -> 12), never from the header version. Load File Data Block EXCLUDES Descriptor and Debug.
      GET STATUS: 84 F2 <P1> <P2> 0A 4F00 <C-MAC>; P1 80=ISD 40=apps+SDs 20=load files
      10=load files+modules; P2 02 first / 03 next; SW 6310 means more data. Responses are E3
      templates: 4F AID, 9F70 life cycle, C5 privileges, CE version, 84 module AIDs (several).
      LIFE-CYCLE BYTES ARE SCOPE-DEPENDENT: 0x07 is SELECTABLE for an application and INITIALIZED
      for the ISD.
      Applet version identification matches EXACT then LONGEST PREFIX: 24435181 is "v2.4 contact
      only" and 24437205 is "v2.4.1", sharing prefix 2443, so a naive prefix match reports a point
      release as its parent.
      TOOLING: cipher 0.5 renamed the traits (BlockCipherEncrypt / encrypt_block, not
      BlockEncryptMut / encrypt_block_mut). CBC is written out by hand in scp02.rs rather than
      pulling a block-mode crate — the retail MAC needs the same primitive anyway, and it let cbc
      and ecb be dropped from the dependency list.
