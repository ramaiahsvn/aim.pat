memories:
  - id: mem-001
    type: project_context
    content: "House style for technical documents = the K3 TDN/FSD format: cover + metadata table + revision history + TOC + numbered sections + running header/footer + CONFIDENTIAL banner + '— End of Document —'. EXACT K3 METRICS (extracted from Downloads/files/K3_TDN_FSD.docx styles.xml — K3 PDF is the docx rendered via Liberation/Arial, US Letter): page = US Letter 8.5x11in, margins 1in (1440 twips) all sides, header/footer at 0.49in. Font = ARIAL throughout, body 11pt, body LEFT-ALIGNED (ragged right, NOT justified). Headings Arial bold: H1 18pt / H2 15pt / H3 13pt; heading spacing before/after = H1 18/10pt, H2 14/8pt, H3 10/6pt; H1 has a thin bottom rule (0.75pt). Cover run sizes: title-main 22pt, title-sub 16pt, product 20pt, subtitle 14pt, sub-subtitle 12pt, CONFIDENTIAL 14pt, meta table 11pt. K3 colours = navy H1/H2 #1F3864, blue H3/accent/rule #2E75B6, table header fill #1F3864 white text, zebra #F2F7FB, cover meta key-column fill #D6E4F0, red CONFIDENTIAL #CC0000. NOTE: for BNPRS-brand docs the palette is remapped to green (navy #1F3864->#2D4A3E, blue #2E75B6->#3E7D5A, zebra->#EFF4F0, key-fill->#DCE6E0) while keeping ALL K3 sizes/spacing/margins identical. Build .docx with python-docx (default python3). NEVER embed key values/credentials — reference keys by Key Version + KCV only. VERSIONING CONVENTION: maintain ONE canonical .docx per document (no version in the filename) — version tracked inside the file (metadata/revision history) and by git/VCS. Only the Desktop PDF carries the version in its filename (e.g. -v1.0.pdf). One deliverable per document. PDF export: pandoc --toc + python post-process (K3 HTML cover injected, TOC moved before Executive Summary) + weasyprint with scratchpad/proposal.css (UPDATE 2026-08-19: LibreOffice 26.2.5 is now INSTALLED on this Mac via `brew install --cask libreoffice` — `soffice --headless --convert-to pdf --outdir <dir> <docx>` is now the FAITHFUL docx->pdf path and should be preferred when the source IS a .docx. The pandoc+weasyprint pipeline below remains the route for HTML-authored covers / when only HTML source exists; pandoc DROPS docx font sizes/colours + page breaks, so that cover is authored in HTML and forced page breaks live in CSS). GOTCHA: pandoc -s (standalone) injects its OWN <style> with `body{max-width:36em;padding:50px}` which narrows/offsets the text column ON TOP of the @page margin — proposal.css MUST reset `html,body{margin:0!important;max-width:none!important;padding:0!important}` so the @page 1in margin is the only inset (verified: table borders land at 0.99in L/R == K3 1.00in). K3 HEADER/FOOTER RULES: K3 draws a thin full-width line under the running header (~0.69in from top) and above the footer (~0.7in from bottom). weasyprint margin-box borders do NOT span full width and running-element borders don't render — draw them as position:fixed divs `#hrule{position:fixed;top:-0.31in;left:0;right:0;border-top:0.75pt solid #b9c7bf}` `#frule{...bottom:-0.31in...}` (fixed origin = content box, so left:0/right:0 = 1in..1in column). Fixed divs repeat on EVERY page incl cover and can't be per-page-hidden, so COVER must be a clean separate render: render cover.html (no rules) -> cover.pdf AND body.html (Revision History onward, WITH rules) -> body.pdf, then `pdfunite cover.pdf body.pdf out.pdf` (2-file merge stays lean ~6MB; NEVER pdfseparate every page then pdfunite — that duplicates fonts per page and bloats to 185MB). Body page numbers must start at 2: margin-box counter(page) IGNORES in-flow counter-reset — offset with `@page:first{counter-reset:page 2}` (verified works; in-flow counter-reset and counter-increment do NOT). @page cover{@top-left/@top-right/@bottom-right{content:none}} + .cover{page:cover} blanks header/footer text on the cover."
    created_at: "2026-08-18"
    last_accessed: "2026-08-18"
    access_count: 1
