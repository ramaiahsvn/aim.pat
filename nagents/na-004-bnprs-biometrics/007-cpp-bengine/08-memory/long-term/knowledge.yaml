  - id: mem-015
    type: infrastructure
    content: >-
      2026-07-30 FOUR MODALITIES IN THE GATE (bpr.cpp 27ffd00).
        BprFinger      T21 bFinger        BprFingerCless T31 bFingerCless
        BprPalmprint   T41 bPalmprint     BprIris        T51 mIris
