      2026-07-30 THE ROOT BUILD LEAKS C++ SYMBOLS FROM EVERY WINDOWS LIBRARY IT PRODUCES.
      toolchains/toolchain_windows_64.cmake sets
      CMAKE_SHARED_LINKER_FLAGS "... -Wl,--export-all-symbols ...", so a root-built DLL exports
      its entire internal C++ surface. Observed concretely on a BprFinger build: alongside the
      intended Start_Iso_Fp_Matching and bpr_finger_get_version it also exported mangled
      BprLicense::patIsValidLicense, patGlobalLicGenerator and patGlobalLicVerification.
      This is the SAME class of bug I made twice inside bengine (mem-004, mem-010) — except here
      it is in the root toolchain and therefore affects EVERY product the monolithic build ships,
      not just the biometrics ones. Not fixed: the flag is presumably load-bearing for the
      existing DLL consumers (with no dllexport on most definitions, --export-all-symbols may be
      the only reason those DLLs export anything at all — note BPRIDFINGER_EXPORT resolves to
      dllIMPORT for BprFinger because MY_LIBRARY_EXPORTS is defined only for BprPinblock).
      Removing it without first giving each library proper export annotations would produce
      DLLs that export nothing. Worth a deliberate pass; raise before touching.
      bengine's own libraries are unaffected — they are built by bengine/CMakeLists.txt, which
      uses hidden visibility plus BPRID_API, verified at 17 BprID_* exports.
