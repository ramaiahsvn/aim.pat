      had been declined; the user asked for it an hour later, framed as "rename the
      BprFingerKnuckle folder to BprOtherBio".
        src/BprIDEngine/BprFingerKnuckle/ -> src/BprIDEngine/BprOtherBio/   (git mv, cli glue too)
        T33 bFingerKnuckle       -> T61     0x4C03 -> 0x4F01
