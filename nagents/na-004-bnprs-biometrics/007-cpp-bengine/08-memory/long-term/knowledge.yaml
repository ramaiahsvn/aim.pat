  - id: mem-033
    type: incident_learning
    content: >-
      2026-08-01 AN ADAPTER CAN BE BUILT, TESTED, CATALOGUED AND GATE-CLEAN WHILE THE SHIPPED
      LIBRARY DOES NOT HAVE IT. T14/T15 went in on 2026-07-31 (cc619b0) and libBprIDEngine
      registered NEITHER. Found the next day only because adding T13 made me check what the
      library actually registers. Fixed in c72d7d6.
      MEASURED, both sides:
        pre-fix:   BprIDEngine registers 0 templates;   matchers: M11
        post-fix:  BprIDEngine registers T14 T15;       matchers: M11 M14 M15
      THE MECHANISM. Each variant target carries its BENGINE_HAVE_<X> define as PUBLIC, and that
      define is how the modality's registrar decides which blocks to compile.
      bprid_add_modality() links ONE adapter target into the registrar. The face aggregation
      (bengine_face_all) had been written for T12 and ONLY T12, so with T14/T15 on and T12 off
      the else-branch linked bare bengine_face, the defines never arrived, and the registration
      blocks compiled out of face_reg.cpp.
      FOUR GREEN SIGNALS, FEATURE ABSENT — this is the part to remember, because each of them
      looks like verification and none of them is:
        - the adapters COMPILED — they were built, just not linked to the registrar
        - their UNIT TESTS PASSED — 59 of them, because they construct adapters DIRECTLY and
          never go through the library's registry
        - bengine-cli LISTED them — that prints the static CATALOGUE table, not the registry
        - the PROOF GATE PASSED — it compares exported SYMBOLS, which do not change when a
          registration compiles out; the ABI is generalized, so no symbol is per-algorithm
      The one question none of them asks is WHAT DID THE LIBRARY REGISTER. That is now
      tests/abi_registration_test.cpp: it links the real BprIDEngine, calls BprID_ListTemplates /
      ListMatchers, and asserts every enabled adapter is present and nothing unexpected is. The
      expected list is GENERATED BY CMAKE from the same option checks that enable the adapters,
      so it cannot drift from the build.
      VERIFIED THE GUARD BOTH WAYS, which is the only way to trust a regression test: it FAILS on
      the pre-fix CMakeLists and PASSES on the fixed one. A guard only ever run against the fixed
      code proves nothing.
      STRUCTURAL FIX ALONGSIDE IT: the face variant list is now built as a CMake list
      (_face_variants) with one append per option, so adding a variant is a single line and
      cannot be half-done. The old shape — an if/else naming targets explicitly — was correct for
      one variant and silently wrong for the second.
      GENERAL FORM, applies well beyond this engine: WHEN A FEATURE IS ENABLED IN ONE PLACE AND
      CONSUMED IN ANOTHER THROUGH A LINK-PROPAGATED DEFINE, the two can disagree silently and
      every local signal will still be green. Assert the END STATE — ask the artefact what it
      contains — not the inputs. Compare with the same day's other near-miss: renaming a CMake
      option silently dropped two test files and the suite went green at 80/80 instead of 99
      (mem-027). Same shape: a build-system change, no failure, less coverage than before.
    created_at: "2026-08-01"
    last_accessed: "2026-08-01"
    access_count: 1
