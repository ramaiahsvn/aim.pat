  - id: mem-006
    type: technical_knowledge
    content: >-
      2026-07-30 THE bENGINE PRODUCT TAXONOMY (user-supplied, authoritative). Six modalities,
      each with SEVERAL template formats (TID) and matcher implementations (MID). Encoded as data
      in bengine/src/catalogue.cpp; `bengine-cli catalogue` prints it, `bengine-cli id T52`
      resolves one entry. Modality codes are the taxonomy's OWN hex values 4A..4F (enum is
      uint8_t) so a modality serialises into a template header / TLV tag with no lookup table.
        1 (4A) BprFace                T11 sFace(pat) / T12 sFace(opencv) / T13 iFace(InspireFace)
                                      / T14 aFace(AdaFace-CCTV) / T15 mFace(MagFace)
                                      M11 sFace(pat-cosinesimilarity) / M12 Yunet+sFace(opencv)
                                      / M13 iFace(InspireFace) / M14 aFace(AdaFace-CCTV)
                                      / M15 mFace(MagFace)
                                      [T13-T15 REVISED 2026-07-31 by the user — see mem-024. Was
                                      T13 bFace(InspireFace) / T14 iFace(Innovatrics) /
                                      T15 tFace(Tech5).]
        2 (4B) BprFinger              T21 bFinger / T22 Inno Ansi/Iso / T23 Aware Iso
                                      M21 bFinger / M22 IdKit(Innovatrics) / M23 Aw.XM(Aware)
        3 (4C) BprFingerCless         T31 bFingerCless / T32 Inno Ansi/Iso
                                      M31 bFingerCless
                                      [2026-07-31: renamed from "BprFingerCless/Knuckle" (mem-026)
                                      AND knuckle then MOVED OUT to 4F (mem-027). 4C is now
                                      cless-only. T33/M32 no longer exist.]
        4 (4D) BprPalmprint           T41 bPalmprint            M41 bPalmprint
        5 (4E) BprIris                T51 mIris / T52 vIris     M51 bIris / M52 Vasir
        6 (4F) BprOtherBio            T61 bFingerKnuckle        M61 bFingerKnuckle(PolyU)
                                      [2026-07-31: was the generic bOtherBio placeholder; knuckle
                                      moved here from 4C's T33/M32. See mem-027.]
      = 14 template formats, 13 matchers (was 15/14 before the knuckle move).
      TWO CORRECTIONS this forced to mem-001/mem-002's picture, BOTH SINCE REVERSED on 2026-07-31
      (mem-027) — kept because they explain why the code looked the way it did for a year: at the
      time FingerCless and FingerKnuckle were ONE modality (4C) despite being two source
      directories owned by two agents, and OtherBio (4F) was a modality with no source directory
      at all. Knuckle now OWNS 4F and its directory is src/BprIDEngine/BprOtherBio/, so the
      taxonomy and the tree agree and 4C belongs to na-004/003 alone.
      MATCHER->TEMPLATE PAIRING: every matcher reads its same-numbered template, WITH NO
      EXCEPTIONS as of 2026-07-31. Until then M32 read T33 (the knuckle matcher under 4C) and was
      the only irregular pairing; moving knuckle to 4F made it M61-reads-T61 and the exception
      was deleted rather than generalised. The mapping is catalogue data (MatcherInfo::accepts),
      so an adapter derives IMatcher::accepts() from it rather than restating it, and
      Catalogue.EveryMatcherReadsItsSameNumberedTemplate pins the rule.
      CONSEQUENCE: **T32 (Inno Ansi/Iso, modality 3) is an ORPHAN — no matcher reads it.** It
      duplicates T22's name under modality 2, so presumably M22 (IdKit) serves both — but that
      needs a matcher accepting formats from TWO modalities, which Engine::match forbids today
      (matcher and template must share a modality). UNRESOLVED; decide before writing an
      Innovatrics adapter. orphan_templates() reports it, the CLI prints a warning, and a test
      pins T32 as the ONLY orphan so the set cannot drift unnoticed.
      Several catalogued entries wrap third-party code NOT in this repo (Innovatrics, Aware,
      InspireFace, AdaFace-CCTV, MagFace) — catalogued to reserve their IDs before any adapter
      exists. The catalogue is a CATALOGUE, not a registry: an entry means the ID is defined,
      not that an adapter is compiled in (Engine::has_matcher answers that).
