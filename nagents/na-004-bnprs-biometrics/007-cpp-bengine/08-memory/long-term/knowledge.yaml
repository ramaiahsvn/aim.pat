  - id: mem-008
    type: technical_knowledge
    content: >-
      2026-07-30 UNIFIED LIBRARY ARCHITECTURE (user-directed). Requirement: cpp-face builds ONLY
      BprFace; build bengine later and it already contains whatever BprFace gained; and the
      METHOD SIGNATURES MUST BE IDENTICAL between BprFace and BprIDEngine. Spec:
      07-axon-terminals/deliverables/bpridengine-library-architecture.md. Contract header
      WRITTEN: bpr.cpp/src/BprIDEngine/bengine/capi/bprid_abi.h.
      TWO MECHANISMS, BOTH REQUIRED — one alone is not enough.
      (1) GENERALIZED ABI. The libraries do NOT export per-modality functions. They export one
      set parameterised by TID/MID: BprID_Extract(tid, sample, out, io_size) and
      BprID_Match(mid, probe, plen, gallery, glen, &score, &raw), plus capability discovery
      (BprID_HasTemplate/ListTemplates/MatcherAccepts), BprID_Fuse, and introspection. Ids are
      (modality << 8) | variant over the taxonomy's own 4A..4F, so T11 == 0x4A01, M52 == 0x4E02 —
      self-describing on the wire, no lookup table. CONSEQUENCE: adding a modality NEVER changes
      the header; new algorithms are new TID/MID VALUES, not new symbols. BprFace.dll and
      BprIDEngine.dll therefore export an identical function set and differ only in what
      ListTemplates returns, so a host can swap one for the other with no code change.
      (2) SHARED OBJECTS. Signature identity is guaranteed by linking the SAME compiled objects
      (OBJECT libraries bprid_abi / bprid_common / bprid_<m>_algo / bprid_<m>_reg), not by
      keeping two definitions in sync. MUST be OBJECT, not STATIC: a linker pulls from an archive
      only to resolve an undefined symbol, and registration code is referenced by nobody, so a
      static archive is silently dropped and the consolidated library ships an EMPTY dispatch
      table. Measured, not assumed — before the WHOLE_ARCHIVE fix,
      `nm -a libBprIDEngine.dylib | grep fjfx_create_fmd_from_raw` returned nothing.
      Change propagation falls out for free: both artefacts derive from the same
      src/BprIDEngine/<M>/*_src.cmake and cli/BprIDEngine/<M>/ glue, so there is no second place
      to edit and no way to drift.
      PROOF GATE (not yet passing): diff the BprID_* symbol sets out of libBprFace and
      libBprIDEngine with nm -gU; must be empty. Belongs in CI.
      Legacy names (Bpr_Face_Matching_T11, Start_Iso_Fp_Matching, bpr_<mod>_get_version) stay as
      a thin compat layer only. They already embedded TIDs, so the taxonomy was implicitly there;
      the generalized ABI just makes it a parameter rather than part of the symbol name.
    created_at: "2026-07-30"
    last_accessed: "2026-07-30"
