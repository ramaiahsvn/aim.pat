  - id: mem-025
    type: incident_learning
    content: >-
      2026-07-31 THE LICENCE SUITE FAILED IN THE DEFAULT BUILD AND HAD SINCE IT WAS WRITTEN —
      A TEST THAT CROSSES THE ABI MUST NOT ASSUME AN ADAPTER IS COMPILED IN. Found incidentally
      while verifying the mem-024 rename: a clean `cmake -S . -B <dir>` with no options gave
      2 of 5 failures in bengine_abi_license_tests. Nothing to do with the rename.
      CAUSE: the two positive cases assert BprID_Match(M11, ...) == BPRID_OK. The DEFAULT build
      is core-only and registers NO adapters, so that call correctly returns
      BPRID_ERR_NOT_PRESENT (-2). The library was right and the test was wrong. It passes under
      -DBENGINE_BUILD_ALL=ON, which is the only way it had ever been run — mem-022 recorded the
      suite as passing on exactly that basis.
      WHY IT HID SO WELL: the suite already HAS a conditional (GTEST_SKIP if the test licence has
      expired), so it looked like the configuration-dependence had been thought about. It had —
      for the licence, not for the adapter. A partial guard reads like a complete one.
      FIX, and the choice inside it matters: guard only the two BprID_Match assertions on
      BprID_HasMatcher(BPRID_M11) == 1 — do NOT GTEST_SKIP the whole case. Everything else in
      those two cases (HasLicense, validate-before-store, Fuse) is adapter-independent and is
      precisely the coverage the default build should keep. Skipping the case would have traded
      one silent gap for another. BprID_HasMatcher is introspection and therefore ungated, so it
      reads correctly licensed or not. Result: core-only 37/37 with all five licence cases RUN,
      not skipped; BENGINE_BUILD_ALL 99/99; proof gate unchanged at 21 symbols on all six.
      THE GENERAL RULE FOR THIS ENGINE: the set of registered algorithms is a BUILD OPTION, so
      any assertion that depends on one is configuration-dependent by construction. Ask the ABI
      what it has (BprID_HasTemplate / BprID_HasMatcher) instead of assuming, and always run a
      no-options configure before believing a suite is green — BENGINE_BUILD_ALL is not the
      default and is not what a fresh clone builds.
