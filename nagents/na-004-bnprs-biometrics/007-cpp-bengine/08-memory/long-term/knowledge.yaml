        libBprFingerKnuckle      -> libBprOtherBio
      Core-only 37/37, BUILD_ALL 99/99, gate passes on all six at 21 symbols, CLI reports
      "14 template formats, 13 matchers across 6 modalities" (was 15/14).
      THIS ONE MOVED DATA, unlike the 4C rename. 0x4C03 and 0x4C02 are RETIRED, NOT REUSED and
      deliberately NOT aliased to the new ids — a silent forward-map would let a pre-move
      template through as if the modality had not changed. A stored T33 must be re-enrolled. The
      header carries that warning where T33/M32 used to be #defined.
      TWO ODDITIES DIED WITH IT, and both were long-standing:
      (1) The taxonomy's ONLY non-pairing id is gone — M61 reads T61 like every other matcher.
      The test became EveryMatcherReadsItsSameNumberedTemplate with the exception branch DELETED,
      not generalised. If an exception ever returns it has to be argued for there.
      (2) The tree and the taxonomy agree. 4C was two directories under two agents behind one
      code, which is why claiming an id there needed cross-agent coordination; now it is
      na-004/003's alone and 4F is na-004/004's alone.
      4F IS NO LONGER A PLACEHOLDER. The generic bOtherBio T61/M61 pair is gone — it was never
