      2026-07-31 MODALITY 4C RENAMED FingerCK -> FingerCless. NAME ONLY — NOTHING MOVED, and the
      distinction is the whole point of this entry.
        Modality::FingerCK          -> Modality::FingerCless      (enum, types.hpp)
        kFcK                        -> kFpCl                      (alias, catalogue.cpp)
        BPRID_MODALITY_FINGER_CK    -> BPRID_MODALITY_FINGER_CLESS (C ABI enum)
        "finger-ck"                 -> "finger-cless"             (short name, types.cpp)
        "BprFingerCless/Knuckle"    -> "BprFingerCless"           (product string, CLI output)
      The VALUE is still 0x4C. No id changed, no template format changed, no exported symbol
      changed; core-only 37/37, BENGINE_BUILD_ALL 99/99, proof gate 21 symbols on all six.
      [THE TRAP THIS CREATED IS GONE — SUPERSEDED BY mem-027 the same day. For a few hours 4C was
      named FingerCless while still holding T33/M32 knuckle, and this entry recorded loud
      warnings in types.hpp, the C ABI enum and a README footnote to that effect. Knuckle then
      moved to 4F, so 4C IS cless-only and the name is now simply accurate; those three warnings
      were removed. Recorded because the reasoning still applies to the next partial rename: a
      name that stops describing its contents needs a guard, and the guard is cheaper than the
      confusion.]
      THE USER CHOSE THIS DELIBERATELY over the alternative — AND THEN REVERSED IT THE SAME DAY.
      The split (knuckle out to 4F) was offered here and declined in favour of name-only; roughly
      an hour later the user asked for the BprFingerKnuckle folder to become BprOtherBio, which
      is the split. It went ahead — see mem-027, which supersedes the "knuckle is still in 4C"
      half of this entry. WHAT SURVIVES here is the rename itself (enum/alias/macro/short
      name/product string, value still 0x4C) and the cost estimate, which was right: the move
      touched the adapter, registrar, three test files and the CMake option.
      LESSON FOR OFFERING OPTIONS: "declined" was not "declined forever" — the user's earlier
      remark that "OtherBio and FingerKnuckle are same here" already pointed at the split, and
      the decline was really a sequencing choice. When an option is turned down but the user's
      own framing keeps implying it, expect it back.
      BPRID_MODALITY_FINGER_CK SURVIVES as a back-compat #define to the new enumerator. The value
      never moved so no binary needs rebuilding; the alias is purely for existing SOURCES.
      FOUND WHILE DOING IT, and it was already broken: na-004/003 and na-004/004 both stored
      `cmake --build . --target BprFingerCK` as their build instruction. THERE IS NO SUCH TARGET —
      the real ones are BprFingerCless and BprFingerKnuckle, two separate libraries, which the
      proof gate has been listing separately all along. Corrected in both agents' mem-002. The
      ABI header carried the same fiction ("BprFingerCK.so registers T31..T33") and now lists both
      libraries with which ids each registers. ONE MODALITY, TWO LIBRARIES — that is the thing the
      old name obscured in the other direction.
