  - id: mem-004
    type: incident_learning
    content: >-
      2026-07-30 ABI LEAK — hidden visibility on the SHARED target is not enough when a STATIC
      library is linked into it. First build of bengine's C ABI exported four symbols instead of
      two: BprIDEngine_Fuse and BprIDEngine_Version as intended, PLUS bpr::bengine::fuse and
      bpr::bengine::fusion_rule_name. Those C++ internals would have silently become part of the
      shipped ABI.
      CAUSE: CXX_VISIBILITY_PRESET hidden on the BprIDEngine shared target only governs the sources
      compiled AS PART OF that target (capi/*.cpp). The `bengine` static library was compiled
      separately with default visibility, and objects keep the visibility they were compiled with
      when linked into a .dylib/.so.
      FIX: set C_VISIBILITY_PRESET/CXX_VISIBILITY_PRESET hidden + VISIBILITY_INLINES_HIDDEN on the
      STATIC library too. Also set POSITION_INDEPENDENT_CODE ON — the same objects go into a shared
      lib, which is merely conventional on macOS but MANDATORY on Linux x86-64 (linking a non-PIC
      static into a .so fails outright), and this tree cross-compiles to Linux via toolchains/.
      VERIFY, do not assume: `nm -gU build/libBprIDEngine.dylib` must show EXACTLY the extern "C"
      entry points. This is worth checking on persoengine's BprCardEmv / BprIPersoAgent too — same
      structure (static persoengine linked into a shared capi lib), so it plausibly has the same
      leak. NOT yet checked.
    created_at: "2026-07-30"
    last_accessed: "2026-07-30"
    access_count: 1
    confidence: 1.0
    source: "session-2026-07-30"
    tags: [abi, visibility, static-into-shared, pic, cross-compile-linux, nm-verify, check-persoengine-too, lesson]

