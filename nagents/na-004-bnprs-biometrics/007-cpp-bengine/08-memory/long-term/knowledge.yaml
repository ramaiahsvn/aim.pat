  - id: mem-024
    type: technical_knowledge
    content: >-
      2026-07-31 FACE T13-T15 RE-POINTED BY THE USER. Modality 4A's third, fourth and fifth slots
      changed vendor. mem-006's table is amended in place; this entry is the WHY and the diff.
        T13  bFace(InspireFace)      ->  iFace(InspireFace)      -- renamed only, same backend
        T14  iFace(Innovatrics)      ->  aFace(AdaFace-CCTV)     -- replaced
        T15  tFace(Tech5)            ->  mFace(MagFace)          -- replaced
      T11 sFace(pat)/M11 and T12 sFace(opencv)/M12 are UNTOUCHED, and they are the only two with
      adapters, which is what made this free.
      NOTHING BUT NAMES MOVED. The ids are positional — (modality << 8) | variant — so T13 is
      still 0x4A03 and M15 still 0x4A05. No exported symbol, no header constant, no template
      format, no shipped byte changed; the proof gate still passes at 21 identical symbols on all
      six libraries and the full suite is 99/99. Renaming a catalogue entry is cheap EXACTLY
      BECAUSE the taxonomy numbers the slot rather than naming it — the property mem-008's
      generalized ABI was designed for, now paid off in the direction nobody planned for.
      THE PRECONDITION, and check it before doing this again: T13/T14/T15 had NO ADAPTERS. A
      catalogue entry with an adapter has templates in the field carrying that TID, and renaming
      the slot under them would be a silent reinterpretation of existing data. Reserved-but-empty
      slots are re-pointable; occupied ones are not.
      INNOVATRICS AND AWARE ARE STILL IN THE TAXONOMY — on FINGER, not face. T22/M22 IdKit
      (Innovatrics), T23/M23 Aware Iso, and T32 Inno Ansi/Iso are untouched. Only the FACE row
      moved; do not read this as dropping those vendors. TECH5 is now gone from the taxonomy
      entirely — it appeared nowhere else.
      A SHIFT IN KIND WORTH NOTICING: T13 InspireFace is an SDK, but AdaFace and MagFace are
      PUBLISHED MODELS (both CVPR-era face-recognition architectures with released weights), not
      vendor SDKs. So the standing line that "the vendor entries need SDKs we do not have" is no
      longer true of T14/T15 — they are ONNX-able and would plausibly run through the SAME
      OpenCV-DNN path T12 already uses, with no new third-party dependency beyond OpenCV, which
      the engine has already accepted for T12. That makes T14/T15 materially CHEAPER to implement
      than the vendor-SDK entries they replaced. Wording in README.md, catalogue.hpp and
      engine.hpp updated to say "SDKs and published models" rather than "SDKs".
      AdaFace's -CCTV suffix reads as a low-quality/surveillance-imagery variant, which fits
      AdaFace's quality-adaptive margin; MagFace embeds quality in the embedding MAGNITUDE, which
      is a natural fit for a quality assessor keyed on TID (quality.hpp). Neither is confirmed —
      ASK THE USER which weights are intended before writing either adapter.
      FILES TOUCHED (bpr.cpp, uncommitted at time of writing): bengine/src/catalogue.cpp (the
      source of truth), capi/bprid_abi.h comments, README.md taxonomy table + two vendor lists,
