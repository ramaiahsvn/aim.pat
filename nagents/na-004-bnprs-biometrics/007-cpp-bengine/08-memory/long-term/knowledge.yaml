  - id: mem-003
    type: project_context
    content: >-
      2026-07-30 CREATED bpr.cpp/src/BprIDEngine/bengine/ — committed b20e3b3, pushed to
      github.com/ramaiahsvn/bpr.cpp (17 files, 0 build artifacts).
      A SELF-CONTAINED CMake project following the src/BprCardEmv/persoengine pattern (its own
      project(), include/ src/ apps/ capi/ tests/, own .gitignore/README), deliberately NOT wired
      into the root CMakeLists — same as persoengine. If it ever must ship in the monolithic build,
      add a bpr_bengine_src.cmake fragment; do not make the root build depend on this directory.
      WHAT IT PROVIDES: the vocabulary the modules lack — Sample / Template / Score / Status
      (types.hpp), IExtractor, IMatcher, four fusion rules (Max/Min/Mean/WeightedSum), and an
      Engine registry that dispatches by Modality. Plus bengine-cli, a C ABI shared lib
      (libBprIDEngine, extern "C" — BprIDEngine_Fuse / _Version, for P/Invoke + JNI as persoengine
      does), and 13 GoogleTest cases. Verified: builds clean, 13/13 pass, cmake 4.2.3 + Apple clang.
      CORE IS DEPENDENCY-FREE ON PURPOSE — the modules' third-party needs are too unequal (OpenCV
      for face, none for iris) to put in a shared core. Every adapter is opt-in.
      THREE BEHAVIOURS chosen deliberately because they are easy to get silently wrong:
        - fuse() with nothing valid returns valid=false, NEVER a 0.0 that a caller could read as a
          confident non-match;
        - match_multi() SKIPS modalities with no registered adapter and reports attempted/succeeded,
          so a partly provisioned engine still yields a usable fused score instead of failing;
        - cross-modality comparison is rejected BEFORE dispatch — the wrapped modules would not all
          catch a finger template scored by an iris matcher, and the number would look plausible.
      STATUS: SCAFFOLD. **No modality adapter exists yet.** Each BENGINE_BUILD_<MODALITY> option is
      a configure-time FATAL_ERROR if switched on, so a build either has an adapter or fails loudly
      rather than silently matching nothing. README documents the four steps to add one; the
      cleanest first adapter is BprIris (buffers in, int out, no OpenCV).
      Score-level fusion only — decision-level fusion needs per-modality thresholds, which are
      na-004/010 algo-certify's concern, not this library's.
