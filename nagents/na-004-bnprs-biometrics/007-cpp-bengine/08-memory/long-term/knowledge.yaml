  - id: mem-007
    type: incident_learning
    content: >-
      2026-07-30 DESIGN CORRECTION — a modality is NOT a matcher, and I built it wrong first.
      The initial bengine registry was keyed on Modality: std::map<Modality, unique_ptr<IMatcher>>,
      one extractor and one matcher per modality. The product taxonomy (mem-006) then showed
      BprFace has FIVE template formats and FIVE matchers. A modality-keyed registry can hold one
      of each and SILENTLY DROPS the rest — register_matcher() would have overwritten M11 with M12
      with no error at all.
      FIX (commit edbb8c4): registry keyed on TemplateId / MatcherId. Template now carries its
      TID rather than just a modality, because an Innovatrics ANSI/ISO finger template (T22) and a
      bFinger template (T21) are both "finger" and are NOT interchangeable. MatchRequest names the
      matcher to use. IMatcher::accepts() declares readable formats explicitly, since same-modality
      does not imply compatible.
      LESSON: I inferred the cardinality (one algorithm per modality) from the SOURCE TREE, where
      each modality is one directory. The product taxonomy is a different axis — one directory can
      ship several template formats and several matchers, some from third-party SDKs that are not
      in the tree at all. Ask for the product taxonomy BEFORE designing a registry key; the
      directory layout is not evidence of it.
      Guard added: catalogue_test.cpp asserts per-modality counts, id uniqueness, contiguous
      1-based variants and the 4A..4F codes, so editing the table cannot silently drift.
      29 tests. [[mem-006]] [[mem-003]]
