  - id: mem-023
    type: incident_learning
    content: >-
      2026-07-31 THE WINDOWS BUILD WORKS AND NOW MATCHES THE OTHER PLATFORMS (bpr.cpp 2aa3c62,
      pushed). Four defects, ALL Windows-only. The ELF and Mach-O output is byte-identical before
      and after — a stripped macOS rebuild matched the published darwin-arm64 artifact to 8 bytes
      with the same exported symbol set — so nothing here changes what the other platforms ship.
      THE ONE THAT MATTERS: BprIDEngine.dll EXPORTED 363 SYMBOLS INSTEAD OF 21, and among them
      were BprLicense::patGlobalLicGenerator and BprLicGeneration — THE LICENCE GENERATOR,
      callable by anyone holding the DLL. mem-013 asserted bengine's own libraries were unaffected
      by the root toolchain's --export-all-symbols because they use hidden visibility plus
      BPRID_API. That is TRUE ON ELF AND MACH-O AND MEANINGLESS ON PE. Hidden visibility is not a
      PE concept: mingw's default is "export every global symbol unless something in the image is
      dllexport'd", and toolchains/toolchain_windows_64.cmake additionally forces
      -Wl,--export-all-symbols. Fixed with -Wl,--exclude-all-symbols, which restores the intended
      rule — nothing exported but what __declspec(dllexport) marks. 21 = the 19 BprID_* of mem-022
      plus the 2 common licence symbols.
      GENERAL LESSON, and it is the third time this class of bug has bitten (mem-004, mem-010,
      now this): I VERIFIED THE EXPORT SET WITH nm ON A .dylib AND CALLED IT VERIFIED. An export
      policy is per-object-format. `nm -gU` on a Mach-O says nothing about the PE the same source
      produces. Check every format you ship, or claim only the one you checked.
      THE DLL IS ALSO SELF-CONTAINED NOW. mingw links libstdc++, libgcc and libwinpthread as DLLs
      by default, so the output imported libstdc++-6.dll / libgcc_s_seh-1.dll /
      libwinpthread-1.dll — none present on a stock Windows machine, while the .so and .dylib
      carry no such dependency. -static pulls all three in (the CRT stays dynamic, api-ms-win-crt-*,
      which is correct — that ships with Windows). -s on Release then strips the very large symbol
      table static libstdc++ brings, which PE keeps in the image: lean DLL 16.8 -> 1.5 MB, T12
      42.9 -> 17.2 MB, the latter matching the .so.
      Both live in bengine_harden_shared(), the shared-library counterpart to bengine_harden(), so
      the export policy has ONE place to live. Called from bprid_add_modality() and from the
      BprIDEngine target — a new modality gets it automatically.
      TWO SMALLER ONES: (1) -D_isnan=isnan is now NON-WINDOWS ONLY. Windows already has _isnan
      (MSVC intrinsic, mingw declaration in math.h), so the macro rewrote mingw's own
      `int _isnan(double)` into `int isnan(double)`, colliding with `using std::isnan` lower in the
      SAME header and failing EVERY Masek translation unit — including files that never call it,
      because the collision is in the header, not the code. A compatibility shim for one toolchain
      is a defect on the toolchain that already has the thing. (2) bengine_aprcommon links
      `version` on Windows, PUBLIC: BprUtils reads the running module's file version via
      GetFileVersionInfo* / VerQueryValue, which live in version.dll and are not in mingw's default
      link set. PUBLIC so it propagates to every Bpr<Modality>.dll and BprIDEngine.dll.
      STILL UNFIXED, unchanged by this: the ROOT build's --export-all-symbols leak (mem-013)
      affects every DLL the monolithic build ships, biometrics or not. This commit only fixed the
      libraries bengine/CMakeLists.txt produces.
