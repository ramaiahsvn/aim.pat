  - id: mem-009
    type: process_note
    content: >-
      2026-07-30 THE ROOT BUILD ALREADY SHIPS PER-MODALITY LIBRARIES — do not build a parallel
      set. bpr.cpp/CMakeLists.txt selects ONE library at a time via OUTFILENAME and already has
      branches for BprFace, BprFinger and BprIris, each combining its *_src.cmake sources with
      export glue under cli/BprIDEngine/<Modality>/. THOSE are the independent libraries the user
      wants, and they belong to na-004/001..006.
      I NEARLY BROKE THIS: my first restructure created targets literally named BprFinger and
      BprIris inside bengine — the same names the root build owns, for different artefacts.
      Separate CMake projects so no error today, but add_subdirectory() from the root would fail
      outright. Renamed to bengine_<mod>_algo. RULE: bengine must never define a target named
      Bpr<Modality>. The user caught this by asking whether the root CMakeLists duplicated the
      new plan — it did.
      VERIFIED STATE of the six (src.cmake / cli glue / root branch / glue compiles -DNO_MFC):
      Face yes/yes/yes/YES; Finger yes/yes/yes/NO(B3 __declspec+BSTR); FingerCless no/yes/no/YES;
      FingerKnuckle no/yes/no/YES; Palmprint no/no/no/n-a (directory is EMPTY); Iris
      yes/yes/yes/YES. So three are complete, two have export glue wired to NOTHING, one does not
      exist.
      KEY GOTCHA — <afx.h>: all five glue files pull MFC transitively via
      AprCommon/BprUtils/bpr_utils_main.h, which guards it with #ifndef NO_MFC. Compiling with
      -DNO_MFC makes four of five build clean on clang. Without that flag the entire cli/ export
      layer looks Windows-only, which is what it appeared to be until the guard was found.
      COMPLEMENTARY, NOT REDUNDANT: root BprFinger ships MATCHING only (M3gl + Nnmq ->
      Start_Iso_Fp_Matching) and contains no extractor; bengine's T21 is EXTRACTION only (Fjfx)
      and has no matcher. Fjfx is referenced by NOTHING in the root build. Neither half is
      complete alone — that is blocker B7 (na-004/002).
      BLOCKERS B1..B7 with owners are in the architecture deliverable; B1 (BprLicGeneration /
      BprLicVerification defined in THREE glue files) and B2 (int main() in the BprIris glue) are
      the two that actually prevent the consolidated library from linking.
      All six modality agents were fed this contract as their mem-002/mem-003 on 2026-07-30.
