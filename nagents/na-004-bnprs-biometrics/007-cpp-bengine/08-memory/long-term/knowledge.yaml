  - id: mem-029
    type: process_note
    content: >-
      2026-07-31 ROOT --export-all-symbols FIX — STARTED, PAUSED BY THE USER, NOT COMMITTED. Work
      is in bpr.cpp `git stash@{0}` ("WIP: root toolchain export-all-symbols fix"). Everything
      below was MEASURED on real mingw builds, so resuming does not need re-investigation.
      THE LEAK IS AN ORDER OF MAGNITUDE WORSE THAN mem-013 SAID. It recorded 363 symbols on one
      DLL; actual export-table counts, x86_64 mingw, Release:
        BprLicBase 198   BprFinger 821   BprICBA 303   BprCardQi 456
      mem-013's 363 was probably an nm count, not the PE export table. Either way the intended
      surface for these is single digits to a few dozen.
      ROOT CAUSE, and it is not the flag: every glue file guards its export macro on a
      *_EXPORTS define, and the build defined that guard for BprPinblock ONLY
      (target_compile_definitions at the BprPinblock branch). So BPRLICENSE_EXPORT,
      BPRIDFINGER_EXPORT and the BprIris / BprFingerCless / BprOtherBio macros all resolved to
      dllIMPORT WHILE COMPILING THE DLLS THAT DEFINE THOSE FUNCTIONS. Nothing was annotated, and
      -Wl,--export-all-symbols was the only reason anything was exported. BprQiEmv was already
      fine — add_definitions(-DEXPORTING_BPRQIEMV_DLL) at the top does exactly this job for it,
      which is the precedent the fix follows.
      THE FIX AS STASHED: add_definitions(-DMY_LIBRARY_EXPORTS) beside the QiEmv one, and swap
      --export-all-symbols -> --exclude-all-symbols in all THREE Windows toolchains (32, 64,
      arm64 — arm64 is easy to miss, the flag is on a continuation line).
      RESULT — TWO LIBRARIES ARE ALREADY CORRECT:
        BprLicBase  198 -> 7   exactly the intended C API (bpr_bgl_*, bpr_global_lic_*,
                               bpr_is_valid_license, bpr_licbase_get_version) and the mangled
                               BprLicense::patGlobalLicGenerator IS GONE — the security win.
        BprFinger   821 -> 2   Start_Iso_Fp_Matching + bpr_finger_get_version, which is exactly
                               what mem-013 named as the intended pair.
      WHY IT IS PAUSED — BprICBA GOES TO **ZERO** EXPORTS. Its glue file
      (cli/BprICBA/BprICBA_dll_exports.cpp, 17 lines) contains ONLY DECLARATIONS annotated with
      BPR_EXPORT; the DEFINITIONS live in other translation units (src/BprICBA/, the QR and bPass
      sources) with no annotation at all. A dllexport on a declaration in a TU that never defines
      the function exports nothing. --export-all-symbols hid that completely.
      SO THE REAL SHAPE OF THIS TASK: it is not a toolchain flag swap, it is a PER-LIBRARY audit
      that the exported API is annotated AT THE DEFINITIONS. Do it library by library, each
      verified by diffing the PE export table before and after — do NOT flip the flag globally
      and hope.
      ALSO FOUND: BprCardQi 456 -> 59, but the 59 still include a mangled C++ symbol
      (_ZN4pcsc11Transaction6commitENS_11DispositionE), so BprPcSc has an explicit dllexport on a
      C++ class member that should probably not be in the ABI. Not investigated.
      NOT BUILDABLE ON pat-m4p AS-IS, so they cannot be verified this way yet: BprCardEmv and
      BprQiEmv fail to build for Windows; BprIris fails; BprFace needs the Windows static OpenCV.
      Those need their build fixed before their export surface can be checked at all.
      MEASUREMENT GOTCHA THAT COST TIME: do not parse `objdump -p` from the export-table heading
      to EOF — the import tables, .pdata and resources follow, and you get thousands of bogus
      "exports" (I briefly believed BprLicBase exported 5220). Read only the
      "[Ordinal/Name Pointer] Table" block, stopping at the blank line; NO export table at all
      means zero exports, which is itself the finding for BprICBA.
