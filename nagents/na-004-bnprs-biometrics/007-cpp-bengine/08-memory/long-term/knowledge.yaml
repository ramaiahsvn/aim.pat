  - id: mem-032
    type: infrastructure
    content: >-
      2026-08-01 T13 iFace (InspireFace) IS BUILT — DEFAULT-OFF (bpr.cpp c72d7d6). Modality 4A
      now has adapters for ALL FIVE catalogued variants. Option BENGINE_BUILD_FACE_T13, which
      additionally needs INSPIREFACE_ROOT (defaults to .deps/inspireface).
      LICENSING — USER DECISION AFTER THE CONCERN WAS RAISED, RECORDED AS THEIRS. InspireFace
      (github.com/HyperInspire/InspireFace) ships NO LICENCE FILE: I checked the whole tree — no
      LICENSE, no COPYING, no SPDX headers, only a README line restricting the MODELS to academic
      use. So this is WORSE than T14/T15, not the same: there the architectures are genuinely MIT
      and Apache-2.0 with real licence files, so BNPRS can train its own weights and own them
      outright (mem-030). Here NEITHER the SDK code NOR a pack carries a commercial grant and
      there is NO self-help path. Commercial terms would come from InsightFace
      (contact@insightface.ai) and must cover BOTH. Raised, the user directed the build anyway,
      it is their call. Default-off, and configuring it prints a warning.
      A CORRECTION I MADE MID-TASK AND SHOULD NOT HAVE NEEDED TO: I first told the user "the code
      is MIT", having carried that across from a search result about INSIGHTFACE
      (deepinsight/insightface, a different repo under a different org). InspireFace is
      HyperInspire's and has no licence at all. Verify the LICENSE FILE IN THE ACTUAL REPO, not a
      sibling project's terms — especially on the one point the decision turns on.
      IT IS AN SDK, NOT A MODEL FILE, so it does NOT ride the EmbedSpec machinery that serves
      T14/T15. Own session lifecycle, own detector and tracker, own image-stream type, own
      comparison call; there is no ONNX to hand to cv::dnn. Forcing it into EmbedSpec would mean
      an EmbedSpec mostly ignored. It shares ONLY the BFE1 blob, at variant 3 — so that variant
      byte now separates THREE same-shaped float vectors rather than two, which is more value
      than it looked like when written.
      TWO SDK PROPERTIES THAT SHAPED THE ADAPTER, both worth knowing before touching it:
      (1) HFLaunchInspireFace IS PROCESS-GLOBAL AND ONE-TIME — it loads the pack for the whole
      process, not per session, so the adapter shares global state with anything else in the
      process using InspireFace. Behind a std::once_flag, and teardown DELIBERATELY DOES NOT call
      HFTerminateInspireFace: terminating a global the host may still be using is a worse bug
      than leaking it, and this library cannot know who else is a client.
      (2) FEATURE LENGTH IS A RUNTIME PROPERTY OF THE LOADED PACK (HFGetFeatureLength), not a
      constant — Pikachu and Megatron need not agree. So two T13 templates from different packs
      carry the SAME TID and are NOT comparable. The matcher refuses a dimension mismatch, which
      catches the common case but CANNOT catch two packs that happen to share a dimension.
      ONE PACK PER GALLERY.
      MATCHING COMPUTES COSINE DIRECTLY rather than calling HFFaceComparison, which would need a
      launched SDK and a loaded pack merely to take a dot product of two vectors already in hand.
      That preserves the property T14/T15 have and it matters more here: matching needs no model,
      so verifying against an existing gallery works where no pack was ever deployed — which,
      given the licensing, is every machine that has not bought terms.
      BUILT AS libIFace, via src/BprIDEngine/BprFace/scripts/build-inspireface.sh (committed
      recipe, git-ignored .deps build tree — the pattern the build-*-selfcontained.sh scripts
      beside it already established). The rename matches the taxonomy's "iFace" and is COSMETIC:
      the script, the adapter header and the CMake all state plainly that libIFace IS
      InspireFace, because with no licence file the provenance is worth more than the tidiness.
      Two build notes: the bundled MNN needs -DCMAKE_POLICY_VERSION_MINIMUM=3.5 or CMake 4.x
      refuses to configure it at all, and the target rename is injected by appending
      set_target_properties(... OUTPUT_NAME IFace) to cpp/inspireface/CMakeLists.txt, idempotently.
      VERIFIED: default 44 tests, T13 61, T14+T15 60, BUILD_ALL 107 (enabling NONE of T13/14/15),
      everything-on 122. Proof gate 21 symbols across all six libraries throughout. With
      everything on the library registers T13 T14 T15 T21 T31 T41 T51 T61 and matchers M11 M13
      M14 M15 M41 M51 M61.
      NOT VERIFIED: recognition. No pack is deployed, so detection and extraction are untested.
      What IS tested is that a missing pack degrades to an error rather than a crash.
