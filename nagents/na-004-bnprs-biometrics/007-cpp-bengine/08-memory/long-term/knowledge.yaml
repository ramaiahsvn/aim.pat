    content: >-
      2026-07-30 WHAT BprIDEngine ACTUALLY IS (measured, not assumed — check before designing
      anything engine-level). Path: bpr.cpp/src/BprIDEngine/.
      (1) It is a bare CONTAINER. As of 2026-07-30 the top level holds only the six module
      directories and a .DS_Store — **zero top-level source files, no shared layer, no common
      header, no CMakeLists of its own.** Every module is fully self-contained. So "the engine"
      did not exist as code before bengine/ was added; do not assume a shared abstraction is there.
      (2) Only THREE of the six modules are in the root BprCpp build. The root CMakeLists.txt
      includes bpr_face_src.cmake, bpr_finger_src.cmake and bpr_iris_src.cmake — and those are the
      only three *_src.cmake fragments that exist. **BprFingerCless, BprFingerKnuckle and
      BprPalmprint are on disk but built by NOTHING.** BprPalmprint has no headers at all (empty
      but for the directory). Treat those three as unbuilt/unowned source until proven otherwise.
      (3) The module APIs DIVERGE SHARPLY — this is the whole reason an engine layer is worth
      having, and the concrete evidence for it:
        - BprIris:  IrisMasekTemplate::bpr_iris_feature_extraction_masek(const char* file_name,
                    int algType) -> int; IrisMasekMatching::bpr_iris_masek_matching(unsigned char*
                    qmin, int qminLength, ...) -> int. File path in, raw buffer for matching,
                    int status out. Static-class style, no namespace.
        - BprFinger: FingerIsoMatching::bpr_matcher(xyt_struct*, xyt_struct*) -> int. Minutiae
                    structs (xyt_struct/edgepair_struct), MAX_MINUTIAE fixed arrays.
        - BprFace:  OpenCV-based (cv::VideoCapture), frame CALLBACKS (BprFrameCallback), its own
                    BPR_FACE_EXPORT dllexport macro and ERR_CAM_* codes. Completely different shape.
