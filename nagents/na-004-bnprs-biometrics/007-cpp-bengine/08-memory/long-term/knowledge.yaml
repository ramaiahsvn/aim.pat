  - id: mem-035
    type: reference
    content: >-
      2026-08-01 FACE EVALUATION RESULTS LIVE IN na-004/012 rnd-evaluations, NOT HERE. The user
      moved evaluation ownership there the same day so that measuring an algorithm does not
      disturb this agent every time. This entry is deliberately a POINTER: numbers get
      re-measured often and would churn the engine agent's memory.
        results + protocol gotchas : na-004/012 mem-002, mem-003, mem-004
        full report                : na-004/012 07-axon-terminals/deliverables/eval-reports/
                                     2026-08-01-face-4variant-lfw-orl.md
      THE DIVIDING LINE, so this agent knows what it is still on the hook for: cpp-bengine owns
      "does it compute the right thing" — adapters, the BprID_* ABI, registration, build options,
      the proof gate. na-004/012 owns "how good is it". WHEN EVALUATION FINDS A DEFECT IT COMES
      BACK HERE, or to the owning modality agent, to be fixed — that is what happened with the
      mirrored alignment (mem-034) and the detector-threshold mismatch on 2026-08-01.
      THE ONE NUMBER WORTH CARRYING IN THIS AGENT'S HEAD: on LFW the three modern variants sit at
      99.0-99.4% while T12 sFace — THE ONLY SHIPPABLE ONE — sits at 96.6%, and the evidence says
      integration rather than the model (it is the only variant sensitive to external
      pre-alignment, and its fold variance is 3x the others). Routed to na-004/001 cpp-face.
      The harness itself, bengine-eval, still lives in this tree at bengine/apps/bengine-eval/
      because it must link the facade — but na-004/012 owns it. Do not change its protocol or
      metrics without them.
