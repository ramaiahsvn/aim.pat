    legacy_template_api: "Bpr_FaceRecog_T12_Template — FileStorage YAML, key bpr_face_t12_features"
    m11_precedent: "bpr.cpp src/BprIDEngine/bengine/src/adapters/face_sface.cpp (commit 8ad5be2)"
    blob_precedent: "bengine/include/bengine/adapters/palmprint_compcode.hpp — PalmBlob"
    architectural_question: "task-001 (does the consolidated engine carry OpenCV by default)"
    memories: ["mem-001 (static OpenCV recipe)", "mem-005 (M11)", "na-004/007 mem-020"]
