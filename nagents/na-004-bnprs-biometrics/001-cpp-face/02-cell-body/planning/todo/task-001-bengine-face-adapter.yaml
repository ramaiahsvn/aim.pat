# Task — BprFace is the last modality with no bengine adapter
# Raised 2026-07-31. Tracked in na-004/007 mem-016/mem-017 since 2026-07-30 with no task file.
# OWNER: na-004/001 cpp-face. The OpenCV decision inside it is NOT this agent's alone.

task:
  id: "task-001"
  subject: "Decide in writing whether the consolidated BprIDEngine carries OpenCV by default"
  progress_2026_07_31: >-
    BOTH HALVES ARE NOW ADAPTED — M11 (8ad5be2) and T12/M12 (151a751, task-002). Nothing about
    modality 4A is blocked on code any more. What is left in THIS task is only the architectural
    question, and the work has already made it cheaper to answer either way: T12 sits behind its
    own BENGINE_BUILD_FACE_T12 option, so the default consolidated build carries zero OpenCV and
    still matches faces, while enabling the option is a deliberate ~70 MB choice. Option 1 in the
    description below is now the DE FACTO state and just needs writing down.
  progress_2026_08_01: >-
    FOUR OF FIVE VARIANTS ARE NOW ADAPTED — T14 aFace(AdaFace-CCTV) and T15 mFace(MagFace) landed
    (cc619b0), leaving only T13 iFace(InspireFace) without one. Both sit behind their OWN
    default-off options (BENGINE_BUILD_FACE_T14 / _T15) which BUILD_ALL does not enable, for a
    LICENSING reason rather than a size one — see na-004/007 mem-030 and mem-031.
    THIS STRENGTHENS THE ANSWER TO THE OPEN QUESTION rather than complicating it. There are now
    THREE OpenCV-carrying variants in this modality and all three are opt-in, so the pattern is
    no longer a one-off accommodation for T12 — it is how modality 4A works: the default
    consolidated build carries ZERO OpenCV and still matches faces via M11, and every heavyweight
    variant is a deliberate per-variant choice. Option 1 is now the de facto state three times
    over and still only needs writing down. Whoever writes it should describe the RULE (an
    OpenCV-dependent face variant gets its own default-off option) rather than naming T12.
    Original note follows.

    M11 IS DONE AND SHIPPED (bpr.cpp 8ad5be2). Reading the module showed the OpenCV question
    only covers HALF of modality 4A, and the other half needed no decision:

      T11 sFace(pat)         extraction   nothing in this repo produces one
      M11 sFace(pat-cosine)  matching     BprUtils::computeCosineSimilarity_t11, plain C++
      T12 sFace(opencv)      extraction   cv::FaceRecognizerSF, cv::dnn
      M12 Yunet+sFace        matching     OpenCV

    Only T12/M12 need OpenCV. M11 went in at zero dependency cost, so BprFace is now in the
    proof gate (all six modalities, 17 identical symbols) and libBprFace links no OpenCV.
    Verified through the C ABI from both libBprIDEngine and standalone libBprFace: genuine
    0.9998, impostor clamped to 0.0 with raw -6914, bad length rc=-5.

    WHAT REMAINS is exactly the original decision, now smaller and no longer blocking the
    modality's presence in the engine — only its EXTRACTION. Nothing in bpr.cpp can produce a
    face template; T11s arrive from pat's model on the device and T12 extraction is the OpenCV
    one. The three options in the description below still stand, but option 1 is now much
    cheaper than when it was written, because M11 already gives the consolidated library a
    working face matcher without OpenCV.

    ALSO RAISED FROM THIS WORK, and it is this agent's: the T11 decoder in
    AprCommon/BprUtils is lenient in a way that corrupts silently. std::stoi does not throw on
    "00x1200" — it parses the leading digits and returns 0 — and any sign char that is not '1'
    is treated as positive. The bengine adapter now validates every character before calling,
    but BprUtils itself still accepts corrupt input. Not fixed there because it is shared with
    BprLicense. Worth its own task.

  description: >-
    [SUPERSEDED IN PART — see progress_2026_07_31; M11 is done and the scope is now T12/M12.]
    Five of six modalities are in the proof gate (T21 finger, T31 fingercless, T33 knuckle,
    T41 palmprint, T51 iris), each exporting the same 17 BprID_* symbols. BprFace (modality 1,
    0x4A) is the only one left, and it is the only one that needs OpenCV — which is precisely
    the architectural question the engine has spent its whole life avoiding.

    WHY THIS IS NOT JUST "WRITE ANOTHER ADAPTER". Every modality currently in BprIDEngine is
    dependency-free: FingerJetFX, Masek, CompCode x2, CLAHE. That is what lets one consolidated
    binary carry all of them. BprFace inference is cv::dnn reading an ONNX model, so OpenCV is
    not optional for it — and linking OpenCV into BprIDEngine.so imposes it on every consumer of
    every other modality, including ones that only want a fingerprint.

    THE DECISION IS THE FIRST DELIVERABLE, and it belongs to na-004/007 (engine architecture)
    with na-002-bnprs-core (distribution). Roughly three ways it can go:

      1. BprFace stays OUT of the consolidated library and ships only as a standalone
         BprFace.so/.dll carrying its own OpenCV. BprIDEngine then means "the five
         dependency-free modalities", which needs saying out loud in the architecture doc
         because the name currently implies all six.
      2. BprIDEngine takes the OpenCV dependency and everyone carries it.
      3. A second consolidated target — BprIDEngine (lean) and BprIDEngineFull (with face) —
         paid for in build matrix and in two things to keep in step.

    Option 1 costs the least and is the current de-facto state; it just is not written down as a
    decision. Do not pick by default — write it down.

    WHAT IS ALREADY DONE AND MUST NOT BE REDONE: the self-contained static-OpenCV build. mem-001
    has the full recipe (OpenCV 4.10.0, BUILD_SHARED_LIBS=OFF, the exact BUILD_LIST, every
    WITH_* external dep OFF, and the otool -L / ldd verification). macOS is classified as
    PROJECTTYPE=SO_Linux and needs no CMake change — just point OpenCV_DIR at the static build.
    That work makes option 1 cheap.

    ONCE THE DECISION IS MADE, the adapter itself is the standard four steps (bengine README):
    IExtractor/IMatcher over BprFace, a registrar, BENGINE_BUILD_FACE, and the proof gate.
    Modality 4A has FIVE templates and FIVE matchers catalogued (T11 sFace(pat), T12
    sFace(opencv), T13 iFace(InspireFace), T14 aFace(AdaFace-CCTV), T15 mFace(MagFace), and M11-M15
    — T13-T15 re-pointed by the user 2026-07-31, see na-004/007 mem-024)
    — do NOT try to implement all of them. Pick one pair, almost certainly T11/M11, and register
    only that; the registry is keyed on TemplateId, not on Modality, precisely so a modality can
    land one variant at a time.

    Note BENGINE_BUILD_FACE is currently a deliberate configure-time FATAL_ERROR rather than a
    silent no-op, so nobody can accidentally half-enable this. Remove that guard as part of the
    work, not before it.

  resolution_2026_08_14: >-
    DONE. The decision is written into na-004/007
    07-axon-terminals/deliverables/bpridengine-library-architecture.md as a new section,
    "Heavyweight and encumbered dependencies — the opt-in rule", plus Rule 6 in the Rules list.
    Written as the RULE rather than as a T12 exception, per the note above: a variant with a
    heavyweight or licence-encumbered dependency gets its own default-off option, and
    BENGINE_BUILD_ALL never turns it on.
    TWO THINGS IN THIS TASK FILE WERE STALE and were checked against the CMake before writing:
      * "leaving only T13 iFace(InspireFace) without one" — WRONG as of 2026-08-14. T13 IS
        adapted: src/adapters/face_inspire.cpp exists and CMakeLists.txt has a full
        BENGINE_BUILD_FACE_T13 block with INSPIREFACE_ROOT discovery. ALL FIVE variants are
        adapted; the option is off because the SDK is not vendored and ships no licence file.
      * "BENGINE_BUILD_FACE is currently a deliberate configure-time FATAL_ERROR ... Remove that
        guard as part of the work" — ALREADY GONE. It is now a normal option that builds the M11
        matcher with no OpenCV. Nothing to remove.
    WORTH RECORDING: four of the five variants are gated on LICENSING, not size (T13 SDK licence,
    T14/T15 research-licensed checkpoints), so the rule is deliberately phrased around "can we
    ship it?" rather than "is it big?". The mechanism only works because the registry is keyed on
    TemplateId rather than Modality — Rule 4 is what makes Rule 6 possible.
