  - id: mem-008
    type: incident_learning
    content: >-
      2026-07-31 AN ADAPTER THAT LOADS A HEAVY RESOURCE MUST DO IT LAZILY — THE REGISTRAR
      CONSTRUCTS IT AT LIBRARY LOAD.
      BPRID_REGISTER runs during static initialisation, so every registered adapter is
      constructed the moment the library is dlopen'd. I built BprFaceRecog in the T12 adapter's
      constructor, which loads three ONNX models. On a machine where the models are not deployed
      that threw cv::Exception out of a static initialiser and TERMINATED THE PROCESS:
      "libc++abi: terminating due to uncaught exception ... Can't read ONNX file". Every other
      modality in the library goes down with it, over an OPTIONAL face model. Found by hiding
      the models and running; it is not a failure mode any test would have caught by accident.
      Fixed by constructing on first use, attempting once, and returning ModuleError when it
      fails. Also means processes that never touch face do not parse 44 MB of ONNX at load.
      SECOND LESSON, same session: ${OpenCV_LIBS} IS NOT A DEPENDENCY LIST. It is every module
      the package happened to build. Here it included opencv_viz -> VTK, which is absent on this
      Mac, and the test binary died in dyld 33 seconds into startup — presenting first as a
      gtest "discovery timeout" and a deleted executable, which looks like a compile error.
      Name the modules you actually use: core imgproc imgcodecs dnn objdetect calib3d.
    created_at: "2026-07-31"
    last_accessed: "2026-07-31"
    access_count: 1
    confidence: 1.0
    source: "session-2026-07-31"
    tags: [lazy-init-required, registrar-runs-at-load, static-init-abort, opencv-libs-is-not-a-list, name-your-modules]

  - id: mem-009
    type: infrastructure
    content: >-
      2026-07-31 FIXED — BprFace NO LONGER DISCARDS THE CALLER'S LICENCE CODE (bpr.cpp 8dd621a).
      BprLicBase::Pat_is_valid_license took a qiCode and a length and IGNORED BOTH, validating a
      hardcoded "C884C92A9295C92F" with an empty product code. So every BprFace entry point —
      Bpr_FaceRecog_T12_Init, Bpr_FaceDetect_T12_Init, Bpr_SmokeDetect_T12_Init,
      Bpr_FightDetect_T12_Init — accepted a licence from the caller and then checked a constant
      compiled into the build. Any code passed, including empty or garbage. It was an expiry date
      on the binary, not per-customer licensing.
      Now validates the bytes it is given and fails closed on null, empty or negative length.
      Verified: valid true; garbage, empty, null, negative length and a TRUNCATED valid code all
      false.
      THIS WAS THE LAST PLACE IN THE TREE THAT DID THIS. BprLicVerification in both the DLL and
      the JNI glue already passed the caller's bytes through, and so does the BprIDEngine ABI
      gate (na-004/007 mem-022).
      IT IS A BEHAVIOURAL CHANGE TO A SHIPPED LIBRARY, stated in the header: a host that has been
      passing a placeholder qiCode has been succeeding and now fails. BprFace deployments need a
      real licence at the moment they take this build — worth saying to whoever ships next.
      LEFT ALONE DELIBERATELY: Pat_is_valid_license_global(). It takes no arguments so it has no
      caller code to honour, and it asks a different question — is this BINARY still inside its
      own validity window. BprSFaceDetect checks both (customer AND build); the other three check
      only the customer. WHETHER THAT ASYMMETRY IS INTENTIONAL IS STILL OPEN and is this agent's
      to decide.
      Also still open: the product code is empty everywhere, so a valid licence for any product
      unlocks any product. Tightening it means reissuing licences.
      The bengine T12 adapter is unaffected — it calls BprFaceRecog::_face_recog_init directly,
      below the gated wrapper, and its callers are gated by BprID_SetLicense instead.
    created_at: "2026-07-31"
    last_accessed: "2026-07-31"
    access_count: 1
    confidence: 1.0
