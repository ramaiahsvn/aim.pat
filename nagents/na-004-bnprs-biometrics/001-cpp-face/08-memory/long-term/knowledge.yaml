  - id: mem-013
    type: technical_knowledge
    content: >-
      THE BPRFACE VERSION LIVES IN THREE FILES AND THEY MUST MOVE TOGETHER —
      src/AprCommon/BprVersions/bpr_versions.h (BPR_FACE_VER_PATCH),
      src/AprCommon/BprVersions/bpr_versions.cmake (the BprFace branch's set(VER_PATCH …)), and the
      root Makefile (VERSION_BprFace). Bumping ONLY the header builds a library still NAMED
      2.24.115 while its embedded string says the new number, because the filename comes from the
      other two. The Makefile even carries a "keep in sync" comment. Check all three, then confirm
      by the ARTIFACT NAME and by `strings <lib> | grep 2\.24\.` before staging.
      BprIDEngine is NOT in the cmake/Makefile files (bengine has its own CMakeLists reading the
      header directly), so 2.24.901 was not exposed to this.
      Also: raw `cmake -S . -B …` does NOT pass LIB_OUTPUT_DIR, which the root Makefile supplies —
      so on Windows builds libBprFaceDeps.dll lands at the BUILD ROOT, not bin/. It is easy to miss
      and libBprFace.dll IMPORTS it; shipping without it yields a DLL that cannot load.
    created_at: "2026-08-01"
    last_accessed: "2026-08-01"
