  - id: mem-006
    type: incident_learning
    content: >-
      2026-07-31 std::stoi DOES NOT THROW ON TRAILING JUNK, and the T11 decoder relies on it to.
      BprUtils::computeCosineSimilarity_t11 reads each 7-digit magnitude with std::stoi. std::stoi
      only throws when NO conversion is possible, so "00x1200" parses the leading "00", stops,
      and returns 0 — no error. The sign character is not checked at all: anything that is not
      '1' is treated as positive. A corrupted template therefore compares as a valid one with
      mangled elements and the caller gets a CONFIDENT, WRONG similarity.
      Found by writing a test that assumed the decoder would reject junk; it returned Ok. The
      test was right about what SHOULD happen and wrong about what does.
      Fixed in the bengine M11 adapter, which now validates every character (sign is '0' or '1',
      chars 1-7 are digits) before calling. NOT fixed in BprUtils: it is shared with BprLicense
      and the blast radius is wider than this modality — raised as a separate concern.
      GENERAL FORM: when validation lives in a shared utility you do not own, verify what it
      actually rejects rather than what its interface implies. Prefer validating at your own
      boundary.
    created_at: "2026-07-31"
    last_accessed: "2026-07-31"
    access_count: 1
    confidence: 1.0
    source: "session-2026-07-31"
    tags: [stoi-lenient, silent-corruption, validate-at-your-boundary, bprutils-shared-with-license, t11]

