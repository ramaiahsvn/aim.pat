  - id: mem-005
    type: infrastructure
    content: >-
      2026-07-31 M11 IS IN THE CONSOLIDATED ENGINE — BprFace is in the proof gate and it cost NO
      OpenCV (bpr.cpp 8ad5be2). All six modalities now export the identical 17-symbol BprID_*
      ABI; 98 tests.
      THE INSIGHT THAT UNBLOCKED IT: "does BprIDEngine take OpenCV" only covers HALF of modality
      4A. T12 sFace(opencv) / M12 Yunet+sFace are the OpenCV pair. M11 sFace(pat-cosine) is
      BprUtils::computeCosineSimilarity_t11 — plain C++ in AprCommon, decode two float arrays
      and take the cosine. It went in at zero dependency cost. libBprFace.dylib links no OpenCV
      (otool -L clean, 706 KB). If a blocked task is blocked on a dependency decision, check
      whether EVERY part of it actually needs the dependency.
      A MATCHER WITH NO EXTRACTOR, on purpose. NOTHING IN bpr.cpp PRODUCES A T11 — pat's model
      does, on the capture device; the only T11 code here is the comparator. So bengine can
      verify a face against a gallery template but cannot create one. Mirror of BprFinger's T21
      (extractor, no matcher). orphan_templates() reports T11 as extractor-less and that should
      STAY visible.
      T11 WIRE FORMAT, fixed by the BprUtils decoder and not ours to change: ASCII, 8 chars per
      element, char 0 is the sign ('1' = negative), chars 1-7 the magnitude as 7 decimal digits.
      Magnitudes are INTEGERS — no fractional part — so the producer's scaling is baked in and
      both sides of a comparison must come from the same producer. Cosine ignores magnitude,
      which is what makes that survivable.
      Score mapping: the negative half of the cosine CLAMPS to 0 in normalized rather than being
      rescaled to [0,1] — rescaling would push every unrelated pair to ~0.5 and make the number
      harder to threshold against BprFace's own 0.363 — but raw keeps the sign. Verified through
      the C ABI: impostor normalized 0.0000, raw -6914.
      STILL OPEN: T12/M12, which is the OpenCV decision, now scoped to EXTRACTION only rather
      than to whether face is in the engine.
    created_at: "2026-07-31"
