      2026-07-31 T12/M12 ARE IN bengine — face ENROLMENT works through the unified ABI
      (bpr.cpp 151a751). Verified out of libBprIDEngine: T12 extract 528 bytes (16-byte header +
      128 float32), M12 self 1.0000, cross-image 0.0890. Five distinct faces: self 1.0000 every
      time, cross 0.0000-0.4619 (dataset unlabelled, so a spread not a genuine/impostor claim).
      THE SPLIT THE USER CHOSE, and it holds: BprSFaceRecog.cpp is the algorithm source and
      NOTHING ELSE in BprFace moved. BprFaceRecog loads all three ONNX models in its own
      constructor and owns the YuNet detector, so detect -> alignCrop -> feature -> match is one
      self-sufficient class. Detection, quality, video streaming, smoke and fight detection
      (~2680 lines) stay in the standalone library exposed exactly as before — none of them are
      template/match operations.
      COST IS QUARANTINED BEHIND ITS OWN OPTION. BENGINE_BUILD_FACE_T12, separate from
      BENGINE_BUILD_FACE, and BUILD_ALL does NOT enable it. T12 brings OpenCV plus ~44 MB of
      ONNX models (72 MB as the encrypted blob), none in git. Default consolidated build is
      unchanged: 98 tests, ZERO OpenCV, gate passes on all six. A lean engine still MATCHES faces
      via M11; FACE_T12 buys ENROLMENT. Models deploy beside whichever library holds the code.
      TEMPLATE FORMAT: binary blob, magic BFT1 — NOT interchangeable with the legacy
      Bpr_FaceRecog_T12_Template, which reads FileStorage YAML from a PATH. Deliberate; a
      converter is a converter.
      LICENSING NOT ENFORCED by the adapter. No bengine adapter is gated and BprID_Extract/Match
      carry no qiCode. If T12 must be gated inside the engine, the ABI needs to carry the code —
