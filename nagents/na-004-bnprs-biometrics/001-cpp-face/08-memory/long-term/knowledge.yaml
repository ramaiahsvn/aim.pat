  - id: mem-003
    type: process_note
    content: >-
      2026-07-30 BLOCKER OWNED BY THIS AGENT — B1, blocks the consolidated BprIDEngine from
      LINKING AT ALL. cli/BprIDEngine/BprFace/BprIdFace_dll_exports.cpp DEFINES
      BprLicGeneration() and BprLicVerification() at ~lines 144 and 149. The same two functions
      are ALSO defined in the BprFingerCless and BprFingerKnuckle glue files, so linking all
      three into one library is a duplicate-symbol error.
      FIX: delete both definitions here and call the shared BprID_LicVerification /
      BprID_LicGeneration from bprid_common (na-004/007). Note this agent's version is the WEAKEST
      of the three — a bare `return BprLicense::patIsValidLicense(std::string(qiCode, qiCodeSize), "")`
      with no size-0 guard and no try/catch, so a zero size or a throwing call is unhandled.
      Consolidating on the FingerCless/Knuckle body is a strict improvement here.
      GOOD NEWS: with -DNO_MFC this glue file COMPILES CLEAN on clang (verified). The <afx.h>
      that used to break it comes transitively from AprCommon/BprUtils/bpr_utils_main.h and is
      already guarded by #ifndef NO_MFC. The unified CMake sets NO_MFC globally.
      This agent is one of only THREE modalities that is complete today (src.cmake + cli glue +
      root OUTFILENAME branch) — the others are BprFinger and BprIris.
