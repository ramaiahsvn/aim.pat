  - id: mem-012
    type: technical_knowledge
    content: >-
      BPRFACE 2.24.116 PUBLISHED 2026-08-01 (commit 4276770) — LICENCE ENFORCEMENT, A BEHAVIOURAL
      BREAK. Through 2.24.115 every entry point (Bpr_FaceRecog_T12_Init, Bpr_FaceDetect_T12_Init,
      Bpr_SmokeDetect_T12_Init, Bpr_FightDetect_T12_Init) accepted a qiCode AND a length from the
      caller and then ignored both, validating a constant compiled into the binary against an empty
      product code — any code passed, including empty or garbage. It was an expiry date on the
      build, not per-customer licensing. The fix (8dd621a) landed 2026-07-31, TEN DAYS AFTER 115
      was published, and nobody bumped the version — so the 115 ARTIFACT in the registry and the
      115 SOURCE disagree in behaviour at the same version number. That is why this is 116 rather
      than a re-release. A host passing a placeholder qiCode SUCCEEDS on 115 and FAILS on 116.
      Verified functionally in the shipped binary, not just by reading the diff: garbage, empty and
      truncated codes rejected; the real licence accepted.
      Pat_is_valid_license_global() is deliberately unchanged — it takes no arguments, so there is
      no caller code to honour, and it answers "is this BINARY still in its validity window".
