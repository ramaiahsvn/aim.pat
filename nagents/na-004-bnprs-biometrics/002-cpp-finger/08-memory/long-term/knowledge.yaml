  - id: mem-002
    type: technical_knowledge
    content: >-
      2026-07-30 BprIDEngine UNIFIED LIBRARY ARCHITECTURE — this agent's build contract.
      Set by the user via na-004/007 cpp-bengine. Full spec:
      nagents/na-004-bnprs-biometrics/007-cpp-bengine/07-axon-terminals/deliverables/
      bpridengine-library-architecture.md. Contract header:
      bpr.cpp/src/BprIDEngine/bengine/capi/bprid_abi.h.
      WHAT THIS MEANS WHEN THE USER SAYS "BUILD" TO THIS AGENT: build ONLY this modality's
      library — `cmake --build . --target BprFinger` — never the whole engine, never another
      modality. The consolidated BprIDEngine is na-004/007's target, not this one's.
      THE RULE THAT MAKES IT WORK: BprFinger and BprIDEngine export the SAME generalized C ABI, and
      they do so by linking the SAME compiled objects — not by keeping two definitions in sync.
      So anything added here appears in BprIDEngine on its next build, automatically, with an
      identical signature. There is no second place to update, and no way for the two to drift.
      THE ABI IS GENERALIZED OVER THE TAXONOMY — do NOT add a new exported function for a new
      algorithm. Everything goes through:
        BprID_Extract(tid, sample, out, io_size)
        BprID_Match(mid, probe, plen, gallery, glen, &score, &raw)
      parameterised by TID/MID, where an id is (modality << 8) | variant using the taxonomy's own
      modality codes 4A..4F. THIS modality is 0x4B (2); its ids are T21 bFinger / T22 Inno Ansi-Iso / T23 Aware Iso, and M21 bFinger / M22 IdKit(Innovatrics) / M23 Aw.XM(Aware).
      A NEW ALGORITHM IS A NEW TID/MID VALUE, NEVER A NEW SYMBOL. That is what lets all six
      modality agents work independently without breaking each other's hosts, and why swapping
      BprFinger for BprIDEngine needs no host code change — only BprID_ListTemplates() returns more.
      Scores returned through BprID_Match must be SIMILARITY normalised to [0,1], higher =
      better, whatever the underlying algorithm's native scale or direction; put the native
      value in out_raw. Fusion across modalities depends on that normalisation.
      DEPENDENCY DIRECTION IS ONE-WAY: engine -> modality. This library must NEVER depend on
      bengine_core, or it stops being independently shippable.
      Legacy per-modality exports (Bpr_Face_Matching_T11, Start_Iso_Fp_Matching,
      bpr_<mod>_get_version, ...) survive only as a thin compatibility layer; they are not the
      contract. Note they already embedded TIDs in their names, so the taxonomy was implicitly
      there — the generalized ABI just makes it a parameter instead of part of the symbol.
    created_at: "2026-07-30"
    last_accessed: "2026-07-30"
    access_count: 1
    confidence: 1.0
    source: "session-2026-07-30 (user-directed unification)"
    tags: [bpridengine, unified-abi, generalized-signatures, tid-mid, build-contract, one-modality-only, na-004-007]

  - id: mem-003
    type: process_note
    content: >-
      2026-07-30 TWO BLOCKERS OWNED BY THIS AGENT.
      B3 (portability): cli/BprIDEngine/BprFinger/BprIdFinger_dll_exports.cpp line ~146 declares
      TemplateExtractnew with a BARE `extern "C" __declspec(dllexport)` and a Windows COM BSTR
      out-param, OUTSIDE the `#if defined(_WIN32)` guard the rest of the file uses correctly.
      This is the ONLY one of the five modality glue files that fails to compile on clang with
      -DNO_MFC (the other four pass). Fix: wrap it in the platform guard, or use
      BPRIDFINGER_EXPORT and a portable string out-param.
      B7 (content, and the more interesting one): BprFinger/Fjfx — FingerJetFX OSE — is
      referenced by NOTHING in the root build. bpr_finger_src.cmake lists only M3gl and Nnmq,
      which are MATCHERS. So the shipping BprFinger library has NO EXTRACTOR, while bengine's
      T21 adapter (already written, working, 88 minutiae on the reference print) is extraction
      with NO MATCHER. The two halves of the pipeline live in different places and neither knows
      about the other. Adding Fjfx to bpr_finger_src.cmake closes it and gives the existing
      library extraction.
      LICENSING GATE on B7: FingerJetFX OSE is LGPL. Linking it into a distributed binary
      carries obligations — clear with na-002-bnprs-core BEFORE shipping. Also note every FJFX
      entry point is marked DEPRECATED upstream ("we are deprecating this entire library").
      M21 is still unimplemented: FJFX extracts but does not match. Nnmq (FingerIsoMatching,
      xyt_struct minutiae) and M3gl (OpenAFIS) are the in-tree candidates.
    created_at: "2026-07-30"
    last_accessed: "2026-07-30"
    access_count: 1
    confidence: 1.0
    source: "session-2026-07-30"
    tags: [blocker, b3, b7, declspec-bstr, fjfx-not-in-any-library, lgpl, m21-missing, action-required]

  - id: mem-004
    type: infrastructure
    content: >-
      2026-07-30 B3 CLEARED (bpr.cpp 92609a9) — the BprFinger glue compiles off Windows for the
      first time, so all FIVE modality glue files now build with -DNO_MFC.
      WHAT WAS WRONG: TemplateExtractnew carried a bare `extern "C" __declspec(dllexport)` and a
      Windows COM BSTR out-param OUTSIDE the `#if defined(_WIN32)` guard the rest of that file
      uses correctly. It was the ONLY one of the five glue files failing on clang.
      FIX AND WHY IT IS A GUARD, NOT A PORT: BSTR and SysAllocStringByteLen come from the Windows
      OLE runtime and have no portable equivalent. TemplateExtractnew IS a COM automation entry
      point, so it is Windows-only by nature; faking a cross-platform BSTR would be worse than
      omitting it. The whole function is now inside the platform guard and uses
      BPRIDFINGER_EXPORT like its neighbours. Non-Windows callers use the generalized ABI instead:
      BprID_Extract(BPRID_T21, ...) returns the same minutiae as an ISO 19794-2 record.
      STILL OPEN FOR THIS AGENT: B7 — Fjfx is referenced by NOTHING in the root build.
      bpr_finger_src.cmake lists only M3gl and Nnmq, which are MATCHERS, so the shipping
      BprFinger has no extractor while bengine's T21 is extraction with no matcher. Adding Fjfx to
      that fragment closes it, gated on the LGPL decision from na-002-bnprs-core. M21 also remains
      unimplemented (FJFX extracts but does not match; Nnmq and M3gl are the candidates).
      THINGS I NOTICED IN TemplateExtractnew BUT DID NOT CHANGE — behaviour-affecting, so they are
      this agent's call: (a) the `rawBuffer` parameter is a FILENAME despite the name, and
      `rawBufferLen` is unused; (b) neither `stat()` nor `fopen()` results are checked, so a
      missing file is a null deref; (c) the row-flip loop starts at `k = h` and reads
      `newBuffer[k*w + l + 1078]`, which overruns the buffer by up to one row on the first
      iteration — it looks like it should be `k = h-1`; (d) `templateData` and the `temp` buffer
      from Encode() are never freed; (e) it writes a debug file "1.tmpl" into the CWD
      unconditionally.
    created_at: "2026-07-30"
    last_accessed: "2026-07-30"
    access_count: 1
    confidence: 1.0
    source: "session-2026-07-30"
    tags: [b3-cleared, com-bstr-windows-only, all-five-glue-compile, b7-still-open, templateextractnew-bugs-flagged, 92609a9]

