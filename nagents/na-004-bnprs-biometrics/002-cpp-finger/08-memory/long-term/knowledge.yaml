    tags: [blocker, b3, b7, declspec-bstr, fjfx-not-in-any-library, lgpl, m21-missing, action-required]

  - id: mem-004
    type: infrastructure
    content: >-
      2026-07-30 B3 CLEARED (bpr.cpp 92609a9) — the BprFinger glue compiles off Windows for the
      first time, so all FIVE modality glue files now build with -DNO_MFC.
      WHAT WAS WRONG: TemplateExtractnew carried a bare `extern "C" __declspec(dllexport)` and a
      Windows COM BSTR out-param OUTSIDE the `#if defined(_WIN32)` guard the rest of that file
      uses correctly. It was the ONLY one of the five glue files failing on clang.
      FIX AND WHY IT IS A GUARD, NOT A PORT: BSTR and SysAllocStringByteLen come from the Windows
      OLE runtime and have no portable equivalent. TemplateExtractnew IS a COM automation entry
      point, so it is Windows-only by nature; faking a cross-platform BSTR would be worse than
      omitting it. The whole function is now inside the platform guard and uses
      BPRIDFINGER_EXPORT like its neighbours. Non-Windows callers use the generalized ABI instead:
      BprID_Extract(BPRID_T21, ...) returns the same minutiae as an ISO 19794-2 record.
      STILL OPEN FOR THIS AGENT: B7 — Fjfx is referenced by NOTHING in the root build.
      bpr_finger_src.cmake lists only M3gl and Nnmq, which are MATCHERS, so the shipping
      BprFinger has no extractor while bengine's T21 is extraction with no matcher. Adding Fjfx to
      that fragment closes it, gated on the LGPL decision from na-002-bnprs-core. M21 also remains
      unimplemented (FJFX extracts but does not match; Nnmq and M3gl are the candidates).
      THINGS I NOTICED IN TemplateExtractnew BUT DID NOT CHANGE — behaviour-affecting, so they are
      this agent's call: (a) the `rawBuffer` parameter is a FILENAME despite the name, and
      `rawBufferLen` is unused; (b) neither `stat()` nor `fopen()` results are checked, so a
      missing file is a null deref; (c) the row-flip loop starts at `k = h` and reads
      `newBuffer[k*w + l + 1078]`, which overruns the buffer by up to one row on the first
      iteration — it looks like it should be `k = h-1`; (d) `templateData` and the `temp` buffer
      from Encode() are never freed; (e) it writes a debug file "1.tmpl" into the CWD
      unconditionally.
    created_at: "2026-07-30"
    last_accessed: "2026-07-30"
    access_count: 1
    confidence: 1.0
    source: "session-2026-07-30"
    tags: [b3-cleared, com-bstr-windows-only, all-five-glue-compile, b7-still-open, templateextractnew-bugs-flagged, 92609a9]

  - id: mem-005
    type: incident_learning
    content: >-
      2026-07-30 TemplateExtractnew — overread FIXED, and the function turns out to have NEVER
      COMPILED (bpr.cpp bb9ba2e).
      THE OVERREAD: the row-flip loop started at `k = h`, so its first iteration read
      newBuffer[h*w + l + 1078] — one whole row (w bytes) PAST the end of the pixel data — while
      source row 0 was never read at all. Proven with a standalone harness before editing: for
      w=8,h=5 the old form touched [1086..1125] against a valid range of [1078..1117], and copied
      source rows 1..5 instead of 0..4. Now `k = h-1`. Note this CHANGES OUTPUT: extraction
      previously ran on an image whose first row was heap garbage and whose rows were all off by
      one. Also hardened: null/dimension checks, stat() and fopen() results checked (both were
      unchecked — a missing file left st_size uninitialised and fread ran on a NULL FILE*), file
      size verified to hold 1078 + w*h, malloc checked, both buffers freed on the error path that
      leaked them, and the 1.tmpl debug dump made opt-in via BPRFINGER_DUMP_TEMPLATE.
      THE BIGGER FINDING — the function CANNOT COMPILE and never could. It calls
      `FeatureExtract()`, which EXISTS NOWHERE in the repository; the only other trace is a
      commented-out `//Pat_FeatureExtract` in Nnmq/finger_iso_template.cpp. The one
      signature-compatible candidate, FingerIsoTemplate::bpr_iso_feature_extraction, is itself a
      STUB — its entire body is that comment plus `return 0`, writing nothing. Wiring the call to
      it would produce a function that reports SUCCESS with an EMPTY template, which is worse than
      not compiling. It also calls a bare `Encode()` that is really the static BprUtils::Encode
      and does not resolve unqualified. So it is now gated behind
      BPRFINGER_HAVE_VENDOR_FEATUREEXTRACT rather than deleted or faked — it presumably needed a
      vendor SDK never committed here (the 1078-byte BMP palette header, id=8, ppmm=197 all point
      at a specific fingerprint SDK). All the repair work is in place for whoever revives it.
      IMPLICATION WORTH CHECKING: if this file is in the BprFinger Windows DLL build, that build
      has been broken. Either nobody has built BprFinger for Windows recently, or the vendor SDK
      header is present in someone's environment and not in git.
      REGRESSION I CAUSED AND REVERTED: in 92609a9 I swapped the hard __declspec(dllexport) for
      BPRIDFINGER_EXPORT "for consistency". That macro resolves to dllIMPORT unless
      MY_LIBRARY_EXPORTS is defined, and the root CMakeLists defines it ONLY for BprPinblock —
      never BprFinger. The swap turned the definition into a dllimport declaration. mingw caught
      it. The hard dllexport was deliberate and is back, with a comment saying not to touch it.
      TWO LATENT MFC DEPENDENCIES now explicit: <sys/stat.h> for struct stat, and <windows.h> +
      <oleauto.h> for BSTR/SysAllocStringByteLen. Both had been arriving via <afx.h>, so this file
      silently required MFC.
      LESSON: cross-compile before believing a Windows-only change is correct. mingw
      (x86_64-w64-mingw32-g++ / i686-w64-mingw32-g++, both on this Mac) caught the dllimport
      regression, both missing headers and the nonexistent FeatureExtract — none of which a macOS
      syntax check could see, because the guard excludes the whole function there.
    created_at: "2026-07-30"
    last_accessed: "2026-07-30"
    access_count: 1
    confidence: 1.0
    source: "session-2026-07-30"
    tags: [overread-fixed, templateextractnew-never-compiled, featureextract-missing, stub-candidate, vendor-sdk-gate, dllimport-regression, mfc-latent-deps, cross-compile-with-mingw, lesson, bb9ba2e]

  - id: mem-006
    type: incident_learning
    content: >-
      2026-07-30 CONFIRMED BY BUILDING IT — the BprFinger WINDOWS BUILD WAS BROKEN, and had been
      since 2025-02-05. This is measured, not inferred: the pre-change code (commit aafe7fc) was
      checked out into an isolated git worktree and built with the repo's own toolchain exactly
      as documented —
        cmake ../../.. -DCMAKE_TOOLCHAIN_FILE=toolchains/toolchain_windows_64.cmake
                       -DOUTFILENAME=BprFinger -DPROJECTTYPE=DLL_Windows
      It FAILED with four errors in cli/BprIDEngine/BprFinger/BprIdFinger_dll_exports.cpp:
      'struct stat' incomplete; 'FeatureExtract' not declared; 'Encode' not declared;
      'SysAllocStringByteLen' not declared — plus a warning that bpr_finger_get_version was
      "redeclared without dllimport attribute".
      IT IS NOT A MINGW ARTEFACT — two checks rule that out. (1) The root CMakeLists defines
      -DNO_MFC at line 51, so <afx.h> is skipped in EVERY configuration on EVERY compiler; MFC
      never supplies struct stat or the OLE declarations, MSVC included. (2) Even when MFC's
      contribution was force-supplied (-include sys/stat.h -include windows.h -include
      oleauto.h), 'FeatureExtract' and 'Encode' STILL fail. Those two are compiler-independent,
      so no toolchain can build this file.
      SINCE WHEN: `git log -S` places both TemplateExtractnew and its FeatureExtract call in
      commit 9179a25, 2025-02-05, "64-bit Linux .so file issue resolved" — so it arrived broken
      in a commit about the LINUX build and Windows was evidently never re-tested. ~6 months.
      FIXED — the same command on the current tree now produces
      bin/libBprFinger.dll (19.6 MB), exporting Start_Iso_Fp_Matching and bpr_finger_get_version.
      TemplateExtractnew is correctly ABSENT, being gated behind
      BPRFINGER_HAVE_VENDOR_FEATUREEXTRACT.
      SEPARATE ISSUE SPOTTED IN THAT DLL: it also exports MANGLED C++ symbols
      (BprLicense::patIsValidLicense, patGlobalLicGenerator, patGlobalLicVerification) because
      toolchains/toolchain_windows_64.cmake passes -Wl,--export-all-symbols. Same class of
      visibility leak I hit twice in bengine, but in the ROOT build and affecting every product
      it builds — worth tightening separately, not fixed here.
      METHOD WORTH REUSING: a git worktree at the old commit gives a clean before/after build
      comparison without disturbing the working tree; `git worktree remove --force` afterwards.
    created_at: "2026-07-30"
    last_accessed: "2026-07-30"
