  - id: mem-009
    type: incident_learning
    content: >-
      2026-07-31 BINARISATION IS THE FLOOR, AND IT FAILS SILENTLY WITH THE RIGHT COUNT.
      If skin texture is dark enough to cross the Otsu threshold it binarises as BACKGROUND, and
      a crease spanning the full width of a finger cuts that finger in two — the severed tip
      becomes a separate component and is discarded. Measured on the synthetic hand: darkest
      on-hand pixel 119 against background 28 -> Otsu 31, all four fingers correct. Darkest 71 ->
      Otsu jumps to 112, and the geometry collapses (finger lengths 135/134/147/193 where the
      truth is 242/262/241/198).
      THE DANGEROUS PART: the finger COUNT still came to four. Four confident, wrong bands. What
      exposed it was a shape that is anatomically impossible — 199 px wide by 147 px long — so
      there is now a `width > 0.9 * length` guard (a finger is always longer than it is wide;
      measured ratios 0.36-0.46). With it the bad shapes are refused and the count drops to 3,
      which is at least VISIBLE. There is still no positive detection of the condition.
      HOLE FILLING DOES NOT RESCUE THIS and I checked rather than assumed: a full-width cut is
      not a hole. Filling (flood the background in from the border, promote what it cannot reach)
      is still worth having for shadows and specular highlights, because holes move the CENTROID
      and the centroid is the origin of the radius profile every extremum is found from — but it
      changed nothing in the dark-crease case.
      MY OWN TEST SYNTHETIC CAUSED THIS FIRST. I gave the creases amplitude 70 and got three
      "fingers" with nonsense geometry, and the first instinct was that the digit detector was
      broken. It was not — the image was. Check what binarisation produced BEFORE tuning anything
      downstream of it.
    created_at: "2026-07-31"
    last_accessed: "2026-07-31"
    access_count: 1
    confidence: 1.0
    source: "session-2026-07-31"
    tags: [binarisation-floor, silent-failure-right-count, width-over-length-guard, hole-filling-limits, check-the-image-first]

