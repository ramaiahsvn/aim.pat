  - id: mem-008
    type: infrastructure
    content: >-
      2026-07-31 KNUCKLE ROI SEGMENTATION EXISTS — T33 works on a hand capture now, not only on a
      pre-cropped database (bpr.cpp 39a0443, Segment/knuckle_segment.{h,cpp}).
      THE CAPTURE IS A WHOLE HAND, NOT A SINGLE FINGER. This is the thing to know before touching
      this module. The FKP literature (PolyU) images ONE finger over a triangular support and
      finds the knuckle by convex direction coding along it — that is NOT our rig. Our own
      reference, KnuckleSegment{L4,R4,T2}.cpp, takes a four-finger hand image, builds a
      `struct hand` of four fingers plus valleys v1/v2/v3, and cuts a band out of each finger.
      Segment/ follows the reference, not the literature.
      GEOMETRY COPIED FROM THE REFERENCE, not invented (KnuckleSegmentL4.cpp:282-295): base =
      midpoint of the finger's flanking valleys; MAJOR knuckle (PIP, the one FKP recognition
      uses) at length/3 from the base; DISTAL (DIP) at 2*length/3; major band 125 along x 100
      across at a reference valley span of 271 (-> 0.461 x 0.369), distal 80x80 (-> 0.295 sq).
      Sizing to the valley span is what makes it invariant to camera distance.
      OUTPUT x RUNS ALONG THE FINGER. Not arbitrary — CompCode's knuckle shift search is
      asymmetric (+/-6 along, +/-3 across) because creases run across the finger. A transposed
      band searches the wrong axis.
      MEASURED (synthetic four-finger hand, similarity between two captures of ONE hand vs the
      same images cropped at a fixed position): rot 10/20/30 deg = 0.875/0.877/0.878 segmented
      against 0.502/0.506/0.518 cropped; shifted 100 px = 0.885 vs 0.529; flat over 0.75x-1.25x
      scale. Genuine 0.872, impostor 0.644 — a NARROWER margin than palmprint's, because the two
      synthetic hands share finger geometry and differ only in crease spacing. Different FINGER
      of the same hand = 0.594, which is the check that makes the finger index mean anything.
      ADAPTER: `make_knuckle_compcode_extractor(KnuckleInput::FullHand, fingerIndex, 160, 128)`
      vs the default Roi. Both emit T33. FullHand needs a FINGER INDEX (a hand gives four
      knuckles, T33 is one). Indices are consistent across captures of one hand but MIRROR
      between left and right hands.
      NOT MEASURED ON REAL KNUCKLES — geometric invariance on a synthetic hand, not recognition
      accuracy. Owed to na-004/010.
    created_at: "2026-07-31"
