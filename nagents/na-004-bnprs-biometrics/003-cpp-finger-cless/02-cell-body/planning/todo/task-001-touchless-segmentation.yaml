# Task — touchless finger detection / ROI segmentation
# Raised 2026-07-31, deferred by the user before work started.
# OWNER: na-004/003 cpp-finger-cless (this agent).
#
# CONTEXT: palmprint (na-004/005) and knuckle (na-004/004) both got ROI segmentation on
# 2026-07-30/31. Fingercless is the LAST modality that still assumes it is handed a cropped,
# roughly axis-aligned fingertip. Work was about to start and was deferred.

task:
  id: "task-001"
  subject: "Locate the fingerprint ROI in a touchless camera frame"
  description: >-
    Touchless/touchless_preprocess.{h,cpp} converts a cropped fingertip into a
    contact-equivalent ridge image and hands it to FingerJetFX, so T31 emits a standard
    ISO 19794-2 record. That half works and is in the proof gate.

    What is missing is everything BEFORE it: finding the finger in a full camera frame and
    cropping it. Until that exists T31 needs a caller that has already done the hardest part.

    DO NOT ASSUME THE PALMPRINT/KNUCKLE APPROACH TRANSFERS — this is now MEASURED, not a
    caution. Common/HandGeometry (silhouette -> boundary trace -> radial distance profile ->
    fingers and valleys) works only because a hand silhouette has fingers protruding from a
    palm. Without the palm it returns real fingertips ALTERNATING WITH WEB POINTS. Full numbers
    in findings_2026_07_31 below; whether it applies therefore depends entirely on how much of
    the hand is in frame, which is the one open question.

    The reference's own answer to this stage is CaptureNet, a TFLite segmentation model
    (run_capture_net_on_mat, line 1302) producing a mask plus a marker output. Three problems
    with adopting it, all pre-existing and recorded in BprFingerCless/README.md:
      1. The MODEL IS NOT IN THE REPO. The only committed asset is nist_plain_tir-ink.yaml,
         which is the NFIQ2 quality model, not a fingerprint network.
      2. TFLite would be a new runtime dependency for the consolidated BprIDEngine, which is
         dependency-free by design for exactly this reason. That is an architectural decision
         for na-004/007 and na-002, not one to make inside this module.
      3. fp_bridge.cpp is Android/JNI-coupled and written against cv::Mat throughout, so it
         also drags in OpenCV.

    So the likely shape of the work is a dependency-free geometric segmenter informed by the
    reference, the same way BprFingerKnuckle/Segment was written from KnuckleSegmentL4.cpp
    rather than ported from it.

  status: pending
  priority: medium
  created_at: "2026-07-31"
  assigned_to: null
  blocked_by: []
  blocks: []
  estimated_steps: 10
  tags: [fingercless, t31, segmentation, touchless, capturenet, tflite-decision, last-modality]

  first_step: >-
    ANSWERED 2026-07-31 — do not repeat this. See findings_2026_07_31 below. The remaining
    first step is a QUESTION FOR THE USER, not an investigation: how much of the hand is in
    the camera frame? The code cannot answer it and the answer decides the method.

  findings_2026_07_31: >-
    Investigated, then deferred. Three things are now settled and one is not.

    1. THE REFERENCE HAS NO DETECTION CODE WE CAN USE. extract_rects_native (line 522) is NOT
       finger detection despite the name — it iterates a vendor FingerVector and marshals it
       into Android Rects for the UI overlay. The real chain is:
         camera frame -> resize to 128x128 -> run_capture_net_on_mat (TFLite CaptureNet,
         line 1302) -> mask + marker -> Core.findFingers(in, mask, marker, out, 0.9f)
       findFingers is the VENDOR's, inside libttv_fp_core.so (arm64-v8a only, no source), and
       the CaptureNet model is not in the repo. So BOTH detection stages are unavailable. This
       has to be written, not ported.

    2. IT IS A MULTI-FINGER CAPTURE, one print per finger. Confirmed three ways: a FingerVector
       is iterated by count, calc_median_finger_size (line 629) takes a MEDIAN over the vector,
       and crop_fingerprint_like_sdk (line 742) cuts a 300x512 image PER FINGER and mirrors it
       (cv::flip axis 1) because a camera sees the finger reversed relative to a contact scan.
       Preview size is 144x256 or 256x144 — a phone camera in portrait or landscape.

    3. MEASURED: Common/HandGeometry DOES NOT WORK WITHOUT A PALM. I built a synthetic with the
       same four fingers at three framings and ran find_silhouette + find_digits on each:

         full hand, palm 145 deep    4 tips, 3 valleys, all correct
         palm only 40 deep           4 "tips" but one is a WEB POINT between fingers, and a
                                     real finger was discarded by the thumb rule
         fingers only, web 12        6 "tips" — real fingertips ALTERNATING with web points

       The reason is structural, not a tuning problem: with no palm the centroid rises into the
       finger region, so the webs between fingers become radial maxima and pass the protrusion
       test. The radial-distance-from-centroid model REQUIRES the fingers to protrude from a
       bulk body. My earlier claim that the shared layer would not apply here was right, but
       for the wrong reason — it is not that the capture is a single fingertip, it is that
       there may be no palm.

    4. UNRESOLVED, AND IT DECIDES THE METHOD: how much of the hand is actually in frame. No
       sample images exist anywhere in bpr.cpp or TRP1001_SbioidS. The app's ic_overlay.PNG on
       branch enrollmentFlowImpl is a plain rounded corner mask, not a hand guide, and there
       are no capture-instruction strings. ASK THE USER. The three cases:
         palm in frame     -> reuse Common/HandGeometry, short job (like knuckle)
         fingers only      -> new method; do NOT use the radial profile
         one finger a shot -> find_digits needs >=2 protrusions and fails; single-blob axis

    WHAT THE ROI SHOULD BE, once detection exists: the distal pad, running from the fingertip
    down the finger. The reference's 300x512 crop is across:along = 1:1.71. Output should have
    the finger pointing along +y, and it feeds the EXISTING T31 path — Touchless/
    touchless_preprocess then FingerJetFX — so no new template format is involved.

