  - id: mem-002
    type: technical_knowledge
    content: >-
      2026-07-30 BprIDEngine UNIFIED LIBRARY ARCHITECTURE — this agent's build contract.
      Set by the user via na-004/007 cpp-bengine. Full spec:
      nagents/na-004-bnprs-biometrics/007-cpp-bengine/07-axon-terminals/deliverables/
      bpridengine-library-architecture.md. Contract header:
      bpr.cpp/src/BprIDEngine/bengine/capi/bprid_abi.h.
      WHAT THIS MEANS WHEN THE USER SAYS "BUILD" TO THIS AGENT: build ONLY this modality's
      library — `cmake --build . --target BprIris` — never the whole engine, never another
      modality. The consolidated BprIDEngine is na-004/007's target, not this one's.
      THE RULE THAT MAKES IT WORK: BprIris and BprIDEngine export the SAME generalized C ABI, and
      they do so by linking the SAME compiled objects — not by keeping two definitions in sync.
      So anything added here appears in BprIDEngine on its next build, automatically, with an
      identical signature. There is no second place to update, and no way for the two to drift.
      THE ABI IS GENERALIZED OVER THE TAXONOMY — do NOT add a new exported function for a new
      algorithm. Everything goes through:
        BprID_Extract(tid, sample, out, io_size)
        BprID_Match(mid, probe, plen, gallery, glen, &score, &raw)
      parameterised by TID/MID, where an id is (modality << 8) | variant using the taxonomy's own
      modality codes 4A..4F. THIS modality is 0x4E (5); its ids are T51 mIris(Masek) / T52 vIris(Vasir), and M51 bIris / M52 Vasir.
      A NEW ALGORITHM IS A NEW TID/MID VALUE, NEVER A NEW SYMBOL. That is what lets all six
      modality agents work independently without breaking each other's hosts, and why swapping
      BprIris for BprIDEngine needs no host code change — only BprID_ListTemplates() returns more.
      Scores returned through BprID_Match must be SIMILARITY normalised to [0,1], higher =
      better, whatever the underlying algorithm's native scale or direction; put the native
      value in out_raw. Fusion across modalities depends on that normalisation.
      DEPENDENCY DIRECTION IS ONE-WAY: engine -> modality. This library must NEVER depend on
      bengine_core, or it stops being independently shippable.
      Legacy per-modality exports (Bpr_Face_Matching_T11, Start_Iso_Fp_Matching,
      bpr_<mod>_get_version, ...) survive only as a thin compatibility layer; they are not the
      contract. Note they already embedded TIDs in their names, so the taxonomy was implicitly
      there — the generalized ABI just makes it a parameter instead of part of the symbol.
    created_at: "2026-07-30"
    last_accessed: "2026-07-30"
    access_count: 1
    confidence: 1.0
    source: "session-2026-07-30 (user-directed unification)"
    tags: [bpridengine, unified-abi, generalized-signatures, tid-mid, build-contract, one-modality-only, na-004-007]

  - id: mem-003
    type: process_note
    content: >-
      2026-07-30 THREE ISSUES OWNED BY THIS AGENT, found while na-004/007 wrote the T51/M51
      adapter over MasekAlgo.
      B6 (blocks the iris adapter on clang, ONE LINE): MasekAlgo/imread.cpp:557 is
      `if (m_image >0)` — an ordered comparison between a pointer and 0. Clang rejects it as an
      ERROR with NO suppression flag, and createiristemplate() needs imread(). It was verified to
      be the ONLY error in an otherwise clean build: patching it locally made the whole adapter
      compile, link and register T51/M51, and the patch was then reverted because this file is
      yours. Fix: `!= NULL`. MSVC accepts the original, so Windows builds today.
      B2 (blocks consolidated linking): cli/BprIDEngine/BprIris/BprIdIris_dll_exports.cpp defines
      `int main()` at ~line 45. A library must not define main; it collides the moment this glue
      is linked into BprIDEngine alongside the other modalities.
      THE PUBLIC WRAPPERS ARE UNUSABLE — the reason the adapter bypasses them and calls Masek::
      directly. IrisMasekTemplate::bpr_iris_feature_extraction_masek computes a template and then
      DISCARDS it (the pointers are locals, never returned, and leaked).
      IrisMasekMatching::bpr_iris_masek_matching is a STUB: it printf()s and returns 0 without
      ever writing *score. Both are worth fixing so the module's own API is usable.
      SIDE EFFECT worth knowing: Masek::createiristemplate WRITES FIVE FILES beside the input
      image (-houghpara.mat, -noise.bmp, -segmented.bmp, -polar.bmp, -polarnoise.bmp) and
      re-reads the .mat as a segmentation cache, so the image directory must be writable and a
      stale cache is silently reused.
      T52/M52 (vIris/Vasir) are NOT implemented — bpr_iris_feature_extraction_masek returns -1
      for algType==1. Root BprIris picks Masek OR Vasir by PROJECTTYPE, which the generalized ABI
      replaces: both become TIDs in one library.
    created_at: "2026-07-30"
    last_accessed: "2026-07-30"
    access_count: 1
    confidence: 1.0
    source: "session-2026-07-30"
    tags: [blocker, b2, b6, imread-pointer-compare, main-in-library, wrappers-broken, disk-side-effects, t52-missing, action-required]

  - id: mem-004
    type: infrastructure
    content: >-
      2026-07-30 B6 AND B2 CLEARED — BprIris now builds off MSVC and is part of the unified
      library family (bpr.cpp c767a10).
      B6: MasekAlgo/imread.cpp:557 was `if (m_image >0)` — an ordered comparison between a pointer
      and an int. Clang rejects it as an ERROR with no suppression flag, and createiristemplate()
      needs imread(), so the ENTIRE module was unbuildable on anything but MSVC. It was verified
      to be the only error in an otherwise clean build. Now `if (m_image != NULL)`; behaviour is
      unchanged wherever the original compiled.
      B2: cli/BprIDEngine/BprIris/BprIdIris_dll_exports.cpp defined `int main()` — a leftover
      harness printing "Iris matcher test app" and extracting from a hardcoded
      C:/BPR/DAta/img1.bmp. A library must not define main; it collides as soon as this glue is
      linked into BprIDEngine beside other modalities. Removed. A manual driver belongs in its own
      executable target.
      RESULT: libBprIris.dylib builds and exports the same 17-symbol BprID_* ABI as
      libBprIDEngine, registering T51 mIris. The proof gate
      (bengine/tests/proof_gate.sh <build-dir>) now passes across TWO modalities — BprFinger T21,
      BprIris T51, and BprIDEngine carrying both — which is the first run that demonstrates the
      architecture rather than comparing one library to itself. Build with
      `cmake -S . -B build-all -DBENGINE_BUILD_ALL=ON` from bengine/.
      STILL OPEN FOR THIS AGENT (unchanged, see mem-003): the public wrappers remain unusable —
      IrisMasekTemplate::bpr_iris_feature_extraction_masek computes a template then DISCARDS it
      (locals, never returned, leaked) and IrisMasekMatching::bpr_iris_masek_matching is a stub
      that printf()s and returns 0 without writing *score. The bengine T51/M51 adapter bypasses
      both and calls Masek:: directly. T52/M52 (vIris/Vasir) are still unimplemented — algType==1
      returns -1. And createiristemplate still writes five files beside the input image.
    created_at: "2026-07-30"
    last_accessed: "2026-07-30"
    access_count: 1
    confidence: 1.0
    source: "session-2026-07-30"
    tags: [b6-cleared, b2-cleared, imread-fixed, main-removed, builds-on-clang, proof-gate-two-modalities, c767a10]

