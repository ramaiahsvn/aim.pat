  - id: mem-004
    type: project_context
    content: >-
      2026-07-30 B5 CLEARED — BprPalmprint EXISTS NOW (bpr.cpp 4a6cb30). The directory held only
      a readme.txt saying "to be added"; BPR_PALMPRINT_VERSION 2.24.400 was already reserved in
      bpr_versions.h, so the slot was expected rather than forgotten.
      WHAT WAS BUILT: Competitive Coding (Kong & Zhang, ICPR 2004) at
      src/BprIDEngine/BprPalmprint/CompCode/palmprint_compcode.{h,cpp}, plus
      bpr_palmprint_src.cmake, the bengine T41/M41 adapter, its registrar and tests. Six real
      Gabor filters; each pixel takes the orientation index with the most NEGATIVE response
      (palm lines are dark on a light palm); matching is the circular angular distance between
      code maps with a translation search.
      WHY COMPCODE AND NOT A DEEP MODEL: it is self-contained — no OpenCV, no vendor SDK, no
      model blobs — so it costs the consolidated BprIDEngine nothing in dependencies and can be
      linked into both BprPalmprint.so and BprIDEngine.so. Same reasoning as BprIris carrying
      Masek. A deep model needs a runtime and weights and cannot be linked that way.
      TWO THINGS NOT TO BREAK: (1) the Gabor kernels are DC-REMOVED — without that the filter
      responds to absolute brightness, so a shadow shifts every response equally and can flip
      the winning orientation; zero DC is what makes CompCode illumination-robust. (2) Pixels
      within the kernel radius of the border are MASKED rather than computed from fabricated
      edge data, and the matcher scores only pixels valid in BOTH masks — no common pixel
      returns kErrNoOverlap, never a 0.0 distance that would read as a perfect match.
      MEASURED, NOT ASSUMED (synthetic palms: oriented dark line bundles + illumination ramp +
      noise): identical 0.0000; same palm different noise 0.2224; same palm 3px shift 0.3654
      falling to 0.2231 with shift search; DIFFERENT palm 0.5057 (~chance). Genuine ~0.22 vs
      impostor ~0.51 is clean separation. Those numbers are now ASSERTIONS in
      bengine/tests/palmprint_test.cpp, so degrading the filter bank fails the suite instead of
      quietly losing accuracy.
      TUNING KNOBS if accuracy is ever benchmarked (na-004/010 algo-certify): kRadius=10,
      kSigma=4.0, kOmega=0.10. Kong & Zhang use 35x35 / 5.6179 / 0.0916 on 128x128; the smaller
      kernel here is ~2.8x cheaper and masks 16% of a 128x128 ROI instead of 47%.
      NOT DONE — READ BEFORE CLAIMING THIS MODALITY IS FINISHED: (a) ROI SEGMENTATION is not
      implemented. The module assumes it is handed an aligned grayscale ROI (the region between
      the finger valleys, ~128x128); feeding a whole hand photo produces a code map dominated by
      background. That is the next real piece of work here. (b) No cli/ export glue and no root
      OUTFILENAME branch, so there is still no legacy-style BprPalmprint DLL from the monolithic
      build — only the generalized-ABI library from bengine. (c) T41/M41 are the only ids; the
      taxonomy defines no others for this modality.
      DO NOT use M_PI in this module — it is POSIX and absent on MSVC/mingw without
      _USE_MATH_DEFINES; an explicit kPi constant is used instead. Verified warning-clean under
      -Wall -Wextra -Wpedantic on macOS clang, mingw x86_64 and mingw i686.
