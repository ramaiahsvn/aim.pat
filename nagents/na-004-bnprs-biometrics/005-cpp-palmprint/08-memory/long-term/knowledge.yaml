  - id: mem-006
    type: incident_learning
    content: >-
      2026-07-30 A CONTOUR TRACE THAT SILENTLY RUNS TWICE LOOKS LIKE AN ALGORITHM BUG, NOT A BUG.
      My Moore-neighbour boundary trace stated Jacob's stopping criterion against the FIRST
      RETURN to the start pixel instead of the walk's initial state, so it traced the whole
      boundary twice: N=2572 for a 1286-pixel contour, and every fingertip and valley appeared at
      both i and i+N/2. It never errored. It presented as "the valley detector finds 10 valleys
      when there are 3", and I nearly went and retuned the extremum thresholds — which would have
      papered over it and left the real defect in place.
      What found it was DUMPING THE INTERMEDIATE STATE rather than the outcome: printing the peak
      list with image coordinates made the duplication obvious in one look (peak i=209 and i=1495
      were the same pixel). Do that before tuning any parameter.
      Second wrong version, worth naming too: stopping when the backtrack matched its INITIAL
      value never fired at all and ran to the iteration guard — that initial value is synthetic
      (we assume we arrived from the west) and the walk enters the start pixel from wherever the
      boundary actually comes from. The working criterion is "back at the start pixel AND about
      to repeat the first move".
      Both failure modes are quiet. There is now a regression test (DoesNotTraceTheContourTwice)
      that asserts the valley count, because that is the observable the duplication changed.
    created_at: "2026-07-30"
    last_accessed: "2026-07-30"
    access_count: 1
    confidence: 1.0
    source: "session-2026-07-30"
    tags: [moore-tracing, jacobs-criterion, silent-double-trace, dump-state-before-tuning, regression-test-added]

