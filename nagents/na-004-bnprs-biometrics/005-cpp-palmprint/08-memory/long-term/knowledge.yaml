  - id: mem-005
    type: infrastructure
    content: >-
      2026-07-30 ROI SEGMENTATION EXISTS — BprPalmprint works on a hand image now, not only on a
      pre-cropped database (bpr.cpp 02d0a0d, Segment/palmprint_segment.{h,cpp}).
      Pipeline: Otsu -> largest connected component -> Moore-neighbour boundary trace -> radial
      distance profile from the palm centroid -> digits and valleys -> frame through the
      index/middle and ring/little valleys -> square ROI resampled to 128x128. Dependency-free.
      MEASURED (synthetic hand, CompCode similarity between two captures of ONE hand, vs the same
      images centre-cropped): rotated 10/20/30 deg = 0.900 / 0.900 / 0.913 segmented against
      0.511 / 0.509 / 0.503 cropped; shifted 40 px = 0.924 vs 0.635. Flat across +/-40 deg and
      0.7x-1.3x scale. Two DIFFERENT hands both segmented = 0.514, so invariance did not come
      from making everything match.
      THE HARD PART IS TELLING A DIGIT FROM A CORNER OF THE PALM, and distance from the centroid
      CANNOT DO IT — on this hand the two lower palm corners sit 115 and 120 px out against a
      120 px median fingertip, so every length-based test admits them and the frame gets built on
      a corner. My first version did exactly that. What works is SHAPE: a finger is a long thin
      protrusion, so the boundary arc over it is several times the chord across its base.
      Measured arc/chord — middle 7.9, ring 7.1, index 4.6, little 4.1 | thumb 3.0, palm corners
      1.4. `minProtrusion` default 3.0, measured working window 1.6-4.0 (1.2 -> kErrRoiOffHand,
      4.4 -> little finger lost, 4.8 -> kErrNoValleys).
      The THUMB is dropped on purpose: it rotates about its own joint independently of the palm,
      so a frame anchored to it is not repeatable. Identified by anatomy, not pose — always at an
      END of the digit run, never between two fingers, and the nearer end to the centroid.
      ADAPTER: `make_palmprint_compcode_extractor(PalmInput::FullHand, 128)` vs the default
      `PalmInput::Roi`. BOTH EMIT T41 — segmentation is a front end, not a template format. No
      auto-detect, deliberately: falling back to whole-image encoding on a failed segmentation
      would produce a silently wrong template from background, worse than an error.
      NOT MEASURED ON REAL PALMS. Everything above is geometric invariance on a synthetic hand,
      NOT recognition accuracy. A PolyU run is owed to na-004/010. Handedness is not normalised
      (a left hand mirrors a right — correct, but a gallery must not mix them under one identity).
