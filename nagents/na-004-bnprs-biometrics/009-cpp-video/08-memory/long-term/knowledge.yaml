    content: "Fire/smoke DETECTION = YOLOv8s on the D-FIRE dataset, trained locally on this MacBook (Apple M4 Pro, MPS). Env: /Users/bnprs/BPR/GitRepos1/bpr.cpp/.models/venv/bin/python (ultralytics 8.4.21, torch 2.10, mps=True). Runs live at /Users/bnprs/BPR/Datasets/fire-smoke/runs/ (NOT bpr.cpp/runs). Data cfg: /Users/bnprs/BPR/Datasets/fire-smoke/dfire/dfire.yaml, classes [smoke, fire]. Launch scripts in that dir: train_fire.py (@640 base), train_fire_1280.py (@1280 fine-tune). STAGE 1 dfire_yolov8s @640: COMPLETE 80/80 epochs (Aug 17), best ~epoch64 mAP50=0.793 mAP50-95=0.465, weights runs/dfire_yolov8s/weights/best.pt. STAGE 2 dfire_yolov8s_1280ft (fine-tune of stage-1 best at imgsz=1280, 40 epochs, batch 8, lr0=0.005): first attempt DIED at epoch 3/40 (~06:45 Aug 18, likely Mac sleep). RESUMED 2026-08-18 evening from last.pt via resume_fire_1280.py (YOLO(last.pt).train(resume=True)), run under `nohup caffeinate -is <venv-python> resume_fire_1280.py > resume_1280.log 2>&1 &` (caffeinate prevents the sleep that killed it; PID in resume_1280.pid). ~1.9 s/it, 2153 it/epoch ≈ ~68 min/epoch → ~1.75 days for the remaining 37 epochs. Monitor: tail runs/dfire_yolov8s_1280ft/results.csv or resume_1280.log; completion prints 'FIRE1280_DONE' + val metrics. LESSON: long local MPS trainings MUST be launched under caffeinate -is or they die on sleep. DECISION (2026-08-19): the @1280 fine-tune was ABANDONED — after ~8 epochs it plateaued at mAP50~0.68, BELOW the @640 base (0.793), because lr0=0.005 disrupted the good base weights without recovering. STOPPED it. SHIP THE @640 BASE as the fire/smoke detector: runs/dfire_yolov8s/weights/best.pt (YOLOv8s, epoch 64, mAP50=0.793 mAP50-95=0.465, classes [smoke,fire]). If a 1280 fine-tune is retried, use a gentler lr0 (~0.001) and fewer epochs so it refines rather than resets the base. **TODO (open, user-requested 2026-08-19): RESUME/RE-DO the fire training later** — retry the @1280 fine-tune from the @640 best.pt with gentler lr0 (~0.001, ~10-15 epochs), OR train longer/with more data to push past mAP50 0.79. Launch under `caffeinate -is`. Base best.pt (runs/dfire_yolov8s/weights/best.pt) is the interim shipped detector until then."
