  - id: mem-006
    type: technical_knowledge
    content: >-
      BioID CANNOT SUPPORT A VERIFICATION PROTOCOL — IT SHIPS NO IDENTITY LABELS. Its own
      description.txt says the 1521 images show "one out of 23 different test persons" and are
      "labeled BioID_xxxx.pgm where xxxx is THE INDEX OF THE CURRENT IMAGE". The filename is a
      SEQUENCE NUMBER, not a subject. No manifest, no per-subject directory, no identity column
      anywhere in the distribution (1521 .pgm + 1521 .eye + one description.txt). The 23 identities
      exist but are NOT recoverable from disk, so genuine pairs cannot be formed and accuracy,
      TAR@FAR and EER are all UNDEFINED on this database.
      IT IS A FACE DETECTION BENCHMARK. That is what its manually-marked .eye ground truth is for.
      The 2026-08-01 report recommended it as "BioID (marked-up, varied lighting)" — the mark-up is
      EYE COORDINATES, NOT IDENTITY. That recommendation was wrong and this entry supersedes it.
      THE TRAP, and it is a silent one: DO NOT run make_pairs.py on the BioID folder. Its rule is
      "a subject is any directory that directly contains images", so a flat BioID folder becomes ONE
      SUBJECT WITH 1521 IMAGES and every one of the ~1.16 M within-folder pairs is emitted as
      GENUINE — pairs of 23 different people all labelled same-person. The run completes and prints
      a plausible table of pure noise. Same class of bug as the dbase females/1 vs males/1
      collision, opposite direction.
      TO MAKE IT USABLE somebody must supply identity annotations; third-party labellings exist but
      are not in this distribution.
    created_at: "2026-08-14"
    last_accessed: "2026-08-14"
