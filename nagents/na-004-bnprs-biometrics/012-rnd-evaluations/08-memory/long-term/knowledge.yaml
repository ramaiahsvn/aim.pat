  - id: mem-003
    type: technical_knowledge
    content: >-
      2026-08-01 FACE BASELINE — all four variants on LFW, ORL, dbase and CroppedYale. Report:
      07-axon-terminals/deliverables/eval-reports/2026-08-01-face-4variant-lfw-orl.md
      Identical protocol and detector settings throughout. FTE: 0 on LFW and ORL; 2 on dbase,
      the SAME 2 for every variant — so all four saw an identical pair set in every case.
      LFW (6000 pairs, 10-fold):
        T14 aFace  99.35% +/- 0.34   TAR@1e-3 98.87%   AdaFace IR-101 / WebFace12M
        T15 mFace  99.33% +/- 0.37   TAR@1e-3 98.80%   MagFace R100 / Glint360K
        T13 iFace  99.02% +/- 0.26   TAR@1e-3 97.37%   InspireFace Pikachu
        T12 sFace  96.60% +/- 0.89   TAR@1e-3 93.50%   OpenCV SFace — THE INCUMBENT
      ORL (3600 pairs, folds split BY SUBJECT):
        T12 99.91% +/- 0.28 | T15 99.80% +/- 0.61 | T14 99.68% +/- 0.95 | T13 99.64% +/- 0.82
      dbase (6994 pairs, 61 subjects, 640x480 colour, folds by subject; same 2 FTE for all four):
        T14 98.64% +/- 3.85  TAR@1e-3 96.83%
        T15 98.60% +/- 3.84  TAR@1e-3 96.68%
        T12 98.39% +/- 3.83  TAR@1e-3 96.36%
        T13 95.08% +/- 3.72  TAR@1e-3 84.39%   <-- COLLAPSES
      THE RANKING INVERTS AND ORL IS THE REASON. T12 is last on LFW and first on ORL — that is
      ORL failing to discriminate, not T12 excelling. All four within 0.27 points, error bars
      0.28-0.95 overlapping completely, three of four at 100% TAR@1e-3. 40 subjects, controlled,
      frontal, single session. ORL IS A SMOKE TEST; DO NOT RANK ALGORITHMS WITH IT. As a smoke
      test it earned its keep: 0 FTE on 92x112 GRAYSCALE PGM tight crops proved the detect/align
      path handles input well outside LFW's shape.
      T14 vs T15 IS A STATISTICAL TIE — 0.02 apart against +/-0.35 bars. Ranking them is noise.
      READ TAR@FAR, NOT ACCURACY. T14/T15 ~98.8% against T13's 97.4% at FAR=1e-3 means iFace
      rejects roughly 2.4x as many genuine users at a fixed 1-in-1000 false-accept rate; the
      accuracy column understates that gap by more than half.
      OPEN, ROUTED TO na-004/001 cpp-face: T12's 2.8-point deficit looks like INTEGRATION rather
      than the model. It is the ONLY variant whose score depends on external pre-alignment (+0.77
      from lfw-deepfunneled, where T13/T14/T15 are -0.07/-0.09/-0.07) and its fold variance is 3x
      the others. Published SFace is ~99.4%. Those points are on the ONLY SHIPPABLE VARIANT,
      which makes them worth more than anything the licence-blocked ones can offer.
      CROPPEDYALE (38 subjects x ~64 illumination directions, 12924 pairs on a COMMON SUBSET —
      see below): THE ONLY SET THAT GENUINELY STRESSES THESE MODELS.
        T13 iFace  98.27% +/- 0.56   TAR@1e-2 97.28%   TAR@1e-3 81.74%
        T14 aFace  97.69% +/- 1.11   TAR@1e-2 96.53%   TAR@1e-3 93.63%
        T15 mFace  96.54% +/- 0.98   TAR@1e-2 93.99%   TAR@1e-3 89.56%
        T12 sFace  89.92% +/- 2.30   TAR@1e-2 74.75%   TAR@1e-3 58.04%
      THREE THINGS ONLY THIS DATASET COULD SHOW:
      (1) T12 COLLAPSES — TAR@1e-3 of 58% means ~42% OF GENUINE USERS REJECTED at a 1-in-1000
      false-accept rate, against T14's 93.6%. On LFW it trailed by 2.8 points; here by 36.
      Whatever ails T12 costs far more on hard imagery than LFW implied.
      (2) T13 AND T14 CROSS OVER BETWEEN OPERATING POINTS, and this is the single best argument
      for reading TAR@FAR rather than accuracy. T13 has the BEST accuracy (98.27%) and the best
      TAR@1e-2 (97.28%), but tightening to FAR=1e-3 costs it 15.5 points while T14 loses only
      2.9. T13 has a HEAVIER IMPOSTOR TAIL — it separates the bulk well but has more extreme
      false-accept scores. FOR AUTHENTICATION, WHICH LIVES AT STRICT FAR, T14 IS 12 POINTS BETTER
      THAN THE VARIANT THAT "WINS" ON ACCURACY.
      (3) ADAFACE FINALLY SEPARATES FROM MAGFACE. Tied on LFW (0.02), ORL and dbase; here T14
      leads T15 by 1.15 accuracy and 4.1 on TAR@1e-3 — the direction the -CCTV naming predicts,
      since a quality-adaptive margin should pay off exactly where quality varies. First evidence
      in this evaluation for preferring one over the other.
      HOW THE COMMON SUBSET WAS BUILT, AND WHY IT WAS NECESSARY: first-pass FTE differed by
      variant (T13 388, others 418) because T13 uses InspireFace's OWN detector, not YuNet, so it
      survives images the others drop. Different FTE = different pair sets = not a comparison
      (directive 5 caught this). Collect each variant's failures with --fte-list, union them (481
      images), re-run all with --exclude on the union -> 12924 identical pairs. USE THIS TWO-PASS
      PATTERN WHENEVER VARIANTS DO NOT SHARE A DETECTOR.
      DBASE IS THE FIRST SET THAT SEPARATED ANYTHING, AND IT SEPARATED T13 DOWNWARDS. iFace goes
      99.02% (LFW) -> 95.08%, and its TAR@1e-3 collapses 97.37% -> 84.39% — about 1 genuine user
      in 6 rejected at a 1-in-1000 false-accept rate, against ~1 in 30 for the other three, which
      finish within 0.25 points of each other. Likely cause: Pikachu is InspireFace's LIGHTWEIGHT
      EDGE pack, and a small model degrades faster than IR-101 once the data stops being frontal
      and clean. SO THIS IS A RESULT ABOUT THE PACK, NOT NECESSARILY ABOUT INSPIREFACE — evaluate
      the Megatron pack before drawing any conclusion about the SDK.
      READ DBASE'S +/-3.8 BEFORE RANKING ON IT. That bar is ~10x LFW's and nearly identical across
      all four variants (3.72-3.85), which means it is driven by WHICH SUBJECTS LANDED IN WHICH
      FOLD, not by the models — 61 subjects over 10 folds is ~6 per fold, so one hard identity
      moves a whole fold. The 0.25-point spread between T12/T14/T15 is far inside it and means
      NOTHING. T13's ~3.5-point deficit is around one std, so on accuracy alone it is only
      suggestive; the TAR@FAR gap is what makes it decisive, because TAR is computed over the
      POOLED score set rather than per fold. GENERAL: on a small-subject database, trust TAR@FAR
      over fold-averaged accuracy.
      NOT QUOTABLE EXTERNALLY: T13/T14/T15 all use research-licensed weights with no commercial
      grant (na-004/007 mem-030, mem-032). Measurements, not options.
