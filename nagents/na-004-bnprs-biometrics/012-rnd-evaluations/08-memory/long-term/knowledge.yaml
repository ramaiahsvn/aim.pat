  - id: mem-007
    type: project_context
    content: >-
      "YALE" IS TWO DIFFERENT DATABASES AND ONE WAS ALREADY EVALUATED. ~/BPR/FaceData/Yale/ holds
      BOTH: CroppedYale/ (38 subjects x ~64 illumination directions, 2452 pgm) which IS the set
      evaluated in the 2026-08-01 report S4c/S4d, and yalefaces.zip which is the ORIGINAL Yale Face
      Database (15 subjects x 11 conditions = 165 images, 320x243 GIF) and had NOT been evaluated.
      The 2026-08-01 report listed "Yale" as a recommended NEXT database while already reporting
      CroppedYale results — those are different sets and the recommendation meant the original.
      THE ORIGINAL ADDS EXPRESSION; CroppedYale is pure illumination geometry. Conditions:
      centerlight, glasses, happy, leftlight, noglasses, normal, rightlight, sad, sleepy,
      surprised, wink.
      TWO DATA DEFECTS IN THE ZIP, both must be fixed before any run:
      (1) subject01.glasses.gif is a BYTE-IDENTICAL duplicate of subject01.glasses (md5 bbf4e6ad...).
      Left in, it forms a genuine pair of THE SAME FILE, which every matcher scores 1.0 — free
      accuracy on an image that is not a second sample. EXCLUDE IT.
      (2) subject01.centerlight DOES NOT EXIST; subject01.gif does, is unique, and is the only
      subject01 file with no condition suffix — it is subject01's centerlight under a mangled name.
      RENAME IT, or subject01 silently has 10 images while everyone else has 11.
      After both fixes: exactly 15 x 11 = 165. Convert GIF->PNG (sips) into subject-per-directory
      layout, because identity is in the FILENAME here and make_pairs.py keys on the DIRECTORY PATH.
