  - id: mem-008
    type: technical_knowledge
    content: >-
      2026-08-14 YALE (original, 15 subjects, 1650 pairs) — SATURATED, AND THE SCORE DISTRIBUTIONS
      RANK WHAT THE ACCURACY TABLE COULD NOT.
      Accuracy: T15 99.86 +/- 0.42, T13 99.86 +/- 0.42, T12 99.81 +/- 0.56, T14 99.77 +/- 0.69.
      ALL FOUR at TAR@1e-2 = TAR@1e-3 = 100%, ALL FOUR at 0 FTE. Spread 0.09 points against error
      bars of 0.42-0.69 — NO RANKING CLAIM IS PERMITTED FROM THIS TABLE (directive 5). ORL's finding
      again and worse: ORL had 40 subjects, this has 15. Also note 15 subjects do not divide into 10
      folds, so fold sizes ran 252/235/218/216/192/120/123/105/96/93.
      THE NEW READING RULE — WHEN ACCURACY SATURATES, LOOK AT THE DISTRIBUTIONS BEFORE DECLARING A
      TIE. Accuracy saturates here because genuine and impostor DO NOT OVERLAP AT ALL: for every
      variant the lowest genuine score exceeds the highest impostor score, so zero errors are
      achievable at some threshold. MARGIN = genuine-min minus impostor-max:
        T15 0.6215-0.2561 = 0.3654 | T14 0.5448-0.1887 = 0.3561
        T13 0.4863-0.2836 = 0.2027 | T12 0.5395-0.3471 = 0.1924
      T14/T15 hold ~1.85x the margin of T12/T13 — a clean 2-vs-2 split that the accuracy column
      (0.09 spread) and the TAR columns (all 100%) both erase. Same direction as CroppedYale, where
      T14 led T12 by 36 points of TAR@1e-3. DIRECTIONAL, NOT DECISIVE: margin is a min-vs-max over
      825+825 pairs from 15 identities, resting on the two most extreme scores, with no error bar.
      Costs nothing to compute — needs only --scores, no extra runs.
      ACCURACY IS BELOW 100% DESPITE PERFECT SEPARABILITY. With non-overlapping distributions the
      only way to misclassify is to place the threshold outside the gap, so the residual 0.14-0.23%
      measures the 10-fold THRESHOLD FITTING on single-identity folds, not the models.
      CONDITION DIFFICULTY IS A PROPERTY OF THE IMAGERY, NOT THE MODEL — near-identical ordering for
      all four: rightlight / leftlight / glasses hardest, normal / noglasses easiest. EXPRESSION
      (happy, sad, sleepy, wink) COSTS MARKEDLY LESS THAN ILLUMINATION. OCCLUSION BY GLASSES IS AS
      EXPENSIVE AS DIRECTIONAL LIGHTING and is the single hardest condition for T14/T15 — relevant
      to enrolment policy, since glasses-on enrolment against glasses-off probe is among the most
      expensive pairings. Condition spread (easiest minus hardest) ranks stability: T15 0.073,
      T14 0.086, T12 0.109, T13 0.115. Hardest PAIRS are lighting-crossed and NOT ONE fell below
      the impostor ceiling for any variant.
      T12 DOES NOT COLLAPSE HERE — 99.81% and TAR@1e-3 100%, against 89.92% and 58.04% on
      CroppedYale. Yale's leftlight/rightlight is mild next to CroppedYale's +/-130 azimuth. A T12
      deployment in controlled lighting looks fine; the same build on surveillance illumination does
      not. DO NOT GENERALISE A YALE-CLASS RESULT TO CCTV.
