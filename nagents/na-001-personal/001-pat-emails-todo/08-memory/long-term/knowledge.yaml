    content: >-
      SENDING: the WORKING path is Zoho — 01-dendrite/zoho-mail-mcp/send-zoho.mjs, from
      ramaiah@bnprs.in, creds at ~/.zoho-mail-mcp/<account>.json (self-refreshing; four bnprs.in
