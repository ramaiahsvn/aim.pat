  - id: mem-003
    type: incident_learning
    content: >-
      2026-07-26 BLOCKER (last functional gap for nagents-prod): the prod frontends are deployed + serving
      but keycloak login bounces (redirect_uri mismatch) until the prod CloudFront origins are added as
      Valid Redirect URIs + Web Origins on the SHARED keycloak (accounts-uat.itpgateway.com, realm
      BNPRS-enterprise): client hr-spa -> https://d393t8cl2frfgi.cloudfront.net/* ; client projects-frontend
      -> https://d3gkxmmnojgivv.cloudfront.net/* (APPEND, keep UAT entries). Could NOT self-apply: the
      bootstrap admin pw in Secrets Manager utms/prod/keycloak is INVALID (rotated post-boot); the
      hr-app-admin service account is 403 (no manage-clients); ECS exec disabled on utms-keycloak; no other
      admin secret. => needs the utms/shared-keycloak team. Unblock (any one): update utms/prod/keycloak
      KEYCLOAK_ADMIN_PASSWORD with the current value; OR grant hr-app-admin the manage-clients role; OR the
      shared team edits the clients directly. Request drafted:
      07-axon-terminals/deliverables/keycloak-prod-redirect-uris-request.md. Once unblocked, apply via the
      keycloak Admin API (GET client, append redirectUris+webOrigins, PUT).
      ---
      RESOLVED — verified 2026-08-09. Both prod redirect URIs are now registered on the shared realm.
      Live PKCE authorization request (response_type=code, code_challenge_method=S256) against
      accounts-uat.itpgateway.com/realms/BNPRS-enterprise returns HTTP 200 + the Keycloak login form for
      BOTH client hr-spa -> https://d393t8cl2frfgi.cloudfront.net/ and projects-frontend ->
      https://d3gkxmmnojgivv.cloudfront.net/. Prod login works. Who applied it / when is unrecorded.
      NEW FINDING from the same test: a control request with a deliberately UNREGISTERED redirect_uri
      (https://evil-not-registered.example.com/) ALSO returned the login form for client hr-spa — so
      hr-spa has a wildcard `*` valid-redirect-URI on the shared realm. That is an open redirector:
      an attacker can run a victim through a genuine accounts-uat.itpgateway.com login and have the
      authorization code delivered to a host they control. Needs tightening to explicit URIs by the
      utms/shared-keycloak team (same owners, same admin-credential blocker as above). NOT yet raised.
    created_at: "2026-07-26"
