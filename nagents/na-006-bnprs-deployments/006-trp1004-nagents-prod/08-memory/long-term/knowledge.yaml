  - id: mem-006
    type: project_context
    content: >-
      2026-08-09 Keycloak prod status: the services/keycloak/prod stack EXISTS in bp_rel as code
      (authored by pardhiv — ac4442d, e5118ea, 5b39824) but is NOT DEPLOYED. Verified across every
      surface in ap-south-2: no terraform state under services/keycloak/prod/, no ECS service in
      nagents-prod-ecs (only erp-hr-service + projects-backend), no keycloak target group, no ALB rule
      (:443 and :80 both carry only projects-api pri 200 / erp-api pri 300 / default), no
      nagents-prod-keycloak task definition, no nagents/prod/keycloak secret, and none of
      accounts|keycloak|auth.prod.itpgateway.com resolve. So there is NO prod Keycloak URL to hand the
      team — prod authenticates against the SHARED IdP at
      https://accounts-uat.itpgateway.com/realms/BNPRS-enterprise (note the misleading `-uat` in a
      hostname that serves prod; this is the usual source of confusion). Code review of the stack: it
      validates cleanly and the platform remote-state outputs it consumes all exist, but 5 changes are
      wanted before apply — (1) host_header_values defaults to [] which emits an ALB listener rule with
      ZERO conditions; AWS rejects that, so apply FAILS unless it is set alongside keycloak_hostname;
      (2) db_username defaults to nagents_admin, the RDS MASTER superuser, and its password is copied
      into a second secret — exactly the rotation failure already recorded for utms in mem-003; use a
      dedicated keycloak role owning only the keycloak schema; (3) KEYCLOAK_ADMIN /
      KEYCLOAK_ADMIN_PASSWORD are deprecated on KC 26 (now KC_BOOTSTRAP_ADMIN_USERNAME /
      KC_BOOTSTRAP_ADMIN_PASSWORD) and only take effect on first boot against an empty DB;
      (4) command=["start"] without --optimized re-runs Quarkus augmentation every task start and the
      ecs/service module has NO health_check_grace_period_seconds, while the TG kills at 3x30s=90s =>
      likely crash-loop, almost certainly what drove commit 5b39824; (5) KC_FEATURES="scripts" is a
      preview feature allowing server-side JS in protocol mappers — real attack surface on an IdP,
      confirm it is needed rather than utms parity. Route53 record is intentionally left commented out
      pending the FQDN decision (devops' call, and correct) — when chosen it MUST be a single label
      under prod.itpgateway.com (accounts.prod.itpgateway.com OK; anything deeper is not covered by the
      *.prod.itpgateway.com ACM cert), and KC_HOSTNAME + host_header_values + the A record must all be
      that same name. Also note the :80 rule forwards rather than redirects, so Keycloak would serve
      login and the admin console over plaintext HTTP — the existing erp-api/projects-api rules do the
      same, so it is a platform-wide convention issue, but it matters far more for an IdP.
    created_at: "2026-08-09"
    last_accessed: "2026-08-09"
    access_count: 1
    confidence: 1.0
