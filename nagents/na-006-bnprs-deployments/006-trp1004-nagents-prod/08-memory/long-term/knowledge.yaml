  - id: mem-004
    type: incident_learning
    content: >-
      2026-08-09 MERGE CORRUPTION (found during a Keycloak code review, fixed same session).
      Merge 6de1cde "Merge origin/bp_rel into bp_dev_conflict_fix" silently GUTTED the shared module
      nagents-platform/modules/ecs/service: main.tf truncated 197 -> 58 lines, deleting
      aws_ecs_service.this, aws_security_group.task, aws_security_group_rule.from_alb,
      aws_cloudwatch_log_group.task, aws_appautoscaling_target.ecs, aws_appautoscaling_policy.ecs_cpu,
      data.aws_region.current and locals — only aws_ecs_task_definition.this survived. The same merge
      declared variable "command" TWICE (variables.tf lines 36 + 48). outputs.tf still referenced the
      deleted resources, so `terraform validate` failed with 6 errors on ALL 9 stacks using the module,
      including live erp-hr-service/prod and projects-backend/prod. Nothing could plan, so nothing was
      silently destroyed — but the trap was real: "fixing" it by trimming the dangling outputs.tf
      references instead of restoring main.tf would have made the next apply plan a DESTROY of the live
      ECS services, log groups, SGs and autoscaling. FIX: restored the whole module directory from
      origin/nagents_prod (pardhiv's branch was always clean — 197 lines, one `command` var), which is
      byte-identical per-file to 331eccb, the last intact commit and the version the live prod services
      were deployed from => no drift by construction. Commit de4b4aa, pushed to BOTH bp_rel and bp_dev
      (bp_dev was an ancestor of bp_rel, so a --ff-only back-merge resynced them at de4b4aa). All 9
      stacks validate after. LESSONS: (1) a conflict-fix merge can delete resources with zero conflict
      markers left behind — always `terraform validate` every consumer of a shared module after a
      merge, never just the stack you are working on; (2) check the feature author's own branch before
      rewriting anything — the clean copy usually already exists; (3) fix corrupted modules by
      restoring, never by deleting the references that expose the corruption.
    created_at: "2026-08-09"
    last_accessed: "2026-08-09"
    access_count: 1
    confidence: 1.0
    source: "session-2026-08-09"
    tags: [nagents-prod, terraform, ecs-module, merge-conflict, bp_rel, bp_dev, incident, regression]

  - id: mem-005
    type: technical_knowledge
    content: >-
      2026-08-09 platform/prod apply (state serial 15 -> 16, 87 resources, TF 1.9.8). Plan was
      1 to add / 0 change / 0 destroy — created module.alarms.aws_sns_topic_subscription.email for
      ramaiah.polyu@gmail.com on arn:aws:sns:ap-south-2:819144294008:nagents-prod-alarms. Re-plan after
      = "No changes". CAVEAT: the subscription stays PendingConfirmation until the confirm link emailed
      to ramaiah.polyu@gmail.com is clicked; until then prod CloudWatch alarms (rds_cpu,
      rds_low_storage, redis_cpu) fire into a topic with no live subscriber, AND this same 1-resource
      diff REAPPEARS on every plan, because Terraform drops unconfirmed subscriptions from state on
      refresh. That is why it showed up at all. Two traps hit this session, both worth remembering:
      (1) bp_rel had `tls_certificate_arn = null` in platform/prod/alb.tf while the live ALB has had an
      HTTPS :443 listener on ACM *.prod.itpgateway.com since serial 15 — applying clean bp_rel would
      have DESTROYED aws_lb_listener.https. Fixed and committed as 7b1c414; bp_rel now matches deployed.
      (2) platform/prod/terraform.tfvars is git-ignored (*.tfvars, .gitignore:31) and UNTRACKED, and it
      disappeared from the working tree during the branch switch to bp_rel. The only copy in git history
      is a stale FILL_ME template (3201b83 "untrack tfvars"). It had to be rebuilt by hand. Real values:
      openvpn_enabled=false, openvpn_ami_id=ami-003c24952faf975ae, redis_num_cache_clusters=2,
      alarm_emails=["ramaiah.polyu@gmail.com"], db_multi_az=false, db.t4g.medium, cache.t4g.medium.
      This file is one branch switch from gone — it belongs in SSM Parameter Store or the team vault.
      The service stacks' own terraform.tfvars are gone too (db_password, redis_password,
      keycloak_admin_client_secret, internal_api_token), which is why prod service stacks cannot be
      planned locally without recovering them first.
