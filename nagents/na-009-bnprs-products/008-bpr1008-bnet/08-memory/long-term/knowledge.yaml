        setup.bat                           installs the Windows services
      STACK: Windows 10/11 64-bit ONLY, .NET Framework 4.7.2+, MySQL 5.5.62, 4 cores / 8 GB / 20 GB.
      Main app C:\bNet\bNetMain\Bpr.bNet.exe; services under C:\bNet\bNetServices\.
      SCHEMA is an institutional attendance domain: person/student/staff/faculty, course/programme/
      semester/department/designation/qualification, camera + cameramapping, imp_events and
      restricted_events, studentimages, user/role/menu/rolerole. Geography: country/state/district.
      LICENSING is per-machine: License Manager shows a Hardware ID, BNPRS issues a key, and it is
      pasted into C:\bNet\bNetServices\BprFace\bpr.face.lic. So bNet consumes BprFace natively on
      Windows — the same library na-004/001 builds — and setup.bat mirrors BprFace into
      C:\ProgramData\BprFace while EXCLUDING bnet_oc_raw, which is the detector's cropped-face
      output directory (BprSFaceDetect saveRoot). That is runtime data, never shipped.
      FOUR DISCREPANCIES FOUND ON FIRST READ — check before trusting either document:
        1. Install root disagrees. The guide says C:\bNet; setup.bat writes c:\BNPRS\bNet.
        2. The guide and setup.bat both name Final_cqi_bnet_db.sql, which does NOT exist here —
           the Backup folder has the schema and the data as two separate files.
        3. The guide lists 3 services (Camera, Dedup, Sync); setup.bat installs SIX:
           bNet_10100_Dedup, bNet_10101_Chain, bNet_10101_Stream, bNet_10102_Chain,
           bNet_10102_Stream, bNet_SyncService. The 101xx numbers look per-camera.
        4. MySQL 5.5.62 reached end of life in 2018 — no security patches.
      SECURITY: the guide prints the MySQL root password in clear text in section 4 and again in
      8.2. Value deliberately NOT recorded here. Flag it for redaction before the PDF goes to any
      customer; it is marked "For Internal and End-User Use Only", so it does leave the building.
