      "/var/run/docker.sock: device or resource busy", and the `docker` service host doesn't resolve).
      FIX with NO committed-CI/runner-config change: trigger the pipeline via API with pipeline
      variable DOCKER_HOST=unix:///var/run/docker.sock (talks to the host daemon through the mounted
