      beside the .so at startup. No Dockerfile change, no separate model shipping.
      REAL BLOCKER WAS MEMORY: FACECHAIN_MODE=SERVER loads T14+T12 (~260MB each off-heap) and the
      2GB task (cpu 1024/mem 2048) OOM-KILLED at startup (exit 137, "container killed due to
      memory usage"). FIX: bumped task memory to 4096 (rev 46, cpu 1024/mem 4096 - valid Fargate
      combo); booted HEALTHY, rollout COMPLETED. So: mode=SERVER needs >=4GB. qi-code
      C884C92A9295C92F and EFS paths (/var/lib/smartpresence/uploads/{gallery,bNet_prb,images_dump})
      were already in the task def; only FACECHAIN_MODE OFF->SERVER + memory 2048->4096 changed.
