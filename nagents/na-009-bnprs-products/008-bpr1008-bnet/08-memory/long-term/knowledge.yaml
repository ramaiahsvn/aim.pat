      cr-licensing), 611 files, and it is the only lineage carrying
      bNet_Shared/Bpr.Core/Products/_Common/keycloakApiClient.cs.
      ONLY _BprFws + QiMods ARE ALIVE: 131 .cs and 25 real screens. _BprCore (397 .cs, last touched
      2020-11-19 initial commit), _bk (132, 2024) and _BprFace (3, 2025) are dead — about 80% of
      the tree, and every one of the 88 WinForms designers is in them. Scope a migration from the
      LIVE folders, not from a file count over the repo.
      ARCHITECTURE AS OF [#NK-I311]: the WPF client no longer talks to MySQL for these paths. It
      calls the SmartPresence Spring Boot API — ServerAPIsBaseURL
      utms-smartpresence-api-alb-*.eu-central-1.elb.amazonaws.com — through KeycloakApiClient,
      which attaches a Bearer token and retries once on 401. That API is bpr1004.utms.api.bnet.
      smartpresence, the repo whose ai_dev was force-migrated to Java on 2026-08-01, so bNet is its
      client. Endpoints seen: bnet/ActiveFilteredMatchFace, bnet/FilteredMatchFace, bnet/Courses,
      bnet/FetchFaculty, bnet/EnrolledStudents, bnet/GetAttendance.
      TWO SECURITY ITEMS IN _BprFws/App.config, COMMITTED TO GIT: a Keycloak client secret in
      plaintext for client bnet-sync-service on accounts-uat.itpgateway.com realm UTMS (value NOT
      recorded here — rotate it), and Api.BypassCertificateValidation=true, which disables TLS
      verification for every Keycloak and API call. The code itself logs a warning that this must
      not be left on in production. Encrypted PROD connection strings sit there too.
