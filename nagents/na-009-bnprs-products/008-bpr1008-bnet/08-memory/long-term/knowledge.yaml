  - id: mem-003
    type: technical_knowledge
    content: >-
      BprIDEngine 2.24.902 IN SMARTPRESENCE — AND THE POM FIX WAS NOT ENOUGH ON ITS OWN.
      pom.xml depended on ai.bnprs:nativesdk-bpridengine-face:2.24.900, DELETED from the registry
      2026-08-01 with 2.24.901 and both lean variants. Correct coordinate is
      ai.bnprs:nativesdk-bpridengine:2.24.902 — the -face suffix is GONE because 902 withdrew the
      lean/face split; one artifact, and it carries the T12 extractor.
      THE CODE NEEDED CHANGING TOO, which a pom-only fix would have missed silently:
      BprIdFaceEngine.init() gated startup on BprID_HasTemplate(T12), which from 902 ALWAYS returns
      1 because T12 is always compiled in. The gate passed unconditionally, so a deployment missing
      its ONNX models would start clean and fail on the first enrolment. Now uses
      BprID_Preload(T12), which loads the models and returns ERR_MODULE when they are absent — and
      which exists in the 901 native but was never BOUND in that JNA wrapper, so it is callable
      only from 902. It also moves the ~170 ms first-call load to startup, which matters for an API
      where every request otherwise looks like the first.
      RULE: after any BprIDEngine version bump here, grep the Java sources for HasTemplate and for
      the string "nativesdk-bpridengine-face" — the old failure message told readers to depend on
      an artifact that no longer exists.
      Verified end to end: 902 resolves from the registry, BprID_Preload is in its JNA binding
      (javap the jar), and the module compiles.
    created_at: "2026-08-01"
    last_accessed: "2026-08-01"
    access_count: 1
    confidence: 1.0
    source: "session-2026-08-01"
    tags: [bpridengine-2.24.902, no-face-suffix, hastemplate-no-longer-a-readiness-check, use-preload, pom-fix-alone-is-insufficient, grep-the-java-too]

