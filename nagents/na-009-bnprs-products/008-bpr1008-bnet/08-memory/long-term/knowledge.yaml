      then flip env to SERVER (register rev, update-service). Flip script at scratchpad/
      flip-facechain-server.sh (describe current td -> set FACECHAIN_MODE=SERVER -> register ->
      update-service; profile itp, eu-central-1). ECS register/update were NOT classifier-blocked
