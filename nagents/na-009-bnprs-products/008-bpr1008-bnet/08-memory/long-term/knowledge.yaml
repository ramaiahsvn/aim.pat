    content: >-
      "ACTIVITIES SURVIVE THE WIPE" SOLVED (2026-08-21): clean-data.sh truncated imp_events
      fine, but it only pkill'd the worker - launchd (KeepAlive=true) relaunched it within
      seconds and, since the camera streams are RECORDED CLIPS that replay from the start,
      it refilled imp_events + smoke/fight frames immediately. Measured: 7 rows + 16 frames
      within ~1 min of a "clean" wipe. FIX committed 6959fba: clean-data.sh now unloads the
      launchd job BEFORE pkill. TRAP INSIDE THE FIX: `launchctl list | grep -q LABEL` under
      `set -o pipefail` is always-false when it matters - grep -q exits on first match,
      launchctl dies of SIGPIPE(141), pipeline "fails", unload skipped. Use
      `launchctl list <label> >/dev/null 2>&1` as the test.
      FONT: app moved Poppins -> Plus Jakarta Sans (site-brand font, same as bnprs.in).
      One global rename Poppins->PlusJakartaSans across 10 files (62 refs: aliases AND ttf
      filenames share the weight suffixes) + 4 static TTFs (OFL, tokotype GitHub) in
      Resources/Fonts. TWO BUILD TRAPS: (1) run-macos.sh NEVER BUILDS the app - it picks the
      newest existing bundle; after source changes run
      `DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer dotnet build src/Bpr.BNet.App
      -f net10.0-maccatalyst` yourself. (2) incremental resizetizer keeps STALE font staging -
      verify the .app/Contents/Resources actually contains the new ttfs, old Poppins copies
      linger in the bundle harmlessly until a clean build.
