  - id: mem-003
    type: technical_knowledge
    content: >-
      BprIDEngine 2.24.902 IN SMARTPRESENCE — AND THE POM FIX WAS NOT ENOUGH ON ITS OWN.
      pom.xml depended on ai.bnprs:nativesdk-bpridengine-face:2.24.900, DELETED from the registry
      2026-08-01 with 2.24.901 and both lean variants. Correct coordinate is
      ai.bnprs:nativesdk-bpridengine:2.24.902 — the -face suffix is GONE because 902 withdrew the
      lean/face split; one artifact, and it carries the T12 extractor.
      THE CODE NEEDED CHANGING TOO, which a pom-only fix would have missed silently:
      BprIdFaceEngine.init() gated startup on BprID_HasTemplate(T12), which from 902 ALWAYS returns
      1 because T12 is always compiled in. The gate passed unconditionally, so a deployment missing
      its ONNX models would start clean and fail on the first enrolment. Now uses
      BprID_Preload(T12), which loads the models and returns ERR_MODULE when they are absent — and
      which exists in the 901 native but was never BOUND in that JNA wrapper, so it is callable
      only from 902. It also moves the ~170 ms first-call load to startup, which matters for an API
      where every request otherwise looks like the first.
      RULE: after any BprIDEngine version bump here, grep the Java sources for HasTemplate and for
      the string "nativesdk-bpridengine-face" — the old failure message told readers to depend on
      an artifact that no longer exists.
      Verified end to end: 902 resolves from the registry, BprID_Preload is in its JNA binding
      (javap the jar), and the module compiles.
    created_at: "2026-08-01"
    last_accessed: "2026-08-01"
    access_count: 1
    confidence: 1.0
    source: "session-2026-08-01"
    tags: [bpridengine-2.24.902, no-face-suffix, hastemplate-no-longer-a-readiness-check, use-preload, pom-fix-alone-is-insufficient, grep-the-java-too]

  - id: mem-004
    type: reference
    content: >-
      PRIMARY REFERENCE FOR bNET DEPLOYMENT: /Users/bnprs/BPR/GitRepos2/BPR1008_bNet/Backup/
        bNet_Installation_Guide (1).pdf     11 pages, v1.0.0 (note the space and "(1)" in the name)
        Final_cqi_bnet_db_only_schema.sql   MySQL/InnoDB, database `cqi_bnet`, 31 tables
        Final_cqi_bnet_db_only_data.sql     seed data
        setup.bat                           installs the Windows services
      STACK: Windows 10/11 64-bit ONLY, .NET Framework 4.7.2+, MySQL 5.5.62, 4 cores / 8 GB / 20 GB.
      Main app C:\bNet\bNetMain\Bpr.bNet.exe; services under C:\bNet\bNetServices\.
      SCHEMA is an institutional attendance domain: person/student/staff/faculty, course/programme/
      semester/department/designation/qualification, camera + cameramapping, imp_events and
      restricted_events, studentimages, user/role/menu/rolerole. Geography: country/state/district.
      LICENSING is per-machine: License Manager shows a Hardware ID, BNPRS issues a key, and it is
      pasted into C:\bNet\bNetServices\BprFace\bpr.face.lic. So bNet consumes BprFace natively on
      Windows — the same library na-004/001 builds — and setup.bat mirrors BprFace into
      C:\ProgramData\BprFace while EXCLUDING bnet_oc_raw, which is the detector's cropped-face
      output directory (BprSFaceDetect saveRoot). That is runtime data, never shipped.
      FOUR DISCREPANCIES FOUND ON FIRST READ — check before trusting either document:
        1. Install root disagrees. The guide says C:\bNet; setup.bat writes c:\BNPRS\bNet.
        2. The guide and setup.bat both name Final_cqi_bnet_db.sql, which does NOT exist here —
           the Backup folder has the schema and the data as two separate files.
        3. The guide lists 3 services (Camera, Dedup, Sync); setup.bat installs SIX:
           bNet_10100_Dedup, bNet_10101_Chain, bNet_10101_Stream, bNet_10102_Chain,
           bNet_10102_Stream, bNet_SyncService. The 101xx numbers look per-camera.
        4. MySQL 5.5.62 reached end of life in 2018 — no security patches.
      SECURITY: the guide prints the MySQL root password in clear text in section 4 and again in
      8.2. Value deliberately NOT recorded here. Flag it for redaction before the PDF goes to any
      customer; it is marked "For Internal and End-User Use Only", so it does leave the building.
    created_at: "2026-08-02"
    last_accessed: "2026-08-02"
    access_count: 1
    confidence: 1.0
