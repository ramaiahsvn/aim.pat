  - id: mem-007
    type: technical_knowledge
    content: >-
      bNET LOGIN IS TWO-PHASE — the exact v1 logic, not a redesign (user instruction: keep the
      business logic, only make screens/methods cross-platform). v1 UserLogin.DoLoginAsync:
        if (CurrentCompanyID > 0)  LoginUserCheck(user,pass)   -> LOCAL MySQL, SHA-256 lowercase hex
        else                       UserLoginAsync(user,pass)   -> REMOTE: POST bnet/userlogin
                                     {userName,password} -> {companyId,firstName,lastName}; a 200 with
                                     COMPANY_ID == -1 still counts as failure.
      On remote success v1 sets CurrentCompanyID = companyId (persisted), so the machine flips to
      LOCAL for later logins once the Windows sync (Itp_SyncService.SyncUserToLocal, which does
      CreateUserTableIfNotExists then GetRemoteData<UserDetails>("user","User")) has filled the
      local user table. v1 commits to ONE path by CurrentCompanyID — NO local/remote fallback.
      REMOTE LOGIN IS NOT THE KEYCLOAK PASSWORD GRANT. An earlier v2 commit (15d9381) wrongly hit
      Keycloak's token endpoint with grant_type=password; corrected in 8077a6b to POST bnet/userlogin
      via UserLoginApi. Keycloak client_credentials remains ONLY the data-API transport
      (KeycloakApiClient), never user login.
      v2 mapping: AuthService=LoginUserCheck, UserLoginApi=UserLoginAsync, AuthCoordinator=the
      CurrentCompanyID decision, CompanySettings=CurrentCompanyID persisted in MAUI Preferences
      (replaces CQIConstants/App.config — the cross-platform part). MAC CAVEAT: Itp_SyncService is
      Windows-only (System.ServiceProcess), so a Mac gets its local user table from a shared MySQL a
      Windows host synced, or a future cross-platform sync; until then a Mac stays on first-run remote.
    created_at: "2026-08-02"
    last_accessed: "2026-08-02"
    access_count: 1
    confidence: 1.0
