  - id: mem-008
    type: project
    content: >-
      bNET V2 STATUS 2026-08-03 — updates mem-006; RESOLVES the "add itpgateway DNS / TLS bypass"
      item from mem-005/006. THE CORRECT API HOST IS https://smartpresence-api-uat.itpgateway.com/
      — NOT the raw utms-smartpresence-api-alb-429499752.eu-central-1.elb.amazonaws.com. The ALB cert
      is CN=*.itpgateway.com, so the raw ELB name fails TLS ("no alternative certificate subject name
      matches"); Route53 (itp acct, zone itpgateway.com) aliases smartpresence-api-uat -> that ALB.
      With the real host, sync (15/15 tables) and 1:N verify both work over PROPER TLS — the
      App.config Api.BypassCertificateValidation=true was masking a WRONG BASE URL, not a bad cert;
      do not ship the bypass. (v1 App.config in bpr1008.bnet.main/_BprFws/App.config was locally
      edited to the correct host; left UNCOMMITTED pending user decision.)
      DEPLOY: the API is built+deployed by GitLab project 34 (bpr1004.utms.api.bnet.smartpresence)
      pipeline on branch uat_temp -> ECS service utms-smartpresence-api, cluster utms-cluster, AWS
      acct 819144294008, eu-central-1 (Frankfurt). Container logs CloudWatch /ecs/utms-smartpresence-api
      (Spring Boot; GlobalExceptionHandler logs a traceId). Reach it with AWS_PROFILE=itp.
      AUTH SPLIT (non-obvious, cost hours): sync/CRUD endpoints are /bnet/* with KEYCLOAK
      client_credentials (client bnet-sync-service). But verify1toNFace is at /apis/bnet/verify1toNFace
      (the /apis prefix — its controller is @RequestMapping("/apis"), every other controller is /bnet),
      and it authenticates with a SHARED BEARER TOKEN, not Keycloak (server gatewayService.isTokenValid).
      v2 reads that token from env BNET_VERIFY_TOKEN, NEVER hardcoded. The token value is a LEAKED
      credential in v1 git (bNet_SyncService.cs) — value NOT recorded here; ROTATE it. End-to-end
      verified: 8/8 querydata rows pushed, ResponseCode 200, Status_ID 9->10.
      NEW IN V2 THIS SESSION (all pushed to BPR1008/bpr1008.bnet.main.v2 main):
        * Event-push enabled on the app-managed worker (WorkerController BNET_RUN_EVENTPUSH=true;
          forwards BNET_API_BASE + BNET_KC_* + BNET_VERIFY_TOKEN; verify base = <api>/apis/bnet).
        * StudentImageSyncWorker pulls bnet/studentimages (paged, base64->bytes, incremental by latest
          timestamp) into local studentimages.IMAGE_DATA — v1's PullStudentFaceImageToLocal, which
          shipped DISABLED, so studentimages was always empty. Runs with BNET_RUN_SYNC. Verified 5
          students' photos. Image bytes live only in the DB, never logged/filed.
        * Home "Identified people" panel is now SERVER-DRIVEN (v1 Home.GetMatchedFaceDetailsAsync):
          GET bnet/ActiveFilteredMatchFace?companyId=&enrollmentYear=&courseId= (names only) + Course
          and Academic-Year filter pickers (Courses from bnet/Courses; default courseId=0, year 2024),
          merged with local studentimages photos by studentId. 404 "No Filtered Match Faces found" is
          the normal empty state (company 1 has no active server matches yet).
        * WorkerController now enforces a single worker via a pid-file (kills orphans) — multiple
          concurrent dedup loops had been racing and corrupting face-chain creation while OC kept
          working.
      FACE VARIANTS: only T12 (sFace) is in the published libBprFace. T14 (aFace) / T15 (mFace=MagFace)
      need the EVAL build bpr.cpp/build/cmake/eval/face-variants/libBprFace.dylib + models
      bpr.m10007.onnx / bpr.m10008.onnx (research-licensed, not shippable). DedupWorker now falls back
      to T12 if the selected variant can't init (a persisted t14 selection had silently killed the
      dedup worker while detection/OC kept running).
      LOCAL DEV (pat-m4p): docker bnet-mysql root/bnetdev :3399 db cqi_bnet; runtime dir
      /Users/bnprs/BPR/Datasets/bpr-runtime; published worker /Users/bnprs/BPR/Datasets/bnet-worker/
      (+ libBprFace.dylib); App launched from the built .app with BNET_* env.
      PENDING: rotate shared verify token + Keycloak client secret + $GITLAB_PAT; provision
      BNET_VERIFY_TOKEN for the packaged app; decide whether to commit the App.config host fix.
