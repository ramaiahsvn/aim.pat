    type: project
    content: >-
      bNET V2 STATUS 2026-08-03 — updates mem-006; RESOLVES the "add itpgateway DNS / TLS bypass"
      item from mem-005/006. THE CORRECT API HOST IS https://smartpresence-api-uat.itpgateway.com/
      — NOT the raw utms-smartpresence-api-alb-429499752.eu-central-1.elb.amazonaws.com. The ALB cert
      is CN=*.itpgateway.com, so the raw ELB name fails TLS ("no alternative certificate subject name
      matches"); Route53 (itp acct, zone itpgateway.com) aliases smartpresence-api-uat -> that ALB.
      With the real host, sync (15/15 tables) and 1:N verify both work over PROPER TLS — the
      App.config Api.BypassCertificateValidation=true was masking a WRONG BASE URL, not a bad cert;
      do not ship the bypass. (v1 App.config in bpr1008.bnet.main/_BprFws/App.config was locally
      edited to the correct host; left UNCOMMITTED pending user decision.)
      DEPLOY: the API is built+deployed by GitLab project 34 (bpr1004.utms.api.bnet.smartpresence)
      pipeline on branch uat_temp -> ECS service utms-smartpresence-api, cluster utms-cluster, AWS
      acct 819144294008, eu-central-1 (Frankfurt). Container logs CloudWatch /ecs/utms-smartpresence-api
      (Spring Boot; GlobalExceptionHandler logs a traceId). Reach it with AWS_PROFILE=itp.
      AUTH SPLIT (non-obvious, cost hours): sync/CRUD endpoints are /bnet/* with KEYCLOAK
      client_credentials (client bnet-sync-service). But verify1toNFace is at /apis/bnet/verify1toNFace
      (the /apis prefix — its controller is @RequestMapping("/apis"), every other controller is /bnet),
      and it authenticates with a SHARED BEARER TOKEN, not Keycloak (server gatewayService.isTokenValid).
      v2 reads that token from env BNET_VERIFY_TOKEN, NEVER hardcoded. The token value is a LEAKED
      credential in v1 git (bNet_SyncService.cs) — value NOT recorded here; ROTATE it. End-to-end
