      /Users/bnprs/BPR/GitRepos2/BPR1004_uTms/bpr1004.utms.api.bnet.smartpresence. The group folder
      convention is GitRepos2/<GROUP>_<Name>/ with each repo keeping its full GitLab name.
      THE REPO HAS TWO STACKS AND master IS THE DEAD ONE. It migrated .NET -> Java, and `master`
      (last touched 2026-03-29) was left on .NET, so a default clone lands on the old code and
