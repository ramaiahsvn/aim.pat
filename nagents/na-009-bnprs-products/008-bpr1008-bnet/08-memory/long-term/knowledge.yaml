      THE MODEL WAS NEVER A BLOCKER (mem-027 (B) was wrong): bpr.m10007.onnx (260MB AdaFace T14)
      IS BUNDLED inside the nativesdk-bpridengine 2.24.904 jar's models/ dir - the project-230
      maven registry jar is byte-identical to the local full jar (304,780,754 bytes), so CI bakes
