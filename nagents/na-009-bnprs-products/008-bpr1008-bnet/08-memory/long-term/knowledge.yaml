  - id: mem-001
    type: project_context
    content: >-
      UTMS (BPR1004) IS AN UMBRELLA PRODUCT, and repo names encode that: SmartPresence is a bNet
      feature that draws on UTMS capabilities, so its API lives under BPR1004 as
      bpr1004.utms.api.bnet.smartpresence. The BPR1004 prefix is the UMBRELLA it builds on, not the
      owning product — bNet still owns the feature. Read <group>.<umbrella>.<kind>.<product>.<feature>
      rather than assuming the group prefix names the owner; other UTMS-assisted products will
      follow the same shape. Repo
      gitlab.bnprs.ai/BPR1004/bpr1004.utms.api.bnet.smartpresence (project id 34), cloned to
      /Users/bnprs/BPR/GitRepos2/BPR1004_uTms/bpr1004.utms.api.bnet.smartpresence. The group folder
      convention is GitRepos2/<GROUP>_<Name>/ with each repo keeping its full GitLab name.
      THE REPO HAS TWO STACKS AND master IS THE DEAD ONE. It migrated .NET -> Java, and `master`
      (last touched 2026-03-29) was left on .NET, so a default clone lands on the old code and
      shows no pom.xml. The live Java line is bp_dev; ai_dev and bp_dev_dotnet were .NET.
      Check `git ls-tree -r --name-only <branch> | grep pom.xml` before concluding anything about
      this repo from a single branch.
    created_at: "2026-08-01"
    last_accessed: "2026-08-01"
