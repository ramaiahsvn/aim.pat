  - id: mem-018
    type: technical_knowledge
    content: >-
      2026-08-11 AWS/CLI gotchas learned while doing the cost sweep (add to the CE gotchas in [[mem-005]]
      and [[mem-007]]):
      (1) BILLING REGION CODE APS5 = ap-south-2 (Hyderabad), NOT ap-southeast-5. I guessed ap-southeast-5
      first and every call failed with AuthFailure / InvalidClientTokenId, which looks like a credentials
      problem but is really "that opt-in region is not enabled". To map a billing prefix to a real region,
      group Cost Explorer by DIMENSION=REGION instead of guessing from the usage-type prefix.
      (2) macOS has NO `timeout` command — `timeout 90 aws ...` fails with "command not found". Use the
      tool's own timeout, or gtimeout from coreutils.
      (3) zsh does NOT word-split unquoted variables (already in global memory, but it bit me in a NEW way):
      `tgs=$(aws ... --query 'TargetGroups[].TargetGroupArn' --output text); for tg in $tgs` passes the whole
      tab-separated list as ONE argument, so describe-target-health throws "is not a valid target group ARN"
      and the loop silently reports healthy=0/0 for every multi-target-group load balancer. That produced a
      WRONG first answer (7 LBs looked idle that were actually healthy). Iterate with
      `... --output text | while IFS=$'\t' read -r ...` instead, and treat a ValidationError inside a loop as
      a broken loop, not a broken resource.
      (4) To tell whether a stopped Aurora cluster is being auto-restarted by the 7-day rule, use
      `aws rds describe-events --source-type db-cluster --source-identifier <id> --duration <minutes>`;
      the message is "DB cluster is being started due to it exceeding the maximum allowed time being stopped".
      (5) Aurora storage tier is visible as `DBClusters[].StorageType` — `aurora-iopt1` = IO-Optimized
      (~$0.225/GB-mo), null/None = standard (~$0.10/GB-mo). Cluster volume size is NOT in the API
      (AllocatedStorage reads 1); get it from the CloudWatch metric AWS/RDS VolumeBytesUsed with
      Name=DBClusterIdentifier.
      (6) A VPC interface endpoint is billed per-AZ, so cost = endpoints x subnets x $0.01/hr. The honest
      test of whether endpoints earn their keep is comparing the CE `*-VpcEndpoint-Hours` line against the
      `*-VpcEndpoint-Bytes` line — hours with no bytes means idle infrastructure.
      (7) RDS automated snapshots are named `rds:<cluster>-<timestamp>` and are DELETED WITH THE CLUSTER.
      Only a manual snapshot survives a cluster delete.
    created_at: "2026-08-11"
    confidence: 1.0
    source: "session-2026-08-11"
    tags: [gotchas, aws-cli, ce-region-codes, aps5-ap-south-2, macos-no-timeout, zsh-word-split,
           target-health-loop, aurora-auto-restart, aurora-iopt1, volumebytesused, vpc-endpoint-hours-vs-bytes,
           automated-vs-manual-snapshot]

