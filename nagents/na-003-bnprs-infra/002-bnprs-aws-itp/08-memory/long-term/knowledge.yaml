  - id: mem-015
    type: incident_learning
    content: >-
      2026-08-05 vpn-mgate-prod-temp DOWN AGAIN — but a COMPLETELY DIFFERENT fault from [[mem-014]],
      and the mem-014 rule ("VPN down here is almost always the openvpn local password") LED THE WRONG
      WAY. Nobody could reach it, including murali. Root cause: the box never finished booting — it sat
      in systemd EMERGENCY MODE at "Press Enter for maintenance", so sshd/ssm-agent/openvpnas never
      started. Console showed: `FAT-fs (nvme0n1p15): IO charset iso8859-1 not found` -> `Failed to mount
      boot-efi.mount` -> `Dependency failed for local-fs.target` -> `emergency.target`. Everything else
      was a SYMPTOM of that: instance status check impaired, SSM offline, and cloud-init's 240s of IMDS
      retries ending in "IMDS's HTTP endpoint is probably disabled" — which is a LIE, MetadataOptions
      showed HttpEndpoint=enabled; cloud-init just had no network because emergency mode never
      configured it. Do not chase IMDS on that message alone.
      REAL ROOT CAUSE (proven, not guessed): kernel 6.17.0-1012-aws was installed INCOMPLETELY back in
      April — its /lib/modules/6.17.0-1012-aws had the .ko.zst files but NO modules.dep / modules.dep.bin
      (depmod never ran) and NO initramfs in /boot. Without modules.dep, modprobe cannot find
      nls_iso8859-1, so the vfat mount of the ESP is rejected. It stayed harmless while the box ran 1010.
      Then on 2026-08-05 06:07 UTC `unattended-upgrade` REMOVED linux-image/linux-modules-6.17.0-1007-aws,
      which regenerated GRUB; with GRUB_DEFAULT=0 the newest entry (the broken 1012) became default, and
      murali's reboots at 12:32/12:46/12:53 IST + stop/start at 13:01 IST booted straight into it.
      The apt trigger is visible in /var/log/apt/history.log; the demotion is visible as
      /boot/vmlinuz.old -> vmlinuz-6.17.0-1012-aws dated Aug 5 06:07.
      FIX APPLIED (root vol vol-020e5d691b0217df8 detached, repaired on a throwaway t3.micro helper, put
      back): `chroot depmod -a 6.17.0-1012-aws` (rebuilt modules.dep, 90KB, nls_iso8859-1 now indexed),
      `update-initramfs -c -k 6.17.0-1012-aws`, `update-grub`, plus `nofail` added to the /boot/efi line
      in /etc/fstab (backup at /etc/fstab.bak-20260805) so a future ESP failure degrades instead of
      dropping the box into an emergency shell. Pre-repair snapshot snap-0a66c1c9499f0146a.
      VERIFIED FROM OUTSIDE, not from exit codes: status checks 2/2, SSM Online, booted 6.17.0-1012-aws,
      /boot/efi actually mounted with iocharset=iso8859-1 (proving the module now loads), openvpnas
      active, nft DNAT tcp->10.30.0.88:914 / udp->10.30.0.88:916 present, ip_forward=1, and from the
      internet TCP 443 + 943 both OPEN returning HTTP 200 on 3.149.123.56.
      RULES: (1) For this box, TRIAGE BOOT STATE FIRST — get-console-output and the instance status
      check — and only apply the mem-014 password rule once the OS is confirmed up. (2) An EBS volume
      from a MARKETPLACE AMI (OpenVPN AS is one) CANNOT be attached to a RUNNING instance —
      "IncorrectInstanceState ... with Marketplace codes"; the target must be stopped first, so rescue
      work needs a stoppable/throwaway helper, not a live box. (3) Beware LABEL COLLISION during rescue:
      both the helper and the target have partitions labelled UEFI and BOOT, so the helper auto-mounted
      the TARGET's /boot and /boot/efi — unmount those before chrooting. (4) `chroot ... modprobe` uses
      the HELPER's running kernel unless you pass `-S <kernelver>`; a FATAL "not found in directory
      /lib/modules/<helper-kernel>" is a bad test, not a bad fix. (5) iocharset=utf8 would NOT have been
      a workaround — nls_utf8 is equally a module, so it fails the same way when modules.dep is missing;
      `nofail` is the correct hardening.
      STILL OPEN: unattended-upgrades is ENABLED on this VPN appliance and will remove/promote kernels
      again unannounced — consider pinning linux-* or disabling unattended kernel upgrades here; and
      verify 6.17.0-1010-aws is complete (it has modules.dep + initramfs) so there is a working fallback.
      Also the pre-existing cloud-final.service failure from [[mem-014]] is still present and still
      harmless (systemd reports "degraded" for that one unit only).
    created_at: "2026-08-05"
    last_accessed: "2026-08-05"
    access_count: 1
    confidence: 1.0
