  - id: mem-018
    type: incident_learning
    content: >-
      2026-07-30 TEARDOWN PLAYBOOK for the mGate stacks — four destroy blockers, all of which fail
      the destroy MID-RUN (leaving a half-torn stack) rather than at plan time, so clear them ALL
      up front. (1) Aurora deletion_protection = true -> must be flipped to false and APPLIED in a
      separate prior apply; destroy alone cannot do it. (2) skip_final_snapshot = false -> set true
      (take your own manual snapshot first instead — safer and you control the name).
      (3) S3 force_destroy = false on platform/prod alb-logs.tf + cloudtrail.tf -> set true, else
      BucketNotEmpty. (4) **NEW, not in the June/mem-012 Frankfurt run**: the ALBs carry their own
      enable_deletion_protection = true (services/{callbackapplication,portalbackend,maingateway}/
      prod, via modules/alb) -> terraform destroy dies with
      "OperationNotPermitted: Load balancer cannot be deleted because deletion protection is
      enabled". Fastest fix mid-teardown is the CLI on every ALB:
      `aws elbv2 modify-load-balancer-attributes --load-balancer-arn <arn> --attributes
      Key=deletion_protection.enabled,Value=false` then re-run the destroy (terraform is idempotent
      here — it just resumes). ORDER: services stacks first, then platform (platform owns the VPC/
      cluster the services sit in). ALB-backed stacks take 5-10 min each (ENI detach), the rest ~30s.
      Make the three platform edits WORKING-TREE ONLY and `git checkout --` them after, so the repo
      stays live-ready and the next apply doesn't ship deletion_protection=false to prod.
    created_at: "2026-07-30"
