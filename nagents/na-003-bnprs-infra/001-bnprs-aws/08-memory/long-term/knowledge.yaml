  - id: mem-010
    type: incident_learning
    content: >-
      2026-07-25: cPerso Windows build runner (i-03563f4ad6ca9abf0, patwin-runner /
      mces2-win-build-runner) was found RUNNING 24/7 idle since 2026-07-17 (CPU ~0.13%),
      triggering an AWS Cost Anomaly (FINAL impact $280.58 over 8 days, max $37.07/day, APS5
      m5.4xlarge — the $214 seen live on 2026-07-25 kept rising as billing data settled; CE
      recalculates an anomaly up to 3x daily, so never record the first number as final). ROOT CAUSE:
      the auto-stop had been DISABLED in TWO places — (1) EventBridge rule
      mces2-win-runner-idle-stop was DISABLED, and (2) Lambda win-runner-control had
      ReservedConcurrentExecutions=0 (throttles ALL invokes incl. the rule's -> manual invoke
      returns TooManyRequestsException "Rate Exceeded"). ROLLBACK (both required): `aws events
      enable-rule --name mces2-win-runner-idle-stop` + `aws lambda delete-function-concurrency
      --function-name win-runner-control`. Verified: idle-stop invoke returned 200
      {"result":"idle-stop after 10714m"} and the box stopped. LESSON: reserved-concurrency=0 is
      a silent Lambda kill-switch — check it (not just the rule State) when a scheduled Lambda
