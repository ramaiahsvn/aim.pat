# Tasks — bnprs.in subdomain standard and provisioning
# Plan of record: 07-axon-terminals/deliverables/2026-08-13-subdomain-review-and-plan.md
# Registry:       01-dendrite/connectors/subdomain-registry.yaml

tasks:

  # ---- PHASE 0 — decisions. No AWS changes. These gate everything else. ----

  - id: "task-001"
    subject: "Identify the AWS account that holds the bnprs.in apex zone"
    description: >-
      RESOLVED 2026-08-13: the bnprs account, 891963159778 (profile bnprs), zone
      Z04234212M3SJ07Y70SGQ — public, 24 records. Verified authoritative: the zone's
      DelegationSet matches all four NS that public DNS returns for bnprs.in, so it is the
      live zone and not a duplicate. User directive confirms records are created in
      bnprs-aws, NOT bnprs-aws-itp. Closes decisions.d7 and unblocks every record.
    status: completed
    completed_at: "2026-08-13"
    priority: critical
    created_at: "2026-08-13"
    estimated_steps: 3
    tags: [decision-d7, RESOLVED, zone-in-bnprs-account, Z04234212M3SJ07Y70SGQ, authoritative-verified]

  - id: "task-012"
    subject: "Decide how bnprs-account records reach ITP-account load balancers (d9)"
    description: >-
      New blocker that only surfaced once the zone was located. The zone is in
      891963159778 (bnprs) but the targets for utms / bnet / mpos are utms-shared-alb in
      819144294008 (ITP), eu-central-1. Every record currently in this zone aliases a
      SAME-account ap-south-2 ALB, so cross-account is untrodden ground here.
      Options: (a) CNAME to the ALB's amazonaws.com name — simplest, cross-account safe,
      fine for subdomains; (b) Route53 ALIAS to a cross-account ELB — supported but
      CLI/API only, needs the ELB's canonical hosted-zone ID; (c) move the services into
      the bnprs account so DNS and targets co-locate.
      NOTE the *.bnprs.in cert lives in the ITP account attached to the ITP ALB, which is
      correct for (a) and (b) since TLS terminates there. Option (c) needs a NEW
      *.bnprs.in cert issued in the bnprs account.
    status: pending
    priority: critical
    created_at: "2026-08-13"
    blocks: ["task-007"]
    estimated_steps: 3
    tags: [decision-d9, cross-account, alias-vs-cname, cert-stays-with-the-alb]

  - id: "task-013"
    subject: "Settle whether 'Sprints' is ours or Zoho's before creating bna-sprints-*"
    description: >-
      The NAME CLASH IS GONE — projects.bnprs.in and people.bnprs.in were deleted
      2026-08-13 (see registry `retired:`), so both names are free. Downgraded from
      blocking to open, because the identity question survives the deletion: is BNA's
      "Sprints" our own service or Zoho Sprints? The live ITP host the sub-project
      supposedly replaces is projects.uat.itpgateway.com, and Zoho sells both Projects and
      Sprints. Pointing bna-sprints-portal-* at something we do not host would be wrong,
      so answer this before creating those three records — but it no longer blocks the
      erp/chat halves of task-011.
    status: pending
    priority: medium
    created_at: "2026-08-13"
    estimated_steps: 2
    tags: [projects-vs-sprints, zoho, clash-resolved-by-deletion, identity-still-open]

  - id: "task-014"
    subject: "mGate: keep the live hierarchical names, or migrate to the flat scheme?"
    description: >-
      mgate.bnprs.in, api.mgate.bnprs.in and portal-api.mgate.bnprs.in are LIVE in this
      zone using <component>.<product>.bnprs.in, pointing at ap-south-2 ALBs in the bnprs
      account plus a CloudFront distribution. Adding the table's mgate-api-uat /
      mgate-portal would give one product two schemes in one zone. Same shape of question
      as bRuID (d5). Feeds d1 — and note this is the third live hierarchical precedent,
      the first one inside the target zone itself.
    status: pending
    priority: medium
    created_at: "2026-08-13"
    estimated_steps: 2
    tags: [mgate, scheme-collision, feeds-d1, keep-or-migrate]

  - id: "task-002"
    subject: "Ratify flat vs hierarchical environment labels"
    description: >-
      Flat <product>-<component>-<env>.bnprs.in shares one *.bnprs.in key across sandbox,
      UAT and production and precludes per-env delegation. Recommendation is
      <product>-<component>.<env>.bnprs.in with delegated uat./sandbox. zones. Cost of
      switching today is 5 ALB rules and 0 DNS records — this is the cheapest it will ever be.
    status: pending
    priority: critical
    created_at: "2026-08-13"
    blocks: ["task-006", "task-007", "task-008"]
    estimated_steps: 2
    tags: [decision-d1, scheme, certificate-boundary]

  - id: "task-003"
    subject: "Decide whether auth migrates to bnprs.in (d8)"
    description: >-
      Keycloak (accounts-uat / accounts / utms-auth .itpgateway.com) has no name in the
      table at all; leaving it behind keeps both apexes alive permanently and spans every
      OIDC issuer and CORS allow-list across two domains. Also decide kc-temp's fate —
      the name says temporary, so confirm whether it is retired rather than migrated.
      d3 (SmartPresence) is CLOSED — own host, adopted into the table 2026-08-13.
    status: pending
    priority: high
    created_at: "2026-08-13"
    blocks: ["task-007"]
    estimated_steps: 2
    tags: [decision-d8, auth, kc-temp, d3-closed]

  - id: "task-004"
    subject: "Settle the remaining naming decisions (d4, d5, d6)"
    description: >-
      d4 explicit -prod token or bare name (config policy); d5 is bRuID a family or is
      wGate the product, and rengine/risk-engine/risk (12 names); d6 which agent owns each
      AandhiPe surface (18 names). d5 needs na-009/007 bpr1007-wgate.
      d2 is CLOSED — the nAgent -> bna rename made the case and plural questions moot.
    status: pending
    priority: medium
    created_at: "2026-08-13"
    estimated_steps: 3
    tags: [decision-d4, decision-d5, decision-d6, d2-closed]

  - id: "task-011"
    subject: "Re-shape the ERP / Sprints / Chat hostnames onto the BNA sub-project pattern"
    description: >-
      A 1:1 subdomain migration, not a collapse (sub-projects use NAME notation as of the
      2026-08-13 reversal). Five live hosts on nagents-uat-alb move to the four-segment
      pattern: erp.uat -> bna-erp-portal-uat, erp-api.uat -> bna-erp-api-uat,
      projects.uat -> bna-sprints-portal-uat, projects-api.uat -> bna-sprints-api-uat,
      chat-api.uat -> bna-chat-api-uat (all .bnprs.in, replacing .uat.itpgateway.com).
      NO app rework is needed — each sub-project keeps serving from its own host root, so
      base href, router basename and asset paths are untouched. Each cutover is therefore
      INDEPENDENT of the others and can be done one at a time.
      THE REAL WORK IS AUTH CONFIG, NOT DNS: each new hostname is a new browser origin, so
      each needs its own OIDC redirect_uri and CORS allow-list entry registered before
      cutover, plus its own ALB host rule. Covered by the existing *.bnprs.in wildcard —
      no new certificate.
      CONFIRM FIRST: "projects" (live) is being treated as "sprints" (the instruction). If
      they are not the same thing, one of them has no name in the standard.
      Sequence per host: register origin in Keycloak + CORS -> ALB host rule -> DNS record
      -> verify end to end -> cut over -> retire the old subdomain (record + target in one
      change), marking it retired in the registry.
      bna-chat-portal-* is reserved by the pattern but has NO live equivalent — do not
      create that record until something exists to point it at.
    status: pending
    priority: medium
    created_at: "2026-08-13"
    blocked_by: ["task-001", "task-002"]
    estimated_steps: 12
    tags: [subproject-hostnames, bna, one-to-one-migration, no-app-rework,
           auth-config-is-the-work, new-origin-per-host, projects-vs-sprints-unconfirmed]

  # ---- PHASE 1 — restore service ----

