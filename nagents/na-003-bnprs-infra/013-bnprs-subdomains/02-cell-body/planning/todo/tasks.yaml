    estimated_steps: 3
    tags: [live-outage, bnet-v2, option-a, needs-approval, reversible]

  # ---- PHASE 2 — certificates ----

  - id: "task-006"
    subject: "Verify the second SNI cert on utms-shared-alb, attach *.bnprs.in if missing"
    description: >-
      RESOLVED 2026-08-13, favourably: cert 210edefa-cbda-4971-80cd-4a9a4e0280ce IS
      *.bnprs.in — ISSUED, expires 2027-02-26, InUseBy 1 — attached as the non-default SNI
      cert on BOTH the :443 and :8443 listeners (default remains *.itpgateway.com). So TLS
      is already prepared: the four waiting .bnprs.in rules will serve a valid certificate
      the moment DNS exists, and DNS is now the only thing missing. No attach needed.
      CARRIED FORWARD: *.bnprs.in covers SINGLE-LABEL names only, so if task-002 chooses
