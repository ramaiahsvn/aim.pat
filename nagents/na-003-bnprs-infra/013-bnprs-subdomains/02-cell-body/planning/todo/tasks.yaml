      now tracked as part of task-002's cost, not here. Also see task-012: this cert lives
      in the ITP account, which is correct while the ALB does too.
    status: completed
    completed_at: "2026-08-13"
    priority: high
    created_at: "2026-08-13"
    estimated_steps: 3
    tags: [acm, sni, RESOLVED, wildcard-bnprs-in-confirmed, tls-ready, dns-is-the-only-gap,
           single-label-only, expires-2027-02-26]

  # ---- PHASE 3+ — provisioning ----

