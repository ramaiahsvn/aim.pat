  - id: mem-006
    type: technical_knowledge
    content: >-
      GAPS IN THE TABLE ARE THE DANGEROUS PART, NOT THE NAMES IT CONTAINS. Services that exist,
      serve traffic, and have NO name in the standard:
        * KEYCLOAK/AUTH (accounts-uat., accounts., utms-auth..itpgateway.com) — shared by every
          product. If products move to bnprs.in and auth does not, BOTH apexes stay alive forever
          and every OIDC issuer, redirect_uri and CORS allow-list spans two domains. This is the
          same split-brain that broke bNet. HIGHEST-priority gap.
        * SMARTPRESENCE API — has an ALB rule (bnet-smartpresence-api-uat.bnprs.in) but the table
          only allows bnet-api-uat. This gap is the live bNet v2 outage.
        * bengine/bPassEngine — named THREE ways (bengine.sandbox.bruid, uat-bpassengine.bruid,
          ALB wgate-uat-bengine). Probably bRuID Pass's engine; NOT confirmed.
        * tms/btms — tms-api-uat.bnprs.in rule exists, tms.itpgateway.com live. Distinct product
          or the old name for uTMS?
        * NLB/LAYER-4 ENDPOINTS (utms-emqx-nlb, utms-rsi-nlb, nagents-uat-livekit-nlb, tms-emqx,
          tms-webrtc): host-header routing DOES NOT EXIST at layer 4, so each needs its own DNS
          name pointing at its own load balancer — they cannot be folded behind a shared ALB rule
          like the APIs, and the -api/-portal vocabulary has no slot for them.
      ALSO: rEngine is named three ways (table "rengine", ALB "wgate-uat-risk-engine" which is
      INTERNAL, live DNS "risk"), and the table makes ACS/wGate/rEngine/Pass sibling products
      while every ALB name (wgate-uat-*) treats them as components OF wGate.
      RULE: reserve the PATTERN centrally, create the RECORD only when there is a live target —
      provisioning names ahead of services is what produced both drift states found here.
    created_at: "2026-08-13"
    last_accessed: "2026-08-13"
    access_count: 1
    confidence: 1.0
    source: "session-2026-08-13"
    tags: [auth-is-the-biggest-gap, smartpresence-unnamed, bengine-named-three-ways,
           nlb-needs-its-own-name, no-host-routing-at-l4, rengine-three-names,
           bruid-family-or-wgate-components, provision-on-first-deploy]

  - id: mem-007
    type: technical_knowledge
    content: >-
      PRODUCTION IS THE NAME YOU GET BY ACCIDENT, and mixed case is a real bug source.
      In the proposed scheme production is the BARE <product>-<component>.bnprs.in — the value
      produced when the env token is ABSENT. Any template like ${product}-api-${env} with env
      unset, empty or stripped lands on PRODUCTION. This estate is repeatedly bitten by exactly
      that shape (BNET_COMPANY_ID, BNET_RUNTIME_DIR and a missing ONNX model each silently
      resolved to a default and presented as an unrelated failure), and here the default carries
      the largest blast radius. MITIGATION: never template an environment into a hostname —
      enumerate all three explicitly in config.
      nAgent-api-uat.bnprs.in IS THE ONLY MIXED-CASE ENTRY in the table (mGate was correctly
      lowercased to mgate). DNS resolution and ALB host-header matching are both
      case-INSENSITIVE, so it appears to work; the damage lands where the literal string is
      compared case-SENSITIVELY — OIDC redirect_uri (exact match), CORS origin checks in most
      frameworks, cert SANs, hand-written config. Use lowercase, and settle singular vs plural:
      the table says nAgent, the infra says nagents (nagents-uat-alb, nagents-uat-livekit-nlb).
    created_at: "2026-08-13"
    last_accessed: "2026-08-13"
    access_count: 1
    confidence: 1.0
    source: "session-2026-08-13"
    tags: [prod-is-the-accidental-default, never-template-env-into-a-hostname,
           mixed-case-breaks-oidc-and-cors, dns-is-case-insensitive-configs-are-not,
           nagent-vs-nagents]

  - id: mem-008
    type: project_context
    content: >-
      SUB-PROJECTS GET NAMES, NOT PATHS, and the sub-project slot sits BETWEEN product and
      component: <product>-<subproject>-<component>-<env>.bnprs.in, production
      <product>-<subproject>-<component>.bnprs.in. So bna-sprints-portal-uat.bnprs.in,
      bna-erp-api-uat.bnprs.in, bna-chat-api-sandbox.bnprs.in.
      HISTORY, because it matters for reading older notes: earlier the SAME DAY (2026-08-13) the
      user first specified PATHS (bna-portal-uat.bnprs.in/sprints) and then reversed it to name
      notation. Nothing was provisioned in between, so the reversal cost nothing. Any note or
      commit saying "sub-projects are paths" predates the reversal and is WRONG NOW.
      THE REVERSAL MADE THE STANDARD SELF-CONSISTENT — this is the real point. There is now ONE
      rule for every addressable thing, <product>[-<subproject>]-<component>[-<env>], identical
      in shape to bnet-smartpresence-api-uat.bnprs.in. The host-vs-path discriminator was DELETED
      from the registry; it existed only to decide which things got hostnames, and it had to be
      flagged as inferred-not-stated. Nothing is inferred now.
      WHAT NAMES BUY: (1) no base-path rework — each sub-project serves from the ROOT of its own
      host, so base href, router basename and asset paths stay '/', which removes the
      blank-page-no-error failure mode AND means an app that cannot be rebased is no longer a
      blocker; (2) REAL isolation — a distinct hostname is a distinct browser ORIGIN, so cookies,
      localStorage and sessionStorage do not cross, unlike cookie Path= which is only advisory.
      WHAT THEY COST, and this is where the work actually lands: every sub-project origin must be
      registered SEPARATELY — its own OIDC redirect_uri, CORS allow-list entry, ALB host rule and
      DNS record. BNA alone is 3 subprojects x 2 components x 3 envs = 18 hostnames where paths
      needed 2. The bill is paid in AUTH CONFIG, not DNS. No new cert though: sub-projects are
      single labels under the apex, so *.bnprs.in already covers them.
      SAME SESSION, TWO MORE DECISIONS THAT STILL STAND: nAgent RENAMED to bna (closes d2 — no
      capital, no plural, aligns with na-010-bna-platform; note infra stays nagents-*, so DNS and
      infra names diverge deliberately), and bnet-smartpresence-api-<env>.bnprs.in adopted into
      the table across all 3 envs (closes d3).
      UNCONFIRMED: "projects" (live: projects.uat / projects-api.uat.itpgateway.com) is being
      treated as "sprints" (the instruction). If they are not the same thing, one has no name.
    created_at: "2026-08-13"
    last_accessed: "2026-08-13"
    access_count: 1
    confidence: 1.0
    source: "session-2026-08-13"
