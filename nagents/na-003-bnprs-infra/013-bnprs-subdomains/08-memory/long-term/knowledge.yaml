  - id: mem-002
    type: technical_knowledge
    content: >-
      THE NODATA SIGNATURE — A ROUTE53 ALIAS TO A DELETED ELB LOOKS HEALTHY IN THE API AND
      RESOLVES TO NOTHING. This is what broke bNet v2 on 2026-08-13.
      smartpresence-api-uat.itpgateway.com still lists in list-resource-record-sets, aliased to
      utms-smartpresence-api-alb-429499752.eu-central-1.elb.amazonaws.com — but that ALB HAS BEEN
      DELETED, so the authoritative nameserver answers "status: NOERROR, ANSWER: 0" and the name
      resolves to nothing. Client-side it presents as "nodename nor servname provided, or not
      known", i.e. it reads like a local DNS problem, not a deleted load balancer.
      DIAGNOSTIC RULE: always compare list-resource-record-sets against a real dig of the same
      name, and query the DELEGATED nameserver directly (dig @ns-190.awsdns-23.com <host>) rather
      than trusting the resolver. Disagreement between the two means the alias target is gone.
      A control query matters: accounts-uat.itpgateway.com is an alias in the SAME zone and
      answers fine, which proves the zone and delegation are healthy and isolates the fault to
      one record's target.
      THE STANDING RULE THIS PRODUCES: a record and its target are created and destroyed in the
      SAME change. For ALB aliases the takeover risk is low (ELB names are not freely
      re-claimable); for S3/CloudFront/Beanstalk targets the identical pattern is a real
      subdomain-takeover vector.
    created_at: "2026-08-13"
    last_accessed: "2026-08-13"
    access_count: 1
    confidence: 1.0
    source: "session-2026-08-13"
    tags: [nodata-signature, dangling-alias, deleted-alb, dig-the-authoritative-ns,
           api-shows-healthy-record, use-a-control-query, record-and-target-are-one-change]

  - id: mem-003
    type: technical_knowledge
    content: >-
      FLAT NAMING PUTS SANDBOX, UAT AND PRODUCTION IN ONE CERTIFICATE — the main objection to the
      proposed <product>-<component>-<env>.bnprs.in scheme. Every name is a single label under
      the apex, so ONE wildcard (*.bnprs.in, already ISSUED in acct 819144294008) covers all three
      environments: one private key spanning every environment, so a sandbox compromise yields a
      cert valid for production, and no per-environment zone exists to delegate to a separate
      account or WAF.
      A WILDCARD COVERS ONE LABEL ONLY: *.bnprs.in does NOT cover api.uat.bnprs.in. That single
      fact is the whole flat-vs-hierarchical argument.
      THE ORG ALREADY RUNS HIERARCHICAL, TWICE — the *.uat.itpgateway.com cert with
      projects-api.uat.itpgateway.com on nagents-uat-alb, and the DELEGATED bruid.bnprs.in zone
      (Z0491996155ALJADE0VR8, in the itp account) with its own *.bruid.bnprs.in cert. So the flat
      table contradicts live internal precedent rather than establishing a first convention.
      RECOMMENDED: keep the readable product-component prefix, move env to its own label —
      bnet-api.uat.bnprs.in, prod bnet-api.bnprs.in — and delegate uat./sandbox. as separate zones
      with their own wildcards, so a non-prod key can never sign a prod hostname.
      ACM in eu-central-1 holds: *.bnprs.in, *.bruid.bnprs.in, uat-acs.bruid.bnprs.in,
      *.itpgateway.com, *.uat.itpgateway.com, *.itpgateway.link.
    created_at: "2026-08-13"
    last_accessed: "2026-08-13"
    access_count: 1
    confidence: 1.0
    source: "session-2026-08-13"
    tags: [wildcard-covers-one-label, flat-shares-a-key-across-envs, hierarchical-precedent-exists,
           bruid-zone-is-delegated, acm-inventory, per-env-delegation]

  - id: mem-004
    type: technical_knowledge
    content: >-
      ACM "ISSUED" SAYS NOTHING ABOUT WHAT A LISTENER PRESENTS — check the listener, not the
      certificate list. On utms-shared-alb (eu-central-1) the DEFAULT cert on :443 and :8443 is
      *.itpgateway.com, while every host-header rule on it is a .bnprs.in name. describe-listeners
      shows only the default; a second SNI cert is attached (210edefa-cbda-4971-80cd-4a9a4e0280ce)
      whose identity is UNVERIFIED as of 2026-08-13 — use describe-listener-certificates, which
      lists all of them with IsDefault.
      CONSEQUENCE: if that second cert is not *.bnprs.in, then the moment DNS is added for any of
      the five waiting rules, TLS fails — the SAME class of error as bNet's original ALB mismatch,
      where the raw ELB name was addressed against a CN=*.itpgateway.com cert and
      Api.BypassCertificateValidation=true was used to paper over it. NEVER recommend disabling
      TLS verification to work around a naming mismatch; it hides a wrong hostname.
      VERIFY IN THIS ORDER or the answer is untrustworthy: dig -> dig @authoritative-ns ->
      HTTPS probe -> describe-target-health. A 4-step check, and skipping any step is how a name
      gets reported as working when it is not.
    created_at: "2026-08-13"
    last_accessed: "2026-08-13"
    access_count: 1
    confidence: 0.9
    source: "session-2026-08-13"
    tags: [issued-is-not-served, describe-listener-certificates, default-cert-is-itpgateway,
           second-sni-cert-unverified, never-bypass-tls, four-step-verification]

  - id: mem-005
