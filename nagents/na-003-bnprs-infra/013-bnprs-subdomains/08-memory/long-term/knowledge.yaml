        1. FLAT, proposed:      <product>-<component>-<env>.bnprs.in        (0 live)
        2. HIERARCHICAL, live:  <component>.<env>.itpgateway.com            (nagents-uat-alb:
           erp, erp-api, projects, projects-api, chat-api, kc-temp)
        3. HIERARCHICAL, live:  <component>.<env>.<product>.bnprs.in        (acs./bengine./
           risk..sandbox.bruid.bnprs.in) AND <env>-<component>.<product>.bnprs.in
           (uat-acs., uat-bpassengine..bruid.bnprs.in) — bRuID contradicts ITSELF
        4. FLAT PROD, live:     <product>-<component>.itpgateway.com        (utms-api, utms,
           accounts, utms-auth, btms-api, mini-apps on BPR-uTMS-LB us-east-2; tms-api, tms,
           tms-emqx, tms-webrtc on itptms-lb)
      REGIONS: eu-central-1 = UAT and newer work (utms-shared-alb fronts the APIs);
      us-east-2 = older production on itpgateway.com. ITP account 819144294008, profile itp.
      ZONE OWNERSHIP IS THE HARD BLOCKER: the bnprs.in APEX IS NOT IN THE ITP ACCOUNT. Only
      bruid.bnprs.in is delegated there. The apex is on AWS DNS (ns-569.awsdns-07.net,
