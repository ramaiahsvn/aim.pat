  - id: mem-009
    type: technical_knowledge
    content: >-
      A SaaS VANITY CNAME THAT RESOLVES IS NOT A WORKING ENDPOINT — CHECK THE CERTIFICATE IT
      SERVES. Found 2026-08-13 on projects.bnprs.in and people.bnprs.in (CNAMEs to
      projects.cs.zohohost.com / people.cs.zohohost.com). Both resolved and Zoho ANSWERED
      with a 302, so every cheap check said "working". But neither had a certificate for its
      own name — Zoho's shared front end presented OTHER TENANTS' certs:
      CN=projects.mysanitas.com for ours, and CN=hrportal.bulldog24x7.com for people. So a
      browser hit a cert error before any page rendered. Nobody had been using them.
      THE DIAGNOSTIC TELL for an unmapped Zoho custom domain: the redirect goes to
      accounts.zoho.com/signin with servicename=NULL and serviceurl set to the GENERIC
      product URL (projects.zoho.com). servicename=null means Zoho does not recognise the
      hostname as a mapped custom domain. The DNS side had been done and the SaaS side never
      was — a half-finished integration that looks live from the registrar's point of view.
      GENERAL RULE, and it is the same lesson as the dangling smartpresence ALIAS: an HTTP
      status proves something answered, not that YOUR hostname works. For any third-party
      SaaS vanity name, verify the served certificate's subject matches the name you asked
      for. openssl s_client -connect <h>:443 -servername <h> | openssl x509 -noout -subject.
      DELETING ZOHO RECORDS — WHAT NOT TO TOUCH: the zone's Zoho MAIL plumbing is in active
      use (MX mx.zoho.com, SPF include:zoho.com, DKIM, DMARC) and zb93244321.bnprs.in ->
      zmverify.zoho.com is the DOMAIN-VERIFICATION record underpinning it. Removing that
      could put domain ownership, and therefore mail, at risk. Vanity product CNAMEs are
      safe to remove; verification and mail records are not.
    created_at: "2026-08-13"
    last_accessed: "2026-08-13"
    access_count: 1
    confidence: 1.0
    source: "session-2026-08-13"
    tags: [resolves-is-not-working, check-the-served-cert, zoho-vanity-cname,
           other-tenants-cert, servicename-null-means-unmapped, dns-done-saas-not,
           never-delete-zmverify-or-mail-records, same-lesson-as-dangling-alias]

  - id: mem-010
    type: project
    content: >-
      SCHEME RATIFIED HIERARCHICAL 2026-08-13 — this supersedes the flat form in mem-001/003
      and in the source table. FINAL FORM:
      <product>[-<subproject>]-<component>.<env>.bnprs.in, production the BARE
      <product>[-<subproject>]-<component>.bnprs.in. So bnet-api.uat.bnprs.in,
      bna-sprints-portal.uat.bnprs.in, bnet-retail-api.uat.bnprs.in, prod bnet-api.bnprs.in.
      Only the 58 NON-PROD names changed in the rewrite (-uat. -> .uat., -sandbox. ->
      .sandbox.); production was always bare, so the whole prod column was already correct.
      ZONE: bnprs.in lives in the BNPRS account 891963159778, zone Z04234212M3SJ07Y70SGQ —
      NOT the ITP account (user directive; d7). The ALBs and certs are in ITP
      819144294008/eu-central-1, so DNS and targets are CROSS-ACCOUNT (d9 open: CNAME vs
      cross-account ALIAS vs relocating the services).
      THE TWO COSTS THIS DECISION CREATED, both now blocking work and neither optional:
      (1) *.bnprs.in MATCHES ONE LABEL ONLY, so it covers the production column and NOTHING
      else — *.uat.bnprs.in and *.sandbox.bnprs.in must be issued (in ITP, where TLS
      terminates, with validation records in the bnprs zone) and attached to the shared ALB
      listener BEFORE the first non-prod record, or the name resolves and fails TLS, which is
      bNet's original symptom reproduced exactly. (2) FOUR live ALB host-header rules still
      carry the SUPERSEDED FLAT names (utms-api-uat, bnet-api-uat, bnet-smartpresence-api-uat,
      aandhipe-mpos-api-uat .bnprs.in) and match nothing we now intend to publish — rewrite
      them while NO DNS points at them, when the change is free; afterwards it is a live
      cutover. The fifth, tms-api-uat, is TERRAFORM-MANAGED — change it in Terraform.
      WHAT HIERARCHICAL BUYS beyond the cert boundary: per-env NS delegation becomes possible
      (uat.bnprs.in / sandbox.bnprs.in as their own zones, per-env IAM/WAF/account), which the
      flat scheme foreclosed. Precedent: bruid.bnprs.in is already delegated to ITP.
      COUNT: 87 hostnames, 11 products, all `planned`, none resolving.
      API-ONLY, DELIBERATELY — do not "restore" the missing portal names as omissions:
      bnet/smartpresence, bnet/retail, and bruid-rengine (whose UI is served by the ACS
      portal, bruid-acs-portal.<env>, marked also_serves). A product need not own every
      component. NOTE the shared ACS portal re-merges two trust surfaces on purpose: one
      origin, one OIDC redirect_uri set and one CORS list, but it must permit BOTH
      bruid-acs-api.* and bruid-rengine-api.*, and a session there has authority over both —
      scope roles per service, not per origin. That rEngine shares the ACS portal is also
      EVIDENCE for d5 (ACS/rEngine look like one product with two APIs, matching the
      wgate-uat-acs / wgate-uat-risk-engine infra naming) — recorded, NOT acted on.
