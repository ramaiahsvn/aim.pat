  - id: mem-001
    type: project_context
    content: >-
      THE bnprs.in TABLE IS A PLAN, NOT A DEPLOYED STATE — 0 OF 66 NAMES RESOLVE (verified
      2026-08-13 by digging every one). What DOES exist is five host-header rules on
      utms-shared-alb (eu-central-1, acct 819144294008): utms-api-uat, bnet-api-uat,
      aandhipe-mpos-api-uat, bnet-smartpresence-api-uat, tms-api-uat — all .bnprs.in, all with
      NO DNS RECORD. So the migration started ahead of both the DNS and the standard, and two of
      those five names (smartpresence, tms) are not in the table at all.
      WHY THIS MATTERS: every structural decision is still free. Switching the scheme costs 5 ALB
      rules and 0 DNS records. It will never be cheaper than now.
      AN ALB HOST RULE IS NOT AN ENDPOINT — it is invisible until DNS exists. Do not read
      "rule configured" as "provisioned"; the client fails at resolution and never reaches the ALB.
    created_at: "2026-08-13"
