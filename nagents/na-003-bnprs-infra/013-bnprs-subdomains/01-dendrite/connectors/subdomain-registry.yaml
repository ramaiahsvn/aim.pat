# ============================================================
#  SUBDOMAIN REGISTRY — the single source of truth
#  na-003/013 bnprs-subdomains
# ============================================================
#  Every hostname this org publishes is listed here, with its
#  REAL state — not its intended state.
#
#  EDIT THIS FILE, not the deliverables. The review document in
#  07-axon-terminals/deliverables/ is a snapshot of a decision;
#  this file is the live registry. Add products, correct names,
#  flip status values here.
#
#  status values — say what is TRUE, never what is planned:
#    planned        nothing exists yet
#    alb-rule-only  ALB host-header rule exists, NO DNS record
#                   -> the name does not resolve; callers fail on DNS
#    dns-only       DNS record exists, no listener rule / no target
#    live           resolves, TLS valid, reaches a healthy target
#    dangling       DNS record exists, its TARGET IS GONE
#                   -> hard failure + hygiene risk; delete or repoint
#    retired        deliberately removed; kept here so the name is
#                   never silently reused
#
#  Verified 2026-08-13 against AWS acct 819144294008 (profile itp)
#  and public DNS. 0 of the 66 names in the source table resolve.
# ============================================================

