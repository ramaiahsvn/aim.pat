# ---- OPEN DECISIONS — these block provisioning --------------------------
decisions:

  d1:
    question: "Flat <product>-<component>-<env>.bnprs.in, or hierarchical <product>-<component>.<env>.bnprs.in?"
    status: OPEN
    blocking: "everything below phase 0"
    evidence: >-
      Flat puts sandbox, UAT and production in one wildcard namespace: a single
      *.bnprs.in certificate (already ISSUED in acct 819144294008) covers all
      three, so ONE private key spans every environment and a sandbox compromise
      yields a cert valid for production. It also makes per-env zone delegation
      impossible. The org already runs hierarchical in two places — the
      *.uat.itpgateway.com cert with projects-api.uat.itpgateway.com, and the
      delegated bruid.bnprs.in zone with its own *.bruid.bnprs.in cert.
      Cost of switching TODAY: 5 ALB rules, 0 DNS records.
    recommendation: >-
      Hierarchical. Keep the table's readable <product>-<component> prefix, move
      the env into its own label: bnet-api.uat.bnprs.in, prod bnet-api.bnprs.in.
      Delegate uat.bnprs.in and sandbox.bnprs.in as separate zones with their own
      wildcard certs, so a non-prod key can never sign a prod hostname.
    new_evidence_2026_08_13: >-
      A THIRD live hierarchical precedent, and this one is INSIDE THE VERY ZONE we are
      about to populate: mGate already runs mgate.bnprs.in, api.mgate.bnprs.in and
      portal-api.mgate.bnprs.in — i.e. <component>.<product>.bnprs.in. The flat table
      would add mgate-api-uat.bnprs.in and mgate-portal.bnprs.in ALONGSIDE those, giving
      one product two naming schemes in one zone. Also live at product level and flat-ish:
      people.bnprs.in and projects.bnprs.in (both Zoho). Whatever is decided, mGate needs
      an explicit keep-or-migrate call, exactly like bRuID (d5).
    corrected_cost: >-
      Earlier this entry said switching costs "5 ALB rules, 0 DNS records". Incomplete.
      *.bnprs.in (ISSUED, ITP acct, confirmed attached to the shared ALB listener as the
      second SNI cert, expires 2027-02-26) covers SINGLE-LABEL names only, so hierarchical
      additionally needs two new ACM certs (*.uat.bnprs.in, *.sandbox.bnprs.in), their DNS
      validation, and a listener attach. Still cheap, but not free.

  d2:
    question: "nAgent capital A, and nagent vs nagents (plural)?"
    status: RESOLVED
    resolved_at: "2026-08-13"
    resolution: >-
      MOOT — the product is renamed nAgent -> bna (user instruction). "bna" is
      unambiguously lowercase and has no plural form, so both halves of the question
      disappear. Aligns the DNS name with na-010-bna-platform.
      NOTE the infrastructure is still named nagents-* (nagents-uat-alb,
      nagents-uat-livekit-nlb). DNS and infra names now diverge for this product;
      that is acceptable (infra names are internal) but do not "fix" one to match
      the other without asking.

  d3:
    question: "Does SmartPresence get its own host, or a path under bnet-api?"
    status: RESOLVED
    resolved_at: "2026-08-13"
    resolution: >-
      OWN HOST. bnet-smartpresence-api-<env>.bnprs.in is now a full member of the
      table across all three environments (products.bnet.components.smartpresence-api).
      Consistent with scheme.host_vs_path: it is a separately deployed service with its
      own ECS service, target group and GitLab project, and its callers are machines,
      not the portal. The UAT name already has its ALB rule, so this needs DNS only.

  d4:
    question: "Should production carry an explicit -prod token?"
    status: OPEN
    evidence: >-
      As proposed, production is what you get when the env token is ABSENT. Any
      template of the form ${product}-api-${env} with env unset or stripped
      resolves to production. This estate has repeatedly been bitten by exactly
      that shape (BNET_COMPANY_ID, BNET_RUNTIME_DIR, a missing ONNX model each
      silently fell back to a default), and here the fallback has the largest
      possible blast radius.
    recommendation: >-
      Keep the bare name as the published prod host, but forbid templating env
      into hostnames in config — enumerate the three hosts explicitly.

  d5:
    question: "Is bRuID a product family or is wGate the product? And rengine/risk-engine/risk?"
    status: OPEN
    evidence: >-
      Table = 4 sibling bRuID products. Infra = wgate-uat-acs, wgate-uat-bengine,
      wgate-uat-risk-engine, i.e. components of wGate. Live DNS = a delegated
      bruid.bnprs.in zone with TWO internal orderings already
      (acs.sandbox.bruid.bnprs.in vs uat-acs.bruid.bnprs.in).

  d6:
    question: "Which agent owns each AandhiPe surface?"
    status: OPEN
    evidence: "na-009 has bpr2001-aandhipe AND bpr1003-mpos AND bpr1006-patkiosk."

  d7:
    question: "Who owns the bnprs.in apex zone, and which account issues its records?"
    status: RESOLVED
    resolved_at: "2026-08-13"
    resolution: >-
      THE BNPRS ACCOUNT, 891963159778, zone Z04234212M3SJ07Y70SGQ (public, 24 records).
      Verified authoritative: the zone's DelegationSet matches all four NS returned by
      public DNS for bnprs.in. User directive: create these records in bnprs-aws, NOT
      bnprs-aws-itp. This unblocks every record in the file — DNS is no longer gated on
      finding an owner, only on d1 (the shape) and d9 (cross-account targets).

  d9:
    question: "How do bnprs-account DNS records point at ITP-account load balancers?"
    status: OPEN
    raised: "2026-08-13"
    evidence: >-
      The zone is in 891963159778 (bnprs) but the targets for utms / bnet / mpos are
      utms-shared-alb in 819144294008 (ITP), eu-central-1. Meanwhile the records already
      live in this zone point at ap-south-2 ALBs in the bnprs account
      (api.mgate.bnprs.in -> maingateway-prod-alb, portal-api.mgate.bnprs.in ->
      portalbackend-prod-alb). So this zone has only ever aliased SAME-account targets.
    options: >-
      (a) CNAME to the ALB's amazonaws.com name — simplest, works cross-account, but adds
      a resolution hop and cannot be used at a zone apex (not a problem here, every name
      is a subdomain). (b) Route53 ALIAS to a cross-account ELB — supported, but only via
      CLI/API (not the console) and you must supply the ELB's canonical hosted-zone ID.
      (c) Move the services into the bnprs account so DNS and targets are co-located.
    also_note: >-
      The *.bnprs.in ACM certificate that makes this work is in the ITP account, attached
      to the ITP ALB — which is correct for (a) and (b), since TLS terminates at the ALB.
      Option (c) would need a NEW *.bnprs.in cert issued in the bnprs account.

  d8:
    question: "Does auth (Keycloak) migrate to bnprs.in?"
    status: OPEN
    evidence: "See unmapped_endpoints. Leaving it behind keeps two domains alive forever."
