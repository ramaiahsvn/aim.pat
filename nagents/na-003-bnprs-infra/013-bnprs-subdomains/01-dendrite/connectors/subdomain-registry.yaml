# ---- OPEN DECISIONS — these block provisioning --------------------------
decisions:

  d1:
    question: "Flat <product>-<component>-<env>.bnprs.in, or hierarchical <product>-<component>.<env>.bnprs.in?"
    status: OPEN
    blocking: "everything below phase 0"
    evidence: >-
      Flat puts sandbox, UAT and production in one wildcard namespace: a single
      *.bnprs.in certificate (already ISSUED in acct 819144294008) covers all
      three, so ONE private key spans every environment and a sandbox compromise
      yields a cert valid for production. It also makes per-env zone delegation
      impossible. The org already runs hierarchical in two places — the
      *.uat.itpgateway.com cert with projects-api.uat.itpgateway.com, and the
      delegated bruid.bnprs.in zone with its own *.bruid.bnprs.in cert.
      Cost of switching TODAY: 5 ALB rules, 0 DNS records.
    recommendation: >-
      Hierarchical. Keep the table's readable <product>-<component> prefix, move
      the env into its own label: bnet-api.uat.bnprs.in, prod bnet-api.bnprs.in.
      Delegate uat.bnprs.in and sandbox.bnprs.in as separate zones with their own
      wildcard certs, so a non-prod key can never sign a prod hostname.

  d2:
    question: "nAgent capital A, and nagent vs nagents (plural)?"
    status: OPEN
    recommendation: "lowercase; pick singular or plural once and match the ALBs (nagents-uat-alb)"

  d3:
    question: "Does SmartPresence get its own host, or a path under bnet-api?"
    status: OPEN
    blocking: "the bNet v2 outage fix"
    evidence: >-
      bnet-smartpresence-api-uat.bnprs.in already has an ALB rule but is absent
      from the table, which only allows bnet-api-uat. Folding it under bnet-api
      needs server-side path routing; keeping it separate needs a table row.

  d4:
    question: "Should production carry an explicit -prod token?"
    status: OPEN
    evidence: >-
      As proposed, production is what you get when the env token is ABSENT. Any
      template of the form ${product}-api-${env} with env unset or stripped
      resolves to production. This estate has repeatedly been bitten by exactly
      that shape (BNET_COMPANY_ID, BNET_RUNTIME_DIR, a missing ONNX model each
      silently fell back to a default), and here the fallback has the largest
      possible blast radius.
    recommendation: >-
      Keep the bare name as the published prod host, but forbid templating env
      into hostnames in config — enumerate the three hosts explicitly.

  d5:
    question: "Is bRuID a product family or is wGate the product? And rengine/risk-engine/risk?"
    status: OPEN
    evidence: >-
      Table = 4 sibling bRuID products. Infra = wgate-uat-acs, wgate-uat-bengine,
      wgate-uat-risk-engine, i.e. components of wGate. Live DNS = a delegated
      bruid.bnprs.in zone with TWO internal orderings already
      (acs.sandbox.bruid.bnprs.in vs uat-acs.bruid.bnprs.in).

  d6:
    question: "Which agent owns each AandhiPe surface?"
    status: OPEN
    evidence: "na-009 has bpr2001-aandhipe AND bpr1003-mpos AND bpr1006-patkiosk."

  d7:
    question: "Who owns the bnprs.in apex zone, and which account issues its records?"
    status: OPEN
    blocking: "every single record in this file"
    evidence: "The apex is on AWS DNS but NOT in 819144294008; only bruid.bnprs.in is delegated there."

  d8:
    question: "Does auth (Keycloak) migrate to bnprs.in?"
    status: OPEN
    evidence: "See unmapped_endpoints. Leaving it behind keeps two domains alive forever."
