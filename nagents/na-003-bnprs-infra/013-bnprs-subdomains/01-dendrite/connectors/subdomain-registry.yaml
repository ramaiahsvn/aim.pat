# ---- SCHEME ------------------------------------------------------------
# The source table proposes FLAT: <product>-<component>-<env>.bnprs.in
# with production as the bare <product>-<component>.bnprs.in.
#
# NOT YET RATIFIED. See decisions.d1 — the org already runs two
# HIERARCHICAL schemes in production, and switching costs 5 ALB rules and
# 0 DNS records today because nothing has been provisioned yet. This is the
# cheapest this decision will ever be.
scheme:
  proposed: "<product>-<component>-<env>.bnprs.in"
  production_form: "<product>-<component>.bnprs.in"    # no env token — see decisions.d4
  ratified: false
  envs: ["sandbox", "uat", "prod"]
  components: ["api", "portal"]
  charset: "lowercase a-z 0-9 and hyphen only"
  max_label: 63                                        # longest name is 39 — no risk

  # SUB-PROJECTS GET NAMES, NOT PATHS (user instruction, 2026-08-13 — this REVERSES the
  # earlier path decision taken the same day; see inputs/…-amendment-2-…).
  # Applies to sub-projects of EVERY product, not only BNA. The sub-project slot sits
  # between product and component, so specificity still reads left to right.
  subproject_form: "<product>-<subproject>-<component>-<env>.bnprs.in"
  subproject_production_form: "<product>-<subproject>-<component>.bnprs.in"
  subproject_examples:
    - "bna-sprints-portal-uat.bnprs.in"
    - "bna-erp-portal.bnprs.in"
    - "bna-chat-api-sandbox.bnprs.in"
  subproject_rules:
    - "ONE RULE FOR THE WHOLE STANDARD. This is the same shape as
       bnet-smartpresence-api-uat.bnprs.in, so there is no longer any host-vs-path
       discriminator to argue about and nothing has to be inferred: every addressable
       thing is <product>[-<subproject>]-<component>[-<env>]."
    - "Each sub-project needs its OWN DNS record, its OWN ALB host rule and coverage by
       the wildcard certificate. Sub-projects are single labels under the apex, so
       *.bnprs.in already covers them — no new certificate is required under the flat
       scheme."
    - "NO base-path rework. Each sub-project is served at the ROOT of its own host, so
       base href, router basename and asset paths all stay '/'. This is the main practical
       advantage over paths, and it removes the blank-page failure mode entirely — an app
       that cannot be rebased is no longer a blocker."
    - "REAL isolation. A distinct hostname is a distinct browser origin, so cookies,
       localStorage and sessionStorage do not cross between sub-projects, and an XSS in
       one does not reach the others."
    - "THE COST, and it is the one to plan for: every sub-project origin must be
       registered separately — its own OIDC redirect_uri, its own CORS allow-list entry,
       its own ALB rule. Three sub-projects across two components and three environments
       is 18 hostnames for BNA alone, where paths would have needed 2. Auth
       configuration, not DNS, is where this bill is paid."
    - "Watch label length as sub-projects nest: <product>-<subproject>-<component>-<env>
       is four segments. Longest currently is bnet-smartpresence-api-sandbox at 30
       characters, well inside the 63-character limit, but a long product plus a long
       sub-project could approach it."

