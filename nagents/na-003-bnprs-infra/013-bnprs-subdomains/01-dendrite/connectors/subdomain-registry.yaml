# ============================================================
#  SUBDOMAIN REGISTRY — the single source of truth
#  na-003/013 bnprs-subdomains
# ============================================================
#  Every hostname this org publishes is listed here, with its
#  REAL state — not its intended state.
#
#  EDIT THIS FILE, not the deliverables. The review document in
#  07-axon-terminals/deliverables/ is a snapshot of a decision;
#  this file is the live registry. Add products, correct names,
#  flip status values here.
#
#  status values — say what is TRUE, never what is planned:
#    planned        nothing exists yet
#    alb-rule-only  ALB host-header rule exists, NO DNS record
#                   -> the name does not resolve; callers fail on DNS
#    dns-only       DNS record exists, no listener rule / no target
#    live           resolves, TLS valid, reaches a healthy target
#    dangling       DNS record exists, its TARGET IS GONE
#                   -> hard failure + hygiene risk; delete or repoint
#    retired        deliberately removed; kept here so the name is
#                   never silently reused
#
#  Verified 2026-08-13 against AWS acct 819144294008 (profile itp)
#  and public DNS. 0 of the 66 names in the source table resolve.
# ============================================================

meta:
  apex: "bnprs.in"
  source_input: "01-dendrite/inputs/2026-08-13-subdomain-table-source.md"
  verified_at: "2026-08-13"
  verified_by: "na-003/013 bnprs-subdomains"

  # WHERE THE ZONES LIVE. The apex is NOT in the ITP account — only the
  # bruid.bnprs.in subzone is delegated there. Any apex-level record needs
  # whoever holds the parent zone; find that account before promising a change.
  zones:
    - name: "bnprs.in"
      account: "UNKNOWN — not in 819144294008"
      nameservers: ["ns-569.awsdns-07.net", "ns-219.awsdns-27.com",
                    "ns-1122.awsdns-12.org", "ns-1865.awsdns-41.co.uk"]
      note: "Route53 (AWS DNS) but a different account. BLOCKER for every record below."
    - name: "bruid.bnprs.in"
      account: "819144294008 (itp)"
      zone_id: "Z0491996155ALJADE0VR8"
      note: "Delegated subzone, 8 records, ALREADY LIVE with its own convention."
    - name: "itpgateway.com"
      account: "819144294008 (itp)"
      zone_id: "Z065126021WLLO6U774F7"
      note: "The domain being migrated AWAY from. 40 records. Still carries auth."

# ---- SCHEME ------------------------------------------------------------
# The source table proposes FLAT: <product>-<component>-<env>.bnprs.in
# with production as the bare <product>-<component>.bnprs.in.
#
# NOT YET RATIFIED. See decisions.d1 — the org already runs two
# HIERARCHICAL schemes in production, and switching costs 5 ALB rules and
# 0 DNS records today because nothing has been provisioned yet. This is the
# cheapest this decision will ever be.
scheme:
  proposed: "<product>-<component>-<env>.bnprs.in"
  production_form: "<product>-<component>.bnprs.in"    # no env token — see decisions.d4
  ratified: false
  envs: ["sandbox", "uat", "prod"]
  components: ["api", "portal"]
  charset: "lowercase a-z 0-9 and hyphen only"
  max_label: 63                                        # longest name is 39 — no risk

  # SUB-PROJECTS ARE PATHS, NOT SUBDOMAINS (user instruction, 2026-08-13).
  # Applies to sub-projects of EVERY product, not only BNA.
  subproject_form: "<product>-<component>[-<env>].bnprs.in/<subproject>"
  subproject_examples:
    - "bna-portal.bnprs.in/sprints"
    - "bna-portal-uat.bnprs.in/erp"
    - "bna-api-uat.bnprs.in/chat"
  subproject_rules:
    - "NO DNS record, NO ALB host rule and NO certificate SAN per sub-project — an ALB
       PATH rule per target group is the whole mechanism."
    - "The app MUST be base-path aware. A portal served at /sprints needs its base href,
       router basename and asset paths rooted at /sprints, or it requests assets from /
       and 404s with an empty page and no useful error. This is the single most common
       way path-based routing fails, and some third-party apps cannot be rebased at all
       — check before promising a sub-project a path."
    - "Paths DO NOT isolate. All sub-projects on one host share one browser origin, so
       they share cookies, localStorage and sessionStorage; Path= on a cookie is advisory
       and not an origin boundary. An XSS in one sub-project reaches the others. Only put
       sub-projects on paths when they are inside the same trust boundary — which they
       are for BNA, since it is one product with one login."
    - "The corollary benefit: one origin means one CORS allow-list and one OIDC
       redirect_uri set per environment instead of three."

  # WHEN DOES A THING GET ITS OWN HOST INSTEAD OF A PATH?
  # Settled 2026-08-13 by two user decisions: BNA's sprints/erp/chat are PATHS, while
  # bNet's SmartPresence API gets its OWN HOST. The discriminator those two imply:
  host_vs_path:
    own_host: >-
      A separately DEPLOYED service — its own ECS service / target group / release
      cadence, and callers that are not the portal. SmartPresence qualifies: its own ECS
      service, its own target group on :8080, its own GitLab project (34), and machine
      clients (bNet v2 sync and 1:N verify) that never touch a portal.
    path: >-
      A surface of an existing deployable, reached by humans through the same portal and
      the same login. Sprints, ERP and Chat qualify.
    note: >-
      This rule was inferred from two decisions, not stated by the user. It holds for the
      cases in this file; re-confirm before applying it to a genuinely new shape.

