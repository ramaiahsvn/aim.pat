# ---- REAL ENDPOINTS WITH NO NAME IN THE TABLE --------------------------
# These all EXIST. Leaving them out of the standard does not make them go
# away; it means they keep living on itpgateway.com or under a raw ELB name
# after the migration, which is precisely the split-brain that broke bNet.
unmapped_endpoints:

  - service: "Keycloak / auth"
    live: ["accounts-uat.itpgateway.com -> utms-keycloak-alb (eu-central-1)",
           "accounts.itpgateway.com -> BPR-uTMS-LB (us-east-2)",
           "utms-auth.itpgateway.com -> BPR-uTMS-LB (us-east-2)"]
    why_it_matters: >-
      Auth is shared by every product. If products move to bnprs.in and auth
      stays on itpgateway.com you keep two domains alive permanently, and every
      OIDC issuer, redirect_uri and CORS allow-list spans both. HIGHEST priority
      gap in the table.
    status: no-name-assigned

  - service: "bengine / bPassEngine"
    live: ["bengine.sandbox.bruid.bnprs.in", "uat-bpassengine.bruid.bnprs.in"]
    infra: "ALB wgate-uat-bengine (eu-central-1)"
    why_it_matters: >-
      Named THREE ways already (bengine, bpassengine, wgate-uat-bengine). Probably
      bRuID Pass's engine, but that is an assumption — confirm before mapping.
    status: no-name-assigned

  - service: "tms / btms"
    live: ["tms-api.itpgateway.com", "tms.itpgateway.com (itptms-lb, us-east-2)",
           "btms-api.itpgateway.com (BPR-uTMS-LB)"]
    provisioned: "tms-api-uat.bnprs.in — ALB rule EXISTS on utms-shared-alb, not in the table"
    why_it_matters: "Is tms a distinct product from utms, or the old name for it?"
    status: no-name-assigned

  - service: "MQTT / streaming / realtime — not HTTP"
    live: ["utms-emqx-nlb", "utms-rsi-nlb", "nagents-uat-livekit-nlb",
           "tms-emqx.itpgateway.com", "tms-webrtc.itpgateway.com"]
    why_it_matters: >-
      These are NLBs. Host-header routing does not exist at layer 4, so each one
      needs its OWN DNS name pointing at its OWN load balancer — they cannot be
      folded behind a shared ALB rule like the APIs. The <product>-api-<env>
      pattern has no slot for them; decide a component token (-mqtt, -rtc, -stream).
    status: no-name-assigned

  - service: "mini-apps"
    live: ["mini-apps.itpgateway.com (BPR-uTMS-LB)"]
    status: no-name-assigned

  - service: "ERP / projects / chat (internal tooling)"
    live: ["erp.uat.itpgateway.com", "erp-api.uat.itpgateway.com",
           "projects.uat.itpgateway.com", "projects-api.uat.itpgateway.com",
           "chat-api.uat.itpgateway.com", "kc-temp.uat.itpgateway.com"]
    note: >-
      All on nagents-uat-alb using <component>.<env>.itpgateway.com — the
      HIERARCHICAL scheme. Live internal precedent that contradicts the flat table.
    status: no-name-assigned

