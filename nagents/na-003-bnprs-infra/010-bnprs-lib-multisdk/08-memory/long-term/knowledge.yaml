  - id: mem-006
    type: technical_knowledge
    content: >-
      MAVEN COORDINATES: THE POM'S groupId DICTATES THE UPLOAD PATH, and getting it wrong is
      silent. Path = …/packages/maven/<groupId with dots as slashes>/<artifactId>/<version>/<file>.
      For these wrappers groupId is ai.bnprs and artifactId is nativesdk-<lib>, so the path is
      ai/bnprs/nativesdk-<lib>/… — NOT ai/bnprs/nativesdk/nativesdk-<lib>/, which is easy to write
      because the Java package is ai.bnprs.nativesdk.<lib>. THE JAVA PACKAGE NAME IS NOT THE
      groupId. GitLab accepts the wrong path with HTTP 200 and registers it as a separate package
      that no consumer can resolve. Happened on BprFace 2.24.116; corrected and the wrong-path
      package deleted via DELETE /projects/230/packages/<id>. Verify by resolving from a throwaway
      consumer project, and compare the package NAME the registry lists against the previous
      release's — they must match exactly.
    created_at: "2026-08-01"
    last_accessed: "2026-08-01"
    access_count: 1
    confidence: 1.0
    source: "session-2026-08-01"
    tags: [maven-coordinates, groupid-not-java-package, wrong-path-registers-silently, delete-package-api, resolve-to-verify]

