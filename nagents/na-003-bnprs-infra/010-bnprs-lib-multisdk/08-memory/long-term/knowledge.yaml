  - id: "wrapper-sources-are-not-committed"
    type: project
    content: >-
      THE MAVEN AND NUGET WRAPPER SOURCES DO NOT EXIST IN ANY REPO. Searched bpr.cpp, aim.pat and
      project 230 (BPR1000/bpr1000.bnprs-libs) — 230 holds only go/. The published NuGet package
      is ONE managed assembly with the natives and models as EMBEDDED RESOURCES
      (native.<rid>.<file>, e.g. native.osx-arm64.libBprFace.dylib), and the Maven jar is a jar of
      per-RID directories (darwin-aarch64, linux-aarch64, linux-x86-64, win32-x86-64, win32-x86)
      plus models/ and compiled .class files. Both were produced in a throwaway workspace.
      SO A NEW NATIVE RELEASE CANNOT BE REBUILT FROM SOURCE — it has to be repacked. For 2.24.118
      that meant: download the previous artifact, swap the five natives, bump the version, re-upload.
      Maven is a plain unzip/rezip. NuGet needs Mono.Cecil to replace the embedded resources in the
      assembly and set asm.Name.Version. Both verified afterwards by CONSUMING (Java prints
      2.24.118 and scores 0.7619; .NET prints BprFace.Version() = 2.24.118).
      WORTH FIXING: commit the two wrapper projects so a release is reproducible instead of a
      binary edit of the last one.
      Note the BprFace nuspec description is self-referential ("MUTUALLY EXCLUSIVE with
      Bnprs.NativeSdk.BprFace") — leftover from the BprIDEngine-face split, carried forward.
    created_at: "2026-08-01"
    last_accessed: "2026-08-01"
    access_count: 1
    confidence: 1.0
    source: "session-2026-08-01"
