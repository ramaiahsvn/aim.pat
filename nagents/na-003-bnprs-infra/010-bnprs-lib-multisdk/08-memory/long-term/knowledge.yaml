  - id: mem-002
    type: reference
    content: >-
      PER-FORMAT PUBLISH AUTH (GitLab CE 18.9, project 230; verified end-to-end). Native binaries +
      model → GENERIC: PUT …/packages/generic/<pkg>/<ver>/<path>, header PRIVATE-TOKEN:$GITLAB_PAT (201).
      NUGET → HTTP BASIC ONLY *AND* PUT: curl -X PUT --user root:$GITLAB_PAT --form package=@x.nupkg
      …/packages/nuget/ (201). Without -X PUT curl POSTs and GitLab answers 404, which reads like a
      wrong URL rather than a wrong method. A PRIVATE-TOKEN header 401s on every nuget endpoint,
      download included — use --user root:$GITLAB_PAT to fetch a nupkg back too. MAVEN → PUT jar + pom to …/packages/maven/<group-path>/<artifact>/<ver>/<file>,
      header Private-Token:$GITLAB_PAT (200). GO → NO upload endpoint: commit the module into project 230's
      git repo under go/<lib>/ + push a SemVer tag go/<lib>/vX.Y.Z (default branch is MASTER, not main).
      The GitLab Go PROXY endpoint …/projects/230/packages/go IS NOT ENABLED — it 404s even authenticated
      (401 unauthenticated, so it is the feature, not the token), including for modules recorded as working.
      Consume by DIRECT GIT: GOPROXY=direct, GOPRIVATE='gitlab.bnprs.ai/*', GOSUMDB=off, plus git insteadOf
      or ~/.netrc auth. Consumers use read-only deploy token bnprs-libs-readonly.
      Full detail: gitlab-publish-auth.md.
    created_at: "2026-07-21"
