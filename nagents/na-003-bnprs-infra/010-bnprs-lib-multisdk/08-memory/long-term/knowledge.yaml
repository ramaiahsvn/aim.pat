  - id: "go-module-staged-native-by-content-hash"
    type: project
    content: >-
      go/bpridengine staged its native into a HARDCODED temp dir "bnprs-bpridengine-2.24.902" and
      skipped extraction when the file already existed. Any consumer who had ever run 2.24.902 kept
      loading that native forever: upgrading the module changed nothing, Version() still answered
      2.24.902, and no error appeared anywhere. Caught by tagging v2.24.903 and watching the
      consumer print 2.24.902. Fixed 2026-08-01 to key the directory on a sha256 of the embedded
      bytes, so a changed native is a different directory by construction.
      CHECK go/bprface FOR THE SAME PATTERN before tagging it. That module is ALSO stale in another
      way: it embeds a single native/bpr.model.onnx (the old ~75 MB encrypted blob) while the
      current release ships three separate ONNX files, so it needs a source change, not just a
      binary swap. It currently has NO tag, so nothing consumes it.
      Reminder: tags are go/<lib>/vX.Y.Z on the MASTER branch; Go resolves from TAGS, and the
      GitLab Go proxy is not enabled (GOPROXY=direct).
    created_at: "2026-08-01"
    last_accessed: "2026-08-01"
    access_count: 1
    confidence: 1.0
    source: "session-2026-08-01"
    tags: [go-stale-native, hardcoded-temp-dir, content-hash, bprface-go-stale, go-tags-master]

