    content: >-
      2026-08-13 MCES2 TOOLCHAIN STATE, surveyed and then restored. Recorded because the survey
      itself is the reusable part: MCES2 is AMD64 with Visual Studio 18 Community INCLUDING the
      C++ x64 tools (found via vswhere -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64),
      winget is available, and it has NO Rust, NO clang/LLVM, NO Perl, NO git and NO ProtectToolkit.
      The only "Protect" match under Program Files is Windows Defender ATP - do not mistake it for
      ProtectToolkit when grepping.
      Rust, LLVM and Strawberry Perl were installed via winget for a one-off Windows link test and
      then REMOVED, along with everything staged under C:\BPR\pHSM. C:\BPR itself holds six
      pre-existing directories (bpr1010.misc.testbed, BprMces2_new, JavaCard_Toolbox_V1.29, JC_files,
      TestApps, _bk) which were NOT touched - check that list before deleting anything under C:\BPR.
      TWO GOTCHAS FOR SCRIPTED WORK OVER SSH HERE. (1) The SSH session runs ELEVATED, so
      `winget uninstall` refuses per-user packages with "cannot be uninstalled when running with
      administrator privileges" - rustup had to remove itself with `rustup self uninstall -y`, and
      winget reported success for LLVM and Strawberry while leaving their directories behind, so
      verify removal rather than trusting the exit code. (2) Non-ASCII characters in a .ps1 uploaded
      by scp arrive mangled and produce parser errors ("Unexpected token"); keep scripts ASCII-only.
