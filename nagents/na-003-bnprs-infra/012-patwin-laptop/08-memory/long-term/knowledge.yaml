  - id: mem-013
    type: incident_learning
    content: >-
      2026-08-14 WINDOWS FIREWALL IS NOT THE CONTROL PLANE ON MCES2 — KASPERSKY IS.
      Attempted to restrict inbound SSH to the tailnet by scoping the two inbound port-22 allow
      rules (OpenSSH-Server-In-TCP, profile Private; and sshd, profile Any) to RemoteAddress
      100.64.0.0/10. EVERY STATUS SIGNAL SAID IT WORKED: netsh reported State ON and
      BlockInbound,AllowOutbound on all three profiles; Get-NetFirewallAddressFilter read back
      100.64.0.0/255.192.0.0 on both rules; no other enabled inbound allow rule covered TCP/22.
      IT DID NOTHING. A full SSH handshake to the LAN address still authenticated and returned
      MCES2. Root cause: `Get-CimInstance -Namespace root/SecurityCenter2 -ClassName FirewallProduct`
      reports "Kaspersky Endpoint Security for Windows" (14.0, productState 266240) as the
      REGISTERED FIREWALL PRODUCT, with AVP.KES.14.0 and klnagent running. Kaspersky is the
      effective packet filter; Windows Firewall rules are inert for inbound port control here.
      klnagent = Kaspersky Security Center network agent, so the endpoint is CENTRALLY MANAGED —
      firewall policy comes from an admin server, and any local change is the wrong lever and may
      be overridden anyway. Restricting network access on this box is a KSC policy change, i.e. a
      request to whoever administers Kaspersky, not something to do from a shell.
      THE REUSABLE LESSON, and it is exactly this agent's core directive: CHECK THE REGISTERED
      FIREWALL PRODUCT BEFORE TOUCHING WINDOWS FIREWALL ON ANY MANAGED ENDPOINT. Read-back of a
      firewall rule proves the rule was STORED, not that it is ENFORCED. The only thing that
      settled it was an end-to-end connection attempt from the network that was supposed to be
      blocked. Never accept a rule read-back as proof of enforcement.
      STATE LEFT BEHIND: NONE. Both rules restored to RemoteAddress Any, the 10-minute
      self-rollback scheduled task ('ssh-fw-rollback', registered as a safety net before the
      change) deleted, and both paths re-verified. Note `Unregister-ScheduledTask -Confirm:$false`
      loses its flag through SSH quoting and silently leaves the task in place — `schtasks /delete
      /tn <name> /f` is the reliable form over SSH.
      IF LAN EXPOSURE STILL NEEDS CLOSING, the only host-local lever that does not depend on a
      firewall is `ListenAddress 100.92.81.14` in sshd_config — sshd then never binds the LAN
      address, so there is nothing for Kaspersky to permit. That was rejected earlier in this
      session for a real reason: sshd and Tailscale are BOTH StartType Automatic with no ordering
      guarantee, so on reboot sshd can start before the 100.x address exists, fail to bind, and
      leave the box with no SSH at all. If it is ever taken, pair it with `sc config sshd depend=
      Tailscale` AND service failure-recovery (auto-restart) so a lost race self-heals.
