  - id: mem-014
    type: operation
    content: >-
      2026-08-14 BATTERY CHARGE THRESHOLD ON MCES2 — ATTEMPTED, NOT ACHIEVED. Goal: cap charging
      at 55/60% because the machine now lives permanently on AC as a remote-access host, and a
      Li-ion cell held at 100% ages faster.
      HARDWARE: ThinkPad E16 Gen 3, machine type 21SR005MGR, BIOS R30ET37W(1.11). Battery is
      effectively NEW — designed 48000 mWh, full charge 50230 mWh (104.6% of design), 4 cycles.
      Nothing has degraded yet, so this is preventative, not remedial, and NOT urgent.
      WHY IT COULD NOT BE DONE: the charge threshold on ThinkPads is implemented by the
      ThinkBatteryHelper plugin of LENOVO SYSTEM INTERFACE FOUNDATION (the ImController service),
      and SIF IS NOT INSTALLED on this box. Verified four ways: no ImController/LenovoSystemInterface
      service, no ImController directory under Program Files\Lenovo, the
      HKLM\SOFTWARE\Policies\Lenovo\ImController\Plugins\ThinkBatteryHelper policy key is absent,
      and the FULL Lenovo_BiosSetting list contains no threshold entry (only `ChargeInBatteryMode`,
      which is a different feature — whether it charges from a dock in battery mode). Commercial
      Vantage IS installed (E046963F.LenovoSettingsforEnterprise v20.2606.20.0) but its battery
      feature depends on SIF, so the control does not appear. root\Lenovo namespace exists but
      carries only standard CIM/system classes, no Lenovo battery classes.
      ROUTES TRIED AND WHY THEY FAILED:
        * winget — no System Interface Foundation package exists in the catalog at all.
        * Direct download from Lenovo — support.lenovo.com and pcsupport.lenovo.com return 403 to
          scripted requests BOTH from the Mac's fetch tool AND from Invoke-WebRequest on MCES2
          itself (Akamai bot protection, possibly plus Kaspersky web filtering). A real browser on
          the box would pass; a script will not.
        * Windows Update — SIF is not offered. Two Lenovo updates were on offer: "Lenovo Ltd.
          Firmware Driver Update (1.0.0.55)", deliberately NOT installed (flashing firmware on a
          perso station is not an acceptable side effect of a battery setting), and "Lenovo System
          Driver Update (10.17.2606.3)", which WAS installed on the assumption the 10.x version
          scheme meant SIF. IT DID NOT BRING SIF — it added LenovoSmartStandby and LenovoBrightCtrl
          instead. Installed cleanly (result 2, no reboot required), harmless, but it was not the
          target. Do not repeat that inference: version-number shape is not identification.
      A WINDOWS UPDATE TRAP WORTH KEEPING: IUpdateInstaller::Install fails with a bare
      "Access is denied." when called over SSH — the Windows Update Agent refuses to install from
      a REMOTE session. Workaround that works: stage the script, then run it from a local
      scheduled task as SYSTEM (`schtasks /create ... /ru SYSTEM /rl HIGHEST /f` then
      `schtasks /run`). Also note Tee-Object writes the log as UTF-16, so a plain `grep DONE`
      over `type <log>` never matches — read it accordingly.
      RESOLVED LATER THE SAME DAY, AND THE WHOLE SIF PREMISE ABOVE WAS WRONG. This model does not
      use ImController/SIF at all. It uses LENOVO UNIVERSAL DEVICE CLIENT (UDC) — udc26605wx64
      v26.6.0.5, ALREADY INSTALLED since 2026-07-27, UDCService running — which Lenovo documents as
      required wherever Commercial Vantage is installed. The Power and Battery Driver and Power
      Management Driver were already installed too. Nothing needed installing; the feature was
      there the whole time. Chasing SIF (doc DS105970, now a dead page) was chasing the previous
      generation's mechanism.
      HOW THE ANSWER WAS ACTUALLY FOUND: `tvsu.exe /CM -search A -action LIST -exporttowmi` from
      Lenovo System Update populates root\Lenovo:Lenovo_Updates with every applicable package AND
      its Status. READ THE Status FIELD — the list includes AlreadyInstalled entries, and misreading
      it as a to-install list is what made UDC look like the missing piece when it was already
      present. That WMI dump is the fastest way to see this machine's true software inventory.
      AND THE THRESHOLD WAS ALREADY PROTECTED: Vantage had ADAPTIVE/SMART charging enabled —
      100% during active hours, capped at 80% during inactive hours. So the big win (100 -> 80) was
      in place before any of this started; the remaining 80 -> 60 was a marginal optimisation.
      Check what is already configured BEFORE hunting for a way to configure it.
      SETTINGS NOW: user switched to the custom threshold, start 55% / stop 60%, in the Vantage GUI
      (2026-08-14). Rationale: calendar aging flattens around 50-60% SoC; 60% still leaves usable
      ride-through if mains drops, which matters because this battery is the de-facto UPS for the
      only remote access to the box; a 5-point gap avoids constant micro-cycling.
      WHERE IT IS *NOT* STORED: HKLM\SOFTWARE\WOW6432Node\Lenovo\PWRMGRV\Data has
      ChargeStartControl / ChargeStopControl / ChargeStartPercentage / ChargeStopPercentage, and
      they ALL REMAIN 0 after the GUI change. That is the LEGACY Power Manager store and is
      vestigial on this model — the threshold lives in the EMBEDDED CONTROLLER. Writing those four
      values from a shell would have read back perfectly and done absolutely nothing. Do not use
      them as either the setter or the check.
      Also present but a red herring: HKLM\SOFTWARE\Policies\Lenovo\ImController\Plugins\
      ThinkBatteryPlugin with Imc-Block=1. It is a policy-store value and ImController is not even
      installed, so it governs nothing here. Note the name is ThinkBatteryPlugin, NOT
      ThinkBatteryHelper — an earlier sweep missed it by grepping the wrong name.
      VERIFICATION IS BEHAVIOURAL, NOT A READ. There is no registry or WMI value to confirm this.
      The only proof is the charge level walking down off 100% toward 60% over the following DAYS
      (on AC it stops charging and self-discharges slowly; it does not dump charge). Baseline at
      time of change: 100%, Win32_Battery BatteryStatus=2. Windows reporting "plugged in, not
      charging" at the ceiling is the feature working, not a fault.
      NO RESIDUE LEFT from the SIF detour: staged C:\Windows\Temp\sif-install.ps1, its log, and the
      sif-install scheduled task all removed. Two lasting changes to the host, both benign: the
      Lenovo System Driver Update (installed on the wrong inference) and Lenovo System Update
      itself (Lenovo.SystemUpdate via winget), which is genuinely useful for patching this machine
      and whose tvsu WMI export is now the inventory tool of choice.
