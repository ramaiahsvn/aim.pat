# -----------------------------------------------------------------------------
#  Add further hosts by copying the block above. Keep `confirmed: false` until
#  a human has verified the machine, and never fill `user` by guessing.
# -----------------------------------------------------------------------------

# Signal strength: how the soma prioritizes this input
priority: high
rate_limit: 60/min
