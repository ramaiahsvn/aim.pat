# =============================================================================
#  Windows Host Inventory  —  01-dendrite (Resources / Inputs)
#  na-003/012 patwin-laptop
#
#  >>> THIS IS THE ONLY PLACE A HOST ADDRESS IS RECORDED. <<<
#  Edit it before activating the agent. No script, workflow, memory entry or
#  deliverable in this agent may hardcode an IP — they all resolve through here.
#
#  If a machine's IP changes, change `address` below and nothing else.
#  Leave `address` empty to fall back to `hostname` (mDNS / DNS resolution),
#  which survives DHCP churn.
#
#  Read it with:   ./01-dendrite/connectors/win-ssh.sh --list
#  Connect with:   ./01-dendrite/connectors/win-ssh.sh <host-id> [command...]
# =============================================================================

id: connector-windows-hosts
name: "Windows Host Inventory"
type: ssh-host                 # extends the _template.yaml enum (ssh is not an MCP connector)
protocol: ssh
version: "1.0"

# Which host is used when no id is given on the command line
default_host: mces2

# How an address is resolved: `address` wins; if blank, `hostname` is used.
resolution_order: [address, hostname]

hosts:
  - id: mces2
    label: "cPerso / MCES2 station"
    # ---- TAILSCALE address (2026-08-14). Reachable from ANY network, not just the LAN.
    #      Tailscale pins this 100.x per node, so unlike the old DHCP lease it does not
    #      drift -- which is exactly the failure this replaced. Do not put the LAN
    #      address back.
    #      NOT the MagicDNS name `mces2`: both ends run --accept-dns=false, so tailnet
    #      names deliberately do not resolve. The 100.x IP is the only working handle.
    address: "100.92.81.14"
    # LAN address, reference only: 192.168.1.235 -- works solely from 192.168.1.0/24.
    # ---- used automatically when `address` is empty ----
    hostname: "mces2.lan"
    port: 22
    # REQUIRED before connecting — the agent must refuse to guess this
    user: "MCESII"
    # true = account is in the Administrators group, so sshd reads
    #        %ProgramData%\ssh\administrators_authorized_keys, NOT ~\.ssh\authorized_keys.
    # null = not yet known; enable-ssh.ps1 reports it.
    # INFERRED true (elevation guard passed, so the account can elevate) but NOT yet
    # proven by the script's own group-membership test, which runs later in step [3].
    # Left null on purpose: enable-ssh.ps1 decides the key path itself, so nothing
    # depends on guessing this correctly here.
    admin_account: true
    identity: "~/.ssh/id_ed25519_qitest_win"
    # Confirmed 2026-08-11: the PowerShell transcript from this machine reports
    # "Machine: MCES2" and "Username: MCES2\MCESII", matching mces2.lan at this address.
    confirmed: true
    purpose: >
      Bpr.QiScript 2.22.28 first Windows run — intended to have the PC/SC reader and
      the test card. NOTE: the reader has NOT been enumerated yet, so that part is
      still unverified.
    observed:
      # Probes on 2026-08-11 from pat-m4p (192.168.1.107/24, gw 192.168.1.1):
      # 445/tcp OPEN (SMB); 22, 3389, 5985 CLOSED. ICMP replied on some runs and not
      # others — informational only, never a verdict (see the note in 03-nucleus).
      # 2026-08-14 from pat-m4p over Tailscale: tailscale ping -> pong 17ms, TCP 22 open,
      # key auth verified (hostname MCES2, user mces2\mcesii, Windows 10.0.26200.9168).
      last_probe: "2026-08-14"
      ports_open: [22, 445]
      ports_closed: [3389, 5985]
      ssh_ready: true           # OpenSSH_for_Windows_9.5, key auth verified 2026-08-11
      tailscale:
        installed: "2026-08-14"
        ip4: "100.92.81.14"
        hostname: "mces2"       # MagicDNS name; does NOT resolve, see address note above
        tailnet_account: "np.ramaiah@"
        flags: "--unattended --accept-dns=false --hostname=mces2"
        install_route: "vendor MSI from pkgs.tailscale.com -- winget has no package on this box"
      jvm_present: true         # NOT on PATH - Android Studio's bundled JDK
      jvm_path: "C:\\Program Files\\Android\\openjdk\\jdk-21.0.8\\bin\\java.exe"
      jvm_version: "21.0.8"
      jvm_bits: 64              # amd64 only - CANNOT exercise the windows-32 __stdcall fix
      javac_present: true
      scardsvr: "RUNNING"
      pcsc_readers:
        - "HID Global OMNIKEY 5422 Smartcard Reader 0"      # contact - use this for crName
        - "HID Global OMNIKEY 5422CL Smartcard Reader 0"    # contactless
      os: "Windows NT 10.0.26200.0"
      powershell: "5.1.26100.8457 (Desktop)"
      machine_name: "MCES2"
    notes: >
      First found via this Mac's ARP cache as mces2.lan; the name matches
      trp1002.cperso.mces2 in the cPerso repo, and the transcript confirmed it.
      TeamViewer reaches this box but provides no IP route, and cannot be driven from
      the Mac at all — it stays a human-only fallback.
      RESOLVED 2026-08-11: the `Add-WindowsCapability -Online OpenSSH.Server` "pending
      operations" failure cleared itself once Windows Update finalised; sshd installed
      with no intervention. Kept only so the error is recognised if it recurs.
      RESOLVED 2026-08-14: reachability no longer depends on being on the same /24.
      Tailscale now carries SSH from any network, so the old "SSH is viable because it
      sits on the same /24 as pat-m4p" caveat no longer applies.

