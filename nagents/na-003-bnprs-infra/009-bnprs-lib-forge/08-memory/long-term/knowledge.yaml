  - id: mem-001
    type: technical_knowledge
    content: >-
      PUBLISH WITH THE WORKFLOW SCRIPT, NOT HAND-ROLLED CURL:
      04-axon/workflows/publish-library.sh --lib <L> --version <X.Y.Z>. It collects every platform
      subdir under bpr.cpp/build/bnprs-libs/<Lib>/v<ver>/, generates .sha256 sidecars and
      manifest.json, uploads, then RE-DOWNLOADS each file and compares hashes. It also has an
      immutability guard that refuses to overwrite an already-published version without --force.
      Always run --dry-run first: it prints the exact PUT list, which is how you catch a missing or
      mis-staged platform BEFORE anything is immutable. This agent publishes only; builder agents
      produce the artifacts.
    created_at: "2026-08-01"
    last_accessed: "2026-08-01"
    access_count: 1
