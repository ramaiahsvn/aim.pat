# =============================================================================
#  PUBLISHED-LIBRARY INDEX — bnprs-lib-forge (na-003 / 009)
# =============================================================================
#  Tracks what has actually been PUBLISHED to the GitLab Package Registry.
#  Registry host project: bpr1000/bnprs-libs (Generic Packages).
#  Identifier scheme:  package=<Lib>  version=<SemVer>  file=<platform>/<file>
#  Update this after every successful publish (immutable — never edit past entries).
# =============================================================================

registry:
  gitlab_url: "https://gitlab.bnprs.ai"
  api_base: "https://gitlab.bnprs.ai/api/v4"
  host_group: "BPR1000"              # GitLab group id 118 ("BPR1000 - License")
  host_project_path: "BPR1000/bpr1000.bnprs-libs"
  host_project_id: 230               # created 2026-05-30, private, packages enabled
  http_url: "https://gitlab.bnprs.ai/BPR1000/bpr1000.bnprs-libs.git"
  format: "generic"
  filename_slash_supported: true     # verified 2026-05-30 on CE 18.9 — <platform>/<file> works (no flattening needed)
  # Multi-SDK endpoints on the SAME project 230 (all verified 2026-06-01): maven, nuget, go.
  # PUBLISH AUTH (differs per format!):
  #   generic → PRIVATE-TOKEN header
  #   nuget   → HTTP Basic ONLY (--user <user>:<token>); PRIVATE-TOKEN header → 401
  #   maven   → Private-Token header (HTTP 200)
  #   go      → NO upload endpoint; tag-based (Go proxy serves SemVer git tags from a repo)
  nuget_push_endpoint: "https://gitlab.bnprs.ai/api/v4/projects/230/packages/nuget/"
  maven_endpoint: "https://gitlab.bnprs.ai/api/v4/projects/230/packages/maven"
  go_proxy: "https://gitlab.bnprs.ai/api/v4/projects/230/packages/go"  # consume-only; publish via git tag

# Latest declared source versions (per src/AprCommon/BprVersions/bpr_versions.h, 2026-05-30)
# These are the versions to publish once builders hand off artifacts.
source_versions:
  BprIDEngine: "2.24.901"   # consolidated engine (all six modalities behind the BprID_* ABI).
                            # .900 is deliberate: 6xx-8xx is reserved for per-modality releases.
                            # .901 (2026-08-01) is NOT a drop-in for .900 — knuckle moved from
                            # modality 0x4C to 0x4F, so T33->T61 / M32->M61 and 0x4C03 / 0x4C02
                            # are RETIRED, not aliased. A knuckle template stored under .900 is
                            # rejected and must be re-enrolled. ABI change is additive only.
  BprLicBase: "2.27.4"
  BprFace:    "2.24.116"
  BprCardQi:  "2.56.7"
  BprCardEmv: "2.57.1"
  BprICBA:    "2.58.1"
  BprFinger:  "2.24.203"
  BprIris:    "2.24.500"
  # BprQiEmv 2.50.11 — DEPRECATED, do not publish

# --- PLANNED, NOT YET PUBLISHED -------------------------------------------------------------
# Per-modality bengine libraries (Bpr<Modality>: Face / Finger / FingerCless / Iris / Palmprint /
# OtherBio, the BENGINE_BUILD_* targets). User decision 2026-08-01: YES they will be published,
# but NOT NOW. Only the consolidated BprIDEngine 2.24.901 is in the registry today. Their absence
# is deliberate — do not "fix" it by publishing them.
# Two preconditions, both open:
#   1. NAME COLLISION — BprFace already exists as its own product line (2.24.116, patch range 1xx,
#      built from a different tree with a different ABI). A bengine per-modality "BprFace" would
#      clash on coordinates while differing in behaviour. Registry versions are IMMUTABLE, so the
#      naming scheme must be settled BEFORE the first upload, not after.
#   2. LICENSING — BprFinger is FingerJetFX (LGPL question open with na-002-bnprs-core).
# Gate: every family library must pass bengine tests/proof_gate.sh (identical BprID_* export set).

