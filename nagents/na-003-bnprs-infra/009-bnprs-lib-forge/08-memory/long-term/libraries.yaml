  # --- BprFace 2.24.116 — LICENCE ENFORCEMENT (na-004/001 build, forge publish) --------------
  - package: "BprFace"
    package_type: "generic"
    version: "2.24.116"
    project_id: 230
    source_repo: "bpr.cpp"
    source_commit: "4276770"
    built_by: "na-004/001 cpp-face"
    published_by: "na-003/009 bnprs-lib-forge"
    published_at: "2026-08-01"
    platforms: [macos, linux-arm64, linux-x64, windows-32, windows-64]
    breaking: >-
      LICENSING IS NOW ENFORCED. Through 2.24.115 the qiCode argument and its length were
      accepted and then IGNORED — a constant compiled into the binary was validated instead, so
      any code passed, including an empty or garbage one. 116 validates the caller's bytes and
      fails closed on null, empty or negative length. A HOST PASSING A PLACEHOLDER qiCode
      SUCCEEDS ON 115 AND FAILS ON 116. Affects Bpr_FaceRecog_T12_Init, Bpr_FaceDetect_T12_Init,
      Bpr_SmokeDetect_T12_Init, Bpr_FightDetect_T12_Init. The fix (8dd621a) landed ten days
      after 115 shipped and the version was never bumped, so the 115 ARTIFACT and current source
      share a number and disagree in behaviour — that is why this is 116, not a re-release.
    windows_not_self_contained: >-
      libBprFace.dll IMPORTS libBprFaceDeps.dll (OpenCV, split out to keep the main DLL small).
      Both must ship together, plus bpr.model.onnx and the ffmpeg DLL. The 2.24.115
      native-manifest.json listed only three binaries and omitted BOTH Windows platforms — a
      consumer trusting it would have deployed a DLL that cannot load. 116's manifest lists all 9.
    version_lives_in_three_files: >-
      bpr_versions.h, bpr_versions.cmake AND the root Makefile. Bumping only the header builds a
      binary still named 2.24.115 — the name comes from the other two.
    files:
      - "{macos,linux-arm64,linux-x64}/libBprFace.{dylib,so}[.2.24.116] (+ .sha256)"
      - "{windows-32,windows-64}/{libBprFace.dll,libBprFaceDeps.dll,opencv_videoio_ffmpeg*.dll,bpr.model.onnx}"
      - "manifest.json"
