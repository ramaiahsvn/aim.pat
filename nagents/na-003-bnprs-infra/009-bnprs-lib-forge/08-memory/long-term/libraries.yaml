      BprVideo 2.60.1 ∩ BprVision 2.61.1 = 1 symbol, Bpr_FaceVideo_Streaming.
      So BprFace PAIRS SAFELY with either. Only BprVideo and BprVision genuinely collide, on that
      one symbol, and a P/Invoke or JNA host binds per (library, symbol) so even that resolves
      deterministically — the real hazard is a host that dlopens both with RTLD_GLOBAL.
      THE RULE IS VERSION-DEPENDENT, WHICH IS WHY IT WENT STALE. At 2.60.0/2.61.0 the libraries
      still re-exported static OpenCV: ~1327 and ~2545 exports with ~1325 shared (≈1060 cv::
      functions plus libwebp SharpYuv*/WebP* and C++ runtime), and on ELF the first library loaded
      wins all of them by interposition, silently. "Load exactly one" was CORRECT for .0 and is
      WRONG for .1. Never quote an overlap figure without the version it was measured on.
      STILL TRUE FOR BprIDEngine: it carries every modality plus the streaming extension — do not
      pair it with a per-modality library.
