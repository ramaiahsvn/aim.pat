    source_repo: "bpr.cpp"
    source_commit: "76c9152"
    built_by: "na-004/007 cpp-bengine"
    published_by: "bnprs-lib-forge (na-003/009)"
    published_at: "2026-08-01T06:52:22Z"
    size: "110 MB (natives ~14-20 MB each + 44 MB models shared once)"
    registers:
