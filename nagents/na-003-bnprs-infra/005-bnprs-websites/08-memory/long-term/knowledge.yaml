  - id: mem-012
    type: incident
    content: >
      2026-08-20: bnprs.in contact form broken — ROOT CAUSE FOUND. Form posts to Lambda Function
      URL https://lilbfbto4ngczeypuduituohte0cusba.lambda-url.ap-south-1.on.aws/ (function
      bnprs-contact-form, ap-south-1, nodejs22.x — NOTE ap-south-1, not the usual ap-south-2).
      CORS preflight (OPTIONS) returns 200 but every POST/GET returns 403 "Forbidden ...
      Function URL authorization". AuthType is NONE and the old FunctionURLAllowPublicAccess
      (lambda:InvokeFunctionUrl) statement exists, but since AWS's October 2025 change a SECOND
      resource-policy statement is required: lambda:InvokeFunction with condition
      lambda:InvokedViaFunctionUrl=true. Direct CLI invoke works (function code is fine); no
      CloudWatch log group exists (requests die at the front door). Fix command (classifier
      blocked Claude from running it — needs user):
      aws lambda add-permission --function-name bnprs-contact-form
      --statement-id FunctionURLInvokeFunctionAllowPublicAccess --action lambda:InvokeFunction
      --principal "*" --invoked-via-function-url --profile bnprs --region ap-south-1.
      Also noted: bnprs.com's form is decorative (no action/name/handler in
      bpr2004.bnprs.com/src/pages/index.astro:303) — wire it like bnprs.in's (and add its origin
      to the function URL CORS AllowOrigins) if it should work. Function URL CORS currently
      allows only bnprs.in, www.bnprs.in, d5wdai0sk03wf.cloudfront.net.
      RESOLVED 2026-08-20: user ran the add-permission command; POST now returns 200
      {"success":true}. Verified full chain: Lambda logs clean (872ms), code sends via SES
      ap-south-1 info@bnprs.in -> info@bnprs.in (Reply-To = visitor email). SES account is in
      SANDBOX (ProductionAccessEnabled false, 200/day quota) but that is fine because the only
      recipient info@bnprs.in is a verified identity (VerificationStatus Success). If auto-reply
      /confirmation emails to visitors are ever wanted, SES production access is required first.
    created_at: "2026-08-20"
    confidence: 1.0
    tags: [incident, contact-form, lambda, function-url, 403, bnprs.in, bnprs.com, ap-south-1]

