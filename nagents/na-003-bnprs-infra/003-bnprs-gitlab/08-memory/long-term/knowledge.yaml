  - id: mem-031
    type: technical_knowledge
    content: >-
      2026-08-11 BLAST-RADIUS MAP for the wgate->bruid rename ([[mem-030]]), and what a project rename
      does NOT carry with it.
      ZERO CI/SUBMODULE COUPLING — authoritative: `.gitlab-ci.yml` and `.gitmodules` were fetched from
      ALL 230 projects via the FILES API (not search, so not rate-limited); no `include:`, no `trigger:`,
      no submodule anywhere references wgate or bpr1007. Also clean: no deploy tokens, no deploy keys,
      no CI/CD variables (project or group) containing wgate. Each of the 6 job-token allowlists holds
      only itself, and project 230's allowlist has 2 entries, neither a wgate project.
      CONTAINER REGISTRY: all 6 had ZERO images, so the "images do not follow a project rename" trap did
      not apply here. It still applies in general — check registry/repositories BEFORE any future rename.
      WHAT A RENAME DOES NOT FIX — MAVEN PACKAGE COORDINATES. Project 16 publishes
      org/bnprs/wgate/cas/card-auth-server-extensions and ...-integrations. Package names are independent
      of project path, so consumers keep pulling "wgate" coordinates until republished under new ones.
      THE wgate ESTATE SPANS MORE THAN BPR1007 — renaming that group covered only part of it. External
      source references remain in: BPR1005/bpr1005.bpass.engine (Java pkg org/bnprs/wgate/bengine/... +
      pom.xml — this is the "bengine" that the eu-central-1 wgate-uat-bengine ALB serves, and it explains
      why no bengine repo exists under BPR1007), BPR1010/bpr1010.misc.dev-playground (a whole
      "WGate Connect/" Android tree, com.bnprs.wgateconnect), and BPR1003/bpr1003.patpos.core
      (ECR.vcxproj, EcrService.bat). Counts are FLOORS — search pages cap at 100.
      GOTCHA — THE SEARCH API SILENTLY DEGRADES. GitLab throttles /search at roughly 30 req/min and
      returns HTTP 429. A sweep that does not check for 429 will skip most projects and still print a
      confident total: the first pass here reported "155 hits" that was largely built from errors, and
      had to be discarded and re-run paced. SAME CLASS OF BUG as a scan that reports clean because it
      examined nothing. RULE: when sweeping this instance, pace under 30/min, assert the HTTP status of
      every call, and prefer the Files API over /search whenever the filename is known.
    created_at: "2026-08-11"
    confidence: 1.0
