  - id: mem-jobtoken-230-allowlist
    type: technical_knowledge
    content: >-
      CI THAT PULLS FROM bnprs-libs (project 230) NEEDS TO BE ON 230's JOB-TOKEN ALLOWLIST. Project
      230 has inbound_enabled=true on its CI/CD job-token scope, so a CI_JOB_TOKEN from another
      project can only resolve packages from 230 if that project is on
      /projects/230/job_token_scope/allowlist. On 2026-08-02 the allowlist had been narrowed to
      [230] (itself only), which broke every external consumer using CI_JOB_TOKEN — surfacing as
      Maven "artifact absent" (e.g. ai.bnprs:nativesdk-bpridengine:2.24.902 absent) even though the
      jar+pom are present and downloadable with a PRIVATE-TOKEN. A 401 from the registry manifests
      as a not-found in Maven resolution, so it LOOKS like a missing/wrong version — it is not.
      SmartPresence (project 34) pipeline #3043+ failed this way; #3042 passed before the narrowing.
      FIX: POST /projects/230/job_token_scope/allowlist?target_project_id=<consumer>. Added 34 on
      2026-08-02. SmartPresence build passes MAVEN_TOKEN=$CI_JOB_TOKEN into the Dockerfile, mvn auth
      is settings.xml server bnprs-libs = gitlab-ci-token/${MAVEN_TOKEN}.
      DIAGNOSIS RULE: "artifact absent" from a 230 registry in CI, when the artifact resolves fine
      with a PRIVATE-TOKEN, is an ALLOWLIST/auth problem, not a missing package. Bumping the version
      will not help. Only project 34 currently references 230 in a pom (checked 18/19/20/33/36/37);
      the bNet .NET apps consume via nuget/generic, not this maven path.
      UPDATE 2026-08-02 (deeper root cause + real fix): the allowlist is necessary but NOT sufficient
      with $CI_JOB_TOKEN. GitLab gates job-token cross-project PACKAGE reads on the pipeline's
      TRIGGERING USER having access to the target project; the registry returns 404 (Maven "absent")
      — NOT 401 — when the user lacks it. So SmartPresence built for admins (root, #3051) and 404'd
      for developers (Harani1020, no membership in 230, #3058). Registry auth codes confirmed: bad/no
      creds = 401, unauthorized-user = 404. FIX APPLIED: switched ci/settings.xml + .gitlab-ci.yml from
      gitlab-ci-token/$CI_JOB_TOKEN to a read-only GROUP deploy token (user-independent). BPR1000
      (group 118) has read_package_registry deploy tokens: id=1 bnprs-libs-readonly (team), id=3
      -charan, id=4 -harani, and id=5 bnprs-libs-ro-utms (created this session for the SmartPresence
      CI). Deploy-token secret stored ONLY as masked CI var MAVEN_TOKEN in project 34; settings.xml
      username=bnprs-libs-ro-utms (usernames are not secret). Commit 0cfc40be, pipeline #3077.
      RULE: for CI pulling another project's packages, prefer a read-only deploy token over
      $CI_JOB_TOKEN — the job token's package access depends on who pushed, which is a latent
      works-for-me trap.
    created_at: "2026-08-02"
    last_accessed: "2026-08-02"
    access_count: 1
