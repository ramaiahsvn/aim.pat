  - id: mem-003
    type: technical_knowledge
    content: >-
      2026-08-11 ACCESS ROUTES to the target Windows PC, and what is genuinely possible.
      CANNOT be driven from this Mac: the TeamViewer DESKTOP APP. There is no macOS GUI control
      available here — only a shell on the Mac plus Chrome page automation (and the Chrome
      extension was not even connected). Driving a remote desktop through a video canvas by
      screenshot-and-click was rejected as unreliable for command entry and unsafe given the last
      step writes irreversibly to a card.
      SSH SETUP IN PROGRESS (user chose this route). A dedicated throwaway keypair was generated
      on the Mac, separate from the user's existing id_ed25519:
        private ~/.ssh/id_ed25519_qitest_win   (no passphrase — needed non-interactively)
        public  ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKub+SnGuT7LDF35xGkqsb+EEm9If8aPx0I9r2XfKztE
                claude-code-qitest-20260811
        fingerprint SHA256:1cEhqhCjmx+QLy2UyYr8z4BMpAeGbvKSPMabYrdoh2M
      CLEAN UP when the task is done: delete both key files and remove the authorized_keys line
      on the Windows side. Do not leave a long-lived passwordless key installed.
      STILL NEEDED FROM THE USER: the PC's hostname/IP, the Windows username, whether that
      account is an Administrator, and confirmation that sshd is running.
      HARD CAVEAT: SSH only works if there is an actual IP route from the Mac to that PC.
      TeamViewer is its own relay and provides no route. If the PC is on another network or behind
      NAT, fall back to the ONE-SHOT SCRIPT pattern: ship a self-contained zip plus a run-test.cmd
      that locates the JVM, verifies the DLL hash, lays out the working directory, runs once with
      no card, prompts for the test card, runs again, and writes a log the user pastes back.
      WINDOWS OPENSSH ADMIN TRAP (recorded because it is the usual cause of "key ignored"):
      sshd_config has a `Match Group administrators` block redirecting to
      C:\ProgramData\ssh\administrators_authorized_keys. For an admin account the key MUST go
      there, and the file needs
        icacls <f> /inheritance:r /grant "Administrators:F" /grant "SYSTEM:F"
      or sshd rejects it as "bad ownership or modes" and silently falls back to a password prompt.
