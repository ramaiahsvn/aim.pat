  - id: mem-002
    type: project_context
    content: >-
      2026-08-11 STATE OF THE TARGET WINDOWS PC (the blocker to resolve first).
      The PC is reachable by the user over TeamViewer, already connected. Findings so far:
        * `javac` is NOT recognised — no JDK on PATH.
        * `java` is ALSO not recognised — there is NO JVM on that box at all.
      A JVM is unavoidable: the JNI library IS the card-I/O path. The C-ABI sibling
      (QiScript/gnd/capi -> QiGndPerso.dll) does NOT help — its own README states it is pure
      computation that "never touches a reader", card I/O stays in the host app, and its Java
      binding needs a JVM anyway. So: no JVM, no test.
      NEXT STEPS, in order:
        1. Look for a JRE bundled inside another installed app before downloading anything:
           `where /R "C:\Program Files" java.exe` and the (x86) equivalent.
        2. Otherwise a PORTABLE ZIP JDK/JRE — unzip to e.g. C:\jdk and call by full path. No
           installer, no admin, no PATH change. These perso stations are locked down (see
           na-005/002 mem-003), so the zip route is the right one. Can be downloaded on the Mac
           and carried over if the PC has no internet.
        3. BITNESS DECISION: a 64-bit JVM only loads windows-64. To exercise the build that was
           actually broken (windows-32, the cdecl/__stdcall corruption) a 32-bit JVM is needed.
           Azul Zulu reliably publishes Windows x86 32-bit zips; Temurin's 32-bit coverage varies
           by version. With only a 64-bit JVM the run still validates the -444/QiFA fix and the
           card transaction, but NOT the JNICALL fix, since x64 was never affected.
      A PRECOMPILED CLASS IS READY so no javac is needed on the target — class-file version 52,
      runs on any JRE 8+. It is the released qiScript.java with ONLY main() changed: reader name,
      data file, card number, offset and protocol are now argv with the released values as
      defaults, so a wrong reader name can be retried without recompiling. package, class name,
      native method signature and System.loadLibrary are byte-for-byte the release.
      Staged (session scratchpad — RE-CREATE if gone, source is in the release folder):
        scratchpad/qitest-precompiled/com/bnprs/jni/qiScript.class
      Run as: <jdk>\bin\java.exe -Djava.library.path=. com.bnprs.jni.qiScript "<exact reader name>"
