    content: >-
      2026-08-11 HANDOFF IN — first Windows run of Bpr.QiScript 2.22.28 (GnD central perso).
      Handed over from na-005/002 cpp-card-qi, which owns the library but not the machine.
      This agent was created for this task.
      GOAL: run the released JNI library on a physical Windows PC with a PC/SC reader and a TEST
      card, and report the result code. This is the FIRST time these DLLs will run on Windows at
      all — the release README's own "Verification status" section says so explicitly.
      WHAT IS BEING VERIFIED, two fixes from bpr.cpp commit 64b696a (2026-08-07):
        (1) -444 / empty QiFA STORE DATA — a61_QiFA_S_1394_255 was declared and used but never
            assigned, so APDU 39 of 124 went out as a bare case-1 "00E20000" with no Lc and no
            data. Now emitted only when non-empty. EXPECT 123 APDUs instead of 124 when QiFA is
            empty — that is the fix working, not a truncated script.
        (2) __stdcall restored on windows-32 — Temurin 25's jni.h:51 unconditionally redefines
            JNICALL to nothing AFTER jni_md.h, so the x86 entry point compiled cdecl while the
            JVM calls it __stdcall; stack cleaned twice, corruption on the FIRST call. Fixed by a
            wrapper jni.h that #include_next's the JDK header then restores __stdcall.
      ALREADY DONE ON THE MAC (do not redo):
        * Export check on the RELEASED artefacts PASSED — windows-32 exports BOTH
          Java_com_bnprs_jni_qiScript_qiCardTransmit and ...@36; windows-64 exports one. This is
          the check that proves fix (2) is in the shipped binary, and it had been open since 08-07.
        * The bug was reproduced live by building the PARENT commit 8c088ce with the same
          toolchain: its windows-32 exports only ONE name, no @36. So the check discriminates.
        * Size is NOT a discriminator — released, post-fix rebuild and pre-fix rebuild are all
          byte-identical in size (1,064,036 / 1,084,434); section alignment absorbs the change.
        * mingw PE output is NOT reproducible (27,250 bytes differ between release and rebuild),
          so byte-provenance of the release CANNOT be established. Fix (1) being present follows
          from commit topology (wrapper + QiFA guard landed in the SAME commit, no intermediate
          state), NOT from byte comparison. Keep that distinction if it is ever audited.
      RELEASE FOLDER (self-contained, use this — do NOT write into it, user said so):
        ~/Library/CloudStorage/ZohoWorkDriveTrueSync-bnprs/Z_RELEASE/TRP1002-cPerso/
          BprQiScript.2/_GnD/2.22.28/
        contains windows-32/ + windows-64/ Bpr.QiScript.dll, com/bnprs/jni/qiScript.java,
        ErrorCodes, and CRUCIALLY qiscript.ini (licence, 16 B) + qiscript.c.perso-bio.dat
        (19,508 B — offset 1648 is inside the record). qiScript.java and ErrorCodes are
        byte-identical to the repo copies.
        MISSING from the release: README.md and SHA256SUMS.txt (the README's own Files list claims
        the latter ships). Since the DLL has no VS_VERSION_INFO and no bpr_versions.h entry,
        sha256 is the ONLY identifier. Expected values:
          windows-32  aab1eefc392e72b58e0c4c3f37e91b2892a8a27a317cfa16f061eecda9af7e55
          windows-64  918415ce493e7dcb25cf8cf63a18ea411abee15c86170b9d97037fea73093031
      Verify on Windows with: certutil -hashfile Bpr.QiScript.dll SHA256
